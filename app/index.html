<script>
/* ===== Lớp lưu trữ =====
   LocalStore: lưu trên máy (bản dùng thử).
   Bản thật sẽ thay bằng GoogleSheetsStore với cùng 2 hàm load()/save(), dữ liệu nằm trong Google Drive của shop. */
/* 23/10 anh Thái: ?demo=1 = bản demo cho Sale/CTV mang xuống shop — dữ liệu mẫu, sổ riêng trên máy, không cần Google */
const DEMO=/[?&]demo=1/.test(location.search);
/* 29/10 anh Thái: TÀI KHOẢN TEST FULL TÍNH NĂNG — chạy như bản demo (dữ liệu mẫu lưu trên máy, mọi nút dùng được, không cần Gmail), không hiện thanh QR của Sale */
const TEST=DEMO&&(()=>{try{if(/[?&]test=1/.test(location.search))localStorage.setItem('shopgon_test','1');return localStorage.getItem('shopgon_test')==='1'}catch(_){return /[?&]test=1/.test(location.search)}})();
const KEY=DEMO?'shopgon_demo3':'shopgon_v1';
let memory=null;
/* 25/10 anh Thái: bản chính thức cho vào XEM THỬ ngay (dữ liệu mẫu, không lưu), đăng nhập Gmail lúc nào cũng được; anh duyệt (nhận tiền) mới mở tính năng thật */
let XEM=false,XLIC=null,xTimer=null,NV=null;
const LocalStore={
  load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return memory}},
  save(db){if(XEM)return;memory=db;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
};
const Store=LocalStore;

/* ===== Tiện ích ===== */
const DAY=86400000;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Math.round(n).toLocaleString('vi-VN')+'đ';
const short=n=>Math.abs(n)>=1e9?(n/1e9).toLocaleString('vi-VN',{maximumFractionDigits:2})+' tỷ':Math.abs(n)>=1e6?(n/1e6).toLocaleString('vi-VN',{maximumFractionDigits:1})+'tr':Math.round(n/1000).toLocaleString('vi-VN')+'k';
const parseMoney=s=>{const d=String(s||'').replace(/[^\d]/g,'');return d?+d:0};
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const todayIso=()=>iso(Date.now());
const dmy=s=>{const [y,m,d]=s.split('-');return d+'/'+m+'/'+y};
const nv0=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
const ageDays=m=>Math.max(0,Math.floor((new Date(todayIso())-new Date(m.ngayNhap))/DAY));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const BRANDS=['OPPO','Samsung','iPhone','Xiaomi','vivo','realme','Honor','Nokia','Tecno','Infinix','itel','Masstel','Benco','ZTE','Huawei','Pixel','Khác'];
const BRAND_DEF=['OPPO','Samsung','iPhone','Xiaomi','vivo','realme','Honor','Khác'];
const brandOn=b=>b==='Khác'||(db.shop.brands||BRAND_DEF).includes(b);
const brandsOn=()=>BRANDS.filter(brandOn);
const DV={thuho:['Tiền điện','Tiền nước','Internet, truyền hình','Trả góp hộ','Cước điện thoại','Khác'],ck:['Chuyển khoản hộ','Rút tiền mặt','Nạp tiền ví','Khác']};
const isDv=k=>k==='thuho'||k==='ck';
const KHO=[{k:'pk',t:'Phụ kiện',l:['Cường lực','Ốp lưng','Sạc, cáp','Tai nghe','Loa','Pin dự phòng','Thẻ nhớ, USB','Đồng hồ thông minh','Giá đỡ, gậy selfie','Phụ kiện khác']},{k:'sim',t:'Sim số',l:['Sim số đẹp','Sim thường','Sim data','Thẻ cào','Sim khác']},{k:'sua',t:'Linh kiện sửa chữa',l:['Màn hình','Pin thay thế','Chân sạc','Camera','Loa, mic','Linh kiện khác']}];
const khoOn=()=>KHO.filter(g=>on(g.k));
const khoName={pk:'Phụ kiện',sim:'Sim số',sua:'Linh kiện'};
const loaiOf=h=>h.loai||(h.nhom==='sim'?'Sim khác':h.nhom==='sua'?'Linh kiện khác':'Phụ kiện khác');
const guessBrand=name=>{/*dùng đủ danh sách hãng*/const w=(name||'').trim().split(/\s+/)[0].toLowerCase();const hit=BRANDS.find(b=>b.toLowerCase()===w)||(/^(ip|apple)/.test(w)?'iPhone':/^(redmi|poco)/.test(w)?'Xiaomi':/^(galaxy)/.test(w)?'Samsung':/^(reno|find)/.test(w)?'OPPO':'');return hit||''};
const luhnOk=s=>{if(!/^\d{15}$/.test(s))return false;let sum=0;for(let i=0;i<15;i++){let d=+s[14-i];if(i%2===1){d*=2;if(d>9)d-=9}sum+=d}return sum%10===0};

  async push(){if(this.busy){this.queue();return}this.busy=true;try{const rem=await this.readRemote();const base=this.getBase();
      const m=rem.empty?{...db,pn:db.pn||[],chi:db.chi||[]}:this.merge(base,db,rem);
      const changedLocal=JSON.stringify([m.may.length,m.don.length,m.hang.length,(m.pn||[]).length,(m.chi||[]).length])!==JSON.stringify([db.may.length,db.don.length,db.hang.length,(db.pn||[]).length,(db.chi||[]).length])||m.hang.some((h,i)=>{const o=db.hang.find(x=>x.id===h.id);return !o||o.sl!==h.sl});
      const tbl={May:m.may,Don:m.don,Hang:m.hang,Phieu:m.pn||[],Chi:m.chi||[]};
      const diff=rem.empty||Object.entries(tbl).some(([t,L])=>{const R=rem[this.T[t][0]]||[];return L.length!==R.length||L.some((o,i)=>this.rowOf(t,o)!==this.rowOf(t,R[i]))})||JSON.stringify(m.shop)!==JSON.stringify(rem.shop);
      if(diff){const data=[];
        for(const [t,c] of Object.entries(this.cols)){const rows=tbl[t].map(o=>{const x=t==='Phieu'?{...o,dong:JSON.stringify(o.dong||[])}:o;return c.map(k=>x[k]??'')});data.push({range:t+'!A1',values:[c,...rows]})}
        data.push({range:'CaiDat!A1',values:[['shop'],[JSON.stringify(m.shop)]]});

        await this.api(`https://sheets.googleapis.com/v4/spreadsheets/${this.sheetId}/values:batchUpdate`,{method:'POST',body:JSON.stringify({valueInputOption:'RAW',data})})}
      const keep={sample:db.sample};db=Object.assign(m,{v:1,sample:false});this.setBase(db);Store.save(db);
      if(changedLocal&&typeof render==='function'&&!document.querySelector('input:focus,textarea:focus'))render();
      ggStatus('Đã lưu lên Google Drive');}catch(e){ggStatus('Chưa lưu được lên Drive, sẽ thử lại');this.queue(15000)}finally{this.busy=false}},

  /* mở app: có bản gốc thì gộp (giữ đơn bán lúc mất mạng), chưa có thì lấy sổ trên Drive */

};

function monthsList(){const first=live().reduce((m,d)=>d.ngay<m?d.ngay:m,todayIso()).slice(0,7);const out=[];let d=new Date(todayIso().slice(0,7)+'-01');for(let i=0;i<24;i++){const k=iso(d).slice(0,7);out.push(k);if(k<=first&&i>=5)break;d.setMonth(d.getMonth()-1)}return out}

function reportPanel(){
  const t=todayIso(), cur=t.slice(0,7), rm=rptMonth||cur;
  let bars=[], sum;
  if(rptMode==='ngay'){const last=new Date(+rm.slice(0,4),+rm.slice(5),0).getDate();const endD=rm===cur?+t.slice(8):last;
    for(let d=1;d<=last;d++){const k=rm+'-'+String(d).padStart(2,'0');const r=d<=endD?sumRange(k,k):{dt:0,loi:0,may:0,n:0};bars.push({k,l:(d===1||d%5===0)?String(d):'',v:r.loi,r,lbl:'Ngày '+d+'/'+(+rm.slice(5))})}
    sum=sumRange(rm+'-01',rm+'-31');}
  else{const ms=monthsList().slice(0,12).reverse();ms.forEach(k=>{const r=sumRange(k+'-01',k+'-31');bars.push({k,l:'T'+(+k.slice(5)),v:r.loi,r,lbl:mLbl(k)})});

  $('shopName').textContent=db.shop.ten||'Chưa đặt tên shop';
  $('today').textContent=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'][new Date().getDay()]+', '+dmy(todayIso());
  $('mode').textContent=NV?'NV: '+(NV.ten||NV.sdt):DEMO?(TEST?'Tài khoản test':'Bản demo'):XEM?'Xem thử':db.sample?'Dữ liệu mẫu':GG.email?'Đã kích hoạt':'Trên máy này';
  const old=stock().filter(m=>ageDays(m)>45).length;$('dotStock').textContent=old;$('dotStock').hidden=!old;
  ({home:renderHome,sell:renderSell,add:renderAdd,stock:renderStock,rpt:renderRpt,km:renderKmTab,more:renderMore})[view]();
}

  if(b.dataset.cartdel){const c=cart[+b.dataset.cartdel];cart.splice(+b.dataset.cartdel,1);if(c&&c.kid)cart=cart.filter(x=>x.kmOf!==c.kid);render();return}
  if(b.dataset.kmo){kmOpen=true;render();return}
  if(b.dataset.kmx){kmOpen=false;render();return}
  if(b.dataset.kmtab){kmTab=b.dataset.kmtab;render();return}

  if(b.dataset.kmpct){kmGiam(Math.round(cartHang()*b.dataset.kmpct/100/1000)*1000);return}
  if(b.dataset.kmok){kmGiam(parseMoney(($('kmTien')||{}).value||''));return}

const BANKS=[['970436','Vietcombank'],['970415','VietinBank'],['970418','BIDV'],['970405','Agribank'],['970407','Techcombank'],['970422','MB Bank'],['970416','ACB'],['970432','VPBank'],['970403','Sacombank'],['970423','TPBank'],['970441','VIB'],['970443','SHB'],['970437','HDBank'],['970448','OCB'],['970426','MSB'],['970440','SeABank'],['970449','LPBank'],['970431','Eximbank'],['970428','Nam A Bank'],['970409','Bac A Bank'],['970452','KienlongBank'],['970412','PVcomBank']];
const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
function crc16(str){let c=0xFFFF;for(let i=0;i<str.length;i++){c^=str.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function vietqr(bin,acc,amount,info){const mai=tlv('00','A000000727')+tlv('01',tlv('00',bin)+tlv('01',acc))+tlv('02','QRIBFTTA');
  let p=tlv('00','01')+tlv('01','12')+tlv('38',mai)+tlv('53','704')+tlv('54',String(Math.round(amount)))+tlv('58','VN')+tlv('62',tlv('08',info))+'6304';return p+crc16(p)}
const noMark=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^A-Za-z0-9 ]/g,'');
function loadQr(){return window.QRCode?Promise.resolve():new Promise((ok,bad)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';sc.onload=ok;sc.onerror=bad;document.head.appendChild(sc)})}

    <div class="rcls">${lines.map(x=>`<div class="rcl"><div><b>${esc(x.ten)}</b>${x.imei?`<small class="num">IMEI ${x.imei}</small>`:''}${x.bh?`<small>Bảo hành ${x.bh} tháng</small>`:''}</div><b class="num">${x.loai==='km'&&!x.giaBan?'Tặng':money(x.giaBan)}</b></div>`).join('')}</div>
    <div class="rctot"><span>${tot<0?'Shop trả khách':'Tổng tiền'}</span><b class="num">${money(Math.abs(tot))}</b></div>
    ${rcPay!=='no'?(bank?`<div class="qrbox"><div id="qr"></div><div class="qri"><b>${esc(bn||'')}</b><span class="num">${esc(bank.acc)}</span><span>${esc(bank.name)}</span><span class="num">Số tiền: <b>${money(tot)}</b></span><span class="num">Nội dung: ${code}</span></div></div><div class="rcthanks">Quý khách quét mã để chuyển khoản · hoặc trả tiền mặt tại quầy<br>Cảm ơn quý khách!</div>`
      :`<div class="alert amber"><b>Chưa có tài khoản nhận tiền</b><span>Vào Thêm → Cài đặt, nhập ngân hàng và số tài khoản của shop để hiện mã QR.</span></div><div class="rcthanks">Cảm ơn quý khách!</div>`):rcPay==='no'?`<div style="display:flex;flex-direction:column;gap:6px"><label>Khách trả trước<input id="rcTra" inputmode="numeric" class="num" placeholder="0"></label><small style="color:var(--muted)">Phần còn lại ghi vào sổ nợ (Thêm › Đơn đã bán › Khách nợ).${d.khach?'':' Nên nhập tên khách ở đơn để dễ nhắc nợ.'}</small></div>`:''}
  </div>

  if(rcPay!=='no'&&bank){const amt=tot;loadQr().then(()=>{const q=$('qr');if(!q)return;q.innerHTML='';new QRCode(q,{text:vietqr(bank.bin,bank.acc,amt,code),width:220,height:220,correctLevel:QRCode.CorrectLevel.M})}).catch(()=>{const q=$('qr');if(q)q.textContent='Không tải được mã QR, kiểm tra mạng.'})}
}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.rcpay){rcPay=b.dataset.rcpay;renderReceipt()}else if(b.dataset.rcdone)closeReceipt();else if(b.dataset.rcprint)printThuong();else if(b.dataset.rcraw)printRawbt();});

/* ===== Quét mã vạch IMEI =====
   02/11 anh Thái: iPhone quét không ăn → bỏ ZXing JS cũ. Dùng BarcodeDetector có sẵn (Chrome Android), máy không có (iPhone) dùng
   ZXing-C++ WebAssembly tự lưu ở /app/bd/ (barcode-detector 3.2.2 + zxing_reader.wasm). Camera độ phân giải cao, đọc vùng giữa khung,
   kiểm số Luhn của IMEI (loại đọc sai), zoom 2x nếu máy cho (iPhone Pro không lấy nét gần). Nhập kho / kiểm kho: quét liên tục.
   Dự phòng: 📷 Chụp ảnh → ảnh gốc độ nét cao → đọc mã trong ảnh. */
let stream=null, scanTarget=null, scanTimer=null, scanDet=null, scanBusy=false, scanGot=[], scanLast={}, scanTorchOn=false;
const scanMulti=t=>t==='aImei'||t==='kkIn';
const imeiOk=s=>{if(!/^\d{15}$/.test(s))return false;let sum=0;for(let i=0;i<15;i++){let d=+s[i];if(i%2===1){d*=2;if(d>9)d-=9}sum+=d}return sum%10===0};
function loadBd(){if(window.BarcodeDetectionAPI)return Promise.resolve();return new Promise((ok,bad)=>{const s=document.createElement('script');s.src='/app/bd/ponyfill.js?v=322';s.onload=ok;s.onerror=bad;document.head.appendChild(s)})}
async function getDet(){if(scanDet)return scanDet;
  try{if('BarcodeDetector' in window){const f=await BarcodeDetector.getSupportedFormats();if(f.includes('code_128')){scanDet=new BarcodeDetector({formats:['code_128','code_39','ean_13']});return scanDet}}}catch(_){}
  await loadBd();const A=window.BarcodeDetectionAPI;A.setZXingModuleOverrides({locateFile:(p,pre)=>p.endsWith('.wasm')?'/app/bd/zxing_reader.wasm':pre+p});
  scanDet=new A.BarcodeDetector({formats:['code_128','code_39','ean_13']});return scanDet}
/* chọn IMEI từ các mã đọc được: hộp máy có IMEI1 (trên) + IMEI2 (dưới) → lấy cái trên cùng */
function pickImei(r){const L=r.map(x=>({s:String(x.rawValue||'').replace(/\D/g,''),y:x.boundingBox?x.boundingBox.y:0})).filter(x=>imeiOk(x.s)).sort((a,b)=>a.y-b.y);return L}
let scanCv=null;
async function scanFrame(){const v=$('cam');if(scanBusy||!v||!v.videoWidth)return;scanBusy=true;
  try{const W=v.videoWidth,H=v.videoHeight;scanCv=scanCv||document.createElement('canvas');
    /* vùng giữa khung (dải ngang) ở độ phân giải gốc — mã IMEI nhỏ, đọc cả khung dễ trượt */
    const ch=Math.round(H*.5),cy=Math.round(H*.25);scanCv.width=W;scanCv.height=ch;const g=scanCv.getContext('2d',{willReadFrequently:true});g.drawImage(v,0,cy,W,ch,0,0,W,ch);
    /* cả khung trước (thấy đủ IMEI1 + IMEI2 → luôn lấy IMEI1 trên cùng, máy nào cũng ra cùng 1 số), không thấy thì đọc dải giữa */let L=pickImei(await scanDet.detect(v));if(!L.length)L=pickImei(await scanDet.detect(scanCv));
    if(L.length)gotImei(L)}catch(_){}finally{scanBusy=false}}
function gotImei(L){const s=L[0].s,now=Date.now();
  if(!scanMulti(scanTarget)){gotCode(s);return}
  /* quét liên tục: bỏ mã vừa quét, bỏ IMEI2 cùng hộp (thấy cùng khung với IMEI1) */
  L.slice(1).forEach(x=>scanLast[x.s]=now+60000);if(scanLast[s]&&scanLast[s]>now)return;scanLast[s]=now+4000;
  if(scanGot.includes(s)){$('scanMsg').textContent='✓ '+scanGot.length+' máy · máy …'+s.slice(-6)+' đã quét, đưa hộp khác vào';return}
  scanGot.push(s);try{navigator.vibrate&&navigator.vibrate(60)}catch(_){}const f=document.querySelector('.scf');if(f){f.classList.add('ok');setTimeout(()=>f.classList.remove('ok'),400)}
  $('scanMsg').textContent='✓ '+scanGot.length+' máy · quét tiếp hộp khác';drawScanList()}
function drawScanList(){const el=$('scanList');el.hidden=!scanGot.length;el.innerHTML=scanGot.map((s,i)=>`<div><span class="num">${i+1}. ${s}</span><button type="button" data-scdel="${i}" aria-label="Bỏ">✕</button></div>`).join('')}
async function openScan(target){
  scanTarget=target;scanGot=[];scanLast={};const box=$('scan'),msg=$('scanMsg');box.hidden=false;drawScanList();$('scanClose').textContent=scanMulti(target)?'Xong':'Đóng';$('scanTorch').hidden=true;
  msg.textContent='Đang mở camera…';
  try{await getDet()}catch(e){msg.textContent='Chưa tải được bộ đọc mã (kiểm tra mạng). Bấm 📷 Chụp ảnh hoặc gõ IMEI bằng tay.';return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg.textContent='Trình duyệt này không mở được camera. Bấm 📷 Chụp ảnh, hoặc gõ IMEI (bấm *#06# để xem).';return}
  try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});
    const v=$('cam');v.srcObject=stream;await v.play();
    const tr=stream.getVideoTracks()[0],cap=tr.getCapabilities?tr.getCapabilities():{};const adv={};
    if(cap.focusMode&&cap.focusMode.includes('continuous'))adv.focusMode='continuous';
    if(cap.zoom&&cap.zoom.max>=2)adv.zoom=Math.min(2,cap.zoom.max);
    if(Object.keys(adv).length)try{await tr.applyConstraints({advanced:[adv]})}catch(_){}
    if(cap.torch)$('scanTorch').hidden=false;
    msg.textContent=scanMulti(target)?'Đưa mã IMEI vào khung xanh · quét liên tục từng hộp':'Đưa mã vạch IMEI vào khung xanh, cách 15–20 cm';
    scanTimer=setInterval(scanFrame,220);
  }catch(err){msg.textContent='Không mở được camera. Cho phép camera trong Cài đặt, hoặc bấm 📷 Chụp ảnh.'}
}
async function scanPhoto(f){const msg=$('scanMsg');if(!f)return;msg.textContent='Đang đọc ảnh…';
  try{await getDet();const bmp=await createImageBitmap(f);let L=pickImei(await scanDet.detect(bmp));
    if(!L.length){/* thử thu nhỏ + xoay ngang/dọc */const c=document.createElement('canvas'),k=Math.min(1,2000/Math.max(bmp.width,bmp.height));
      for(const rot of [0,90]){const w=Math.round(bmp.width*k),h=Math.round(bmp.height*k);c.width=rot?h:w;c.height=rot?w:h;const g=c.getContext('2d');g.save();if(rot){g.translate(h,0);g.rotate(Math.PI/2)}g.drawImage(bmp,0,0,w,h);g.restore();L=pickImei(await scanDet.detect(c));if(L.length)break}}
    if(!L.length){msg.textContent='Không thấy mã IMEI trong ảnh. Chụp gần hơn, đủ sáng, mã nằm ngang.';return}
    if(scanMulti(scanTarget)){gotImei(L)}else gotCode(L[0].s)}catch(_){msg.textContent='Không đọc được ảnh, thử lại.'}}
function closeScan(){clearInterval(scanTimer);scanTimer=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('scan').hidden=true;
  if(scanMulti(scanTarget)&&scanGot.length){const el=$(scanTarget);if(el){if(scanTarget==='aImei'){const cu=el.value.split(/\s+/).filter(Boolean);el.value=[...cu,...scanGot.filter(s=>!cu.includes(s))].join('\n');toast('Đã quét '+scanGot.length+' IMEI')}else scanGot.forEach(s=>kkAdd(s))}scanGot=[]}}
function gotCode(code){closeScan();const el=$(scanTarget);if(!el)return;
  if(scanTarget==='aImei'){el.value=(el.value.trim()?el.value.trim()+'\n':'')+code;toast('Đã quét '+code)}
  else{el.value=code;el.dispatchEvent(new Event('input',{bubbles:true}))}}
$('scanClose').addEventListener('click',closeScan);
$('scanPhoto').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';scanPhoto(f)});
$('scanTorch').addEventListener('click',async()=>{try{const tr=stream&&stream.getVideoTracks()[0];scanTorchOn=!scanTorchOn;await tr.applyConstraints({advanced:[{torch:scanTorchOn}]})}catch(_){}});
$('scanList').addEventListener('click',e=>{const b=e.target.closest('[data-scdel]');if(!b)return;scanGot.splice(+b.dataset.scdel,1);drawScanList()});

/* 23/10: QR thanh toán gói ngay trên màn chờ duyệt — TK nhận tiền + bảng giá lấy từ máy chủ (tab CauHinh), không ghi trong code */
let payGoi=0, payLic=null;

      db.may=db.may.filter(m=>!(m.pn===p.id&&m.ten===d.ten&&m.tt==='ton'));const sold=ms.filter(m=>m.tt!=='ton').map(m=>m.imei);if(ton.length||sold.length)back.push({...d,imeis:ton,daBan:sold});return}
    const h=db.hang.find(x=>x.id===d.id);if(h){const tru=Math.min(d.sl,Math.max(0,h.sl));h.sl-=tru;if(tru)back.push({...d,sl:tru})}else back.push({...d,id:''})});
  db.pn=(db.pn||[]).filter(x=>x.id!==p.id);return {back,ban}}

let KK=(()=>{try{return JSON.parse(localStorage.getItem('shopgon_kk')||'null')||{q:[],luc:''}}catch(_){return {q:[],luc:''}}})(),kkTab='may',kkDel='';
const kkSave=()=>{try{localStorage.setItem('shopgon_kk',JSON.stringify(KK))}catch(_){}};
function kkAdd(raw){const im=String(raw||'').replace(/\D/g,'');if(im.length<6){toast('IMEI chưa đủ số');return}if(KK.q.includes(im)){toast('Đã quét máy này rồi');return}KK.q.push(im);if(!KK.luc)KK.luc=todayIso();kkSave();
  const m=db.may.find(x=>x.imei===im);toast(m&&m.tt==='ton'?'✓ '+m.ten:m?'⚠ Máy này '+(m.tt==='ban'?'đã bán':'không ở tồn kho'):'⚠ IMEI không có trong kho');renderMore();setTimeout(()=>{const i=$('kkIn');if(i)i.focus()},0)}
function renderKiemKho(){const ton=db.may.filter(m=>m.tt==='ton'),qs=new Set(KK.q),ok=ton.filter(m=>qs.has(m.imei)),thieu=ton.filter(m=>!qs.has(m.imei)),thua=KK.q.filter(im=>!ton.some(m=>m.imei===im));
  const tab=(k,t)=>`<button data-kktab="${k}" aria-pressed="${kkTab===k}">${t}</button>`;
  return `<div class="seg" role="group" style="margin-bottom:10px">${tab('may','Điện thoại')}${tab('hang','Phụ kiện, hàng')}</div>`+(kkTab==='may'?`<div class="panel"><h2>📋 Kiểm kho điện thoại</h2>
    <span class="inrow"><input id="kkIn" inputmode="numeric" placeholder="Quét / gõ IMEI từng máy trên kệ"><button type="button" class="icon" data-scan="kkIn" aria-label="Quét IMEI"><svg viewBox="0 0 24 24"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M7 8v8M10 8v8M13 8v8M17 8v8"/></svg></button><button class="ghost" data-kkadd="1">Thêm</button></span>
    <div class="kpis" style="margin-top:10px"><div class="kpi"><div class="eyebrow">Đã quét khớp</div><div class="v num">${ok.length}/${ton.length}</div></div><div class="kpi"><div class="eyebrow">Thiếu (chưa quét)</div><div class="v num" style="color:${thieu.length?'var(--red)':'inherit'}">${thieu.length}</div></div><div class="kpi"><div class="eyebrow">Lạ / sai</div><div class="v num">${thua.length}</div></div></div>
    ${KK.luc?`<small style="color:#46506b">Bắt đầu kiểm ${dmy(KK.luc)} · ${KK.q.length} lần quét. Thoát ra vẫn giữ, quay lại quét tiếp.</small>`:''}
    <button class="wlink" data-kkreset="1" style="margin-top:6px">Kiểm lại từ đầu</button></div>
    ${thua.length?`<div class="panel" style="border:2px solid #f0d08a"><h2>⚠ ${thua.length} IMEI lạ / không ở tồn kho</h2><div class="list">${thua.map(im=>{const m=db.may.find(x=>x.imei===im);return `<div class="row"><div class="n"><b class="num">${im}</b><small>${m?esc(m.ten)+' · '+(m.tt==='ban'?'đã bán — kiểm lại đơn':m.tt==='loi'?'đang chờ bảo hành':'không ở tồn'):'Chưa nhập kho — vào Nhập hàng để nhập'}</small></div><button class="xbtn" data-kkbo="${im}" aria-label="Bỏ">✕</button></div>`}).join('')}</div></div>`:''}
    ${thieu.length?`<div class="panel"><h2>Thiếu ${thieu.length} máy (có trong sổ, chưa quét)</h2><div class="list">${thieu.map(m=>`<div class="row" style="flex-wrap:wrap"><div class="n"><b>${esc(m.ten)}</b><small class="num">IMEI ${m.imei} · nhập ${dmy(m.ngayNhap)}</small></div><button class="ghost red" data-kkdel="${m.imei}">Xóa khỏi kho</button>
      ${kkDel===m.imei?`<div class="confirm" style="flex-basis:100%"><b style="color:var(--red)">Xóa IMEI này khỏi kho?</b><span>Chỉ xóa khi chắc máy không còn (nhập trùng, mất).</span><span class="inrow"><button class="ghost red" data-delimeiok="${m.imei}">Xác nhận xóa</button><button class="ghost" data-kkdel="">Thôi</button></span></div>`:''}</div>`).join('')}</div></div>`:ton.length?'<div class="panel"><div class="empty sm">✅ Đủ máy — khớp 100% với sổ.</div></div>':''}`
  :`<div class="panel"><h2>📋 Đếm phụ kiện, hàng</h2><small style="color:#46506b">Gõ số đếm thực tế, bỏ trống món chưa đếm. Bấm Lưu để cập nhật tồn.</small>
    <div class="list">${db.hang.filter(h=>h.sl>0||h.min).map(h=>`<div class="row"><div class="n"><b>${esc(h.ten)}</b><small class="num">Sổ: ${h.sl}</small></div><input data-kkh="${h.id}" inputmode="numeric" class="num" style="width:80px;text-align:center" placeholder="${h.sl}"></div>`).join('')||'<div class="empty">Chưa có phụ kiện.</div>'}</div>
    <button class="btn" data-kkhsave="1" style="width:100%;margin-top:10px">Lưu số đếm</button></div>`)}
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='khQ'){khQ=t.value;renderMore();const i=$('khQ');i.focus();i.setSelectionRange(i.value.length,i.value.length);return}
  if(t.id==='kkIn'&&/^\d{15}$/.test(t.value.trim())){kkAdd(t.value);return}
  if(t.id==='ntIm'&&/^\d{15}$/.test(t.value.trim())){const im=t.value.trim();if(db.may.some(m=>m.imei===im&&m.tt==='ton')){if(!nccTra.includes(im))nccTra.push(im);renderMore()}else{toast('IMEI không có trong tồn kho');t.value=''}return}
  if(t.dataset&&t.dataset.ntm!==undefined)return});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.ntm){const im=t.dataset.ntm;nccTra=t.checked?[...new Set([...nccTra,im])]:nccTra.filter(x=>x!==im);const k=$('ntTien');const tien=db.may.filter(m=>nccTra.includes(m.imei)).reduce((s,m)=>s+(+m.giaNhap||0),0);if(k)k.value=tien?tien.toLocaleString('vi-VN'):''}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.khopen!==undefined){khOpen=khOpen===d.khopen?null:d.khopen;renderMore();return}
  if(d.nccopen!==undefined){nccOpen=nccOpen===d.nccopen?null:d.nccopen;nccAct='';nccTra=[];renderMore();return}
  if(d.nccact!==undefined){nccAct=nccAct===d.nccact?'':d.nccact;nccTra=[];renderMore();return}
  if(d.nccpay){const tien=parseMoney($('nTien').value);if(!tien){toast('Nhập số tiền');return}const cach=$('nCach').value,n0=new Date(),gio=n0.getHours()+':'+String(n0.getMinutes()).padStart(2,'0');
    (db.pn=db.pn||[]).push({id:uid(),ngay:todayIso(),gio,ncc:d.nccpay==='(Chưa ghi NCC)'?'':d.nccpay,tong:0,nMay:0,no:-tien,loai:'tt',note:cach,dong:[]});
    if(cach==='Tiền mặt')(db.chi=db.chi||[]).push({id:uid(),ngay:todayIso(),gio,loai:'Trả NCC',tien,note:d.nccpay});
    nccAct='';save();renderMore();toast('Đã ghi trả '+money(tien)+' cho '+d.nccpay);return}
  if(d.nttra){const ncc=d.nttra==='(Chưa ghi NCC)'?'':d.nttra,ms=db.may.filter(m=>m.tt==='ton'&&nccTra.includes(m.imei));const hid=$('ntH')?$('ntH').value:'',hsl=$('ntSl')?parseMoney($('ntSl').value):0,h=hid&&db.hang.find(x=>x.id===hid);
    if(!ms.length&&!(h&&hsl>0)){toast('Chọn máy hoặc phụ kiện cần trả');return}if(h&&hsl>h.sl){toast('Kho chỉ còn '+h.sl);return}
    const tien=parseMoney($('ntTien').value)||(ms.reduce((s,m)=>s+(+m.giaNhap||0),0)+(h?h.giaNhap*hsl:0)),cach=$('ntCach').value,n0=new Date(),gio=n0.getHours()+':'+String(n0.getMinutes()).padStart(2,'0');
    const G={};ms.forEach(m=>{(G[m.ten]=G[m.ten]||{t:'may',ten:m.ten,hang:m.hang,gn:m.giaNhap,imeis:[]}).imeis.push(m.imei);m.tt='ncc'});const dong=Object.values(G);
    if(h&&hsl>0){h.sl-=hsl;dong.push({t:'hang',id:h.id,ten:h.ten,nhom:h.nhom,sl:hsl,gn:h.giaNhap})}
    (db.pn=db.pn||[]).push({id:uid(),ngay:todayIso(),gio,ncc,tong:-tien,nMay:-ms.length,no:cach==='no'?-tien:0,loai:'tra',note:($('ntNote').value.trim()||'')+(cach==='tien'?' (NCC trả tiền)':''),dong});
    nccAct='';nccTra=[];save();renderMore();toast('Đã trả hàng cho '+(ncc||'NCC')+' · '+money(tien)+(cach==='no'?' trừ nợ':''));return}
  if(d.kktab){kkTab=d.kktab;renderMore();return}
  if(d.kkadd){kkAdd(($('kkIn')||{}).value);return}
  if(d.kkbo){KK.q=KK.q.filter(x=>x!==d.kkbo);kkSave();renderMore();return}
  if(d.kkreset){if(!confirm('Xóa kết quả quét, kiểm lại từ đầu?'))return;KK={q:[],luc:''};kkSave();renderMore();return}
  if(d.kkdel!==undefined){kkDel=kkDel===d.kkdel?'':d.kkdel;renderMore();return}
  if(d.kkhsave){let n=0;document.querySelectorAll('[data-kkh]').forEach(i=>{if(i.value.trim()==='')return;const h=db.hang.find(x=>x.id===i.dataset.kkh);const v=parseMoney(i.value);if(h&&v>=0&&v!==h.sl){h.sl=v;n++}});save();renderMore();toast(n?'Đã cập nhật '+n+' món':'Không có thay đổi');return}});
</script>
<script src="/mua.js"></script>
<script>
/* ===== 29/10 anh Thái: ẢNH TRUYỀN THÔNG qua HÀNG CHỜ =====
   Shop bấm "＋ Tạo bài mới" → chọn máy (từ Kho) → chọn KM → Ảnh → Tạo → vào hàng chờ (không phải chờ).
   Robot Mac mini dựng ảnh (4 mẫu + hiệu ứng mùa) → mục Ảnh truyền thông cho shop tải + copy caption.
   Hạn mức 2 bài/tuần/shop. Máy chủ: act hcGui / hcDs (HangCho.gs). */
let TTQ={ds:null,con:null,han:2,loi:'',busy:false,luc:0},ttqNew=null,ttqT=null,ttqQ='';
const ttqMay=()=>{try{let m=localStorage.getItem('sg_tt_may');if(!m){m=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>(b%36).toString(36)).join('');localStorage.setItem('sg_tt_may',m)}return m}catch(_){return 'khongluu'+Date.now().toString(36)}};
const ttqDemo=()=>DEMO||TEST;
function ttqAuth(){return ttqDemo()?{demo:ttqMay()}:{token:GG.token||''}}
async function ttqPost(o){const r=await fetch(GG.LICENSE_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...o,...ttqAuth()})});return r.json()}
const ttqSeen=()=>{try{return JSON.parse(localStorage.getItem('sg_tt_seen')||'[]')}catch(_){return []}};
function ttqDanhDau(){if(!TTQ.ds)return;const s=new Set(ttqSeen());TTQ.ds.filter(x=>x.tt==='xong').forEach(x=>s.add(x.ma));try{localStorage.setItem('sg_tt_seen',JSON.stringify([...s].slice(-80)))}catch(_){}ttqDot()}
const ttqMoi=()=>TTQ.ds?TTQ.ds.filter(x=>x.tt==='xong'&&!ttqSeen().includes(x.ma)).length:0;
function ttqDot(){const n=ttqMoi(),b=document.querySelector('[role=tab][data-v="more"]');if(b){let d=b.querySelector('#dotTtq');if(!d){d=document.createElement('span');d.className='dot';d.id='dotTtq';b.appendChild(d)}d.textContent=n;d.hidden=!n}
  const m=document.querySelector('.menu [data-more="ttq"]');if(m)m.classList.toggle('moi',!!n)}
const ttqGio=v=>{const d=/T.*Z$/.test(String(v))?new Date(v):new Date(String(v).replace(' ','T')+'+07:00');return isNaN(d)?'':d.toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit',timeZone:'Asia/Ho_Chi_Minh'})};
const ttqDangCho=()=>TTQ.ds&&TTQ.ds.some(x=>x.tt==='cho'||x.tt==='dang');
async function ttqTai(quiet){if(XEM||NV||TTQ.busy||!GG.LICENSE_URL)return;if(!ttqDemo()&&!GG.token)return;TTQ.busy=true;
  const cu=TTQ.ds?TTQ.ds.filter(x=>x.tt==='xong').length:-1;
  try{const r=await ttqPost({act:'hcDs'});if(r&&r.ok){TTQ.ds=r.ds||[];TTQ.con=r.con;TTQ.han=r.han||2;TTQ.loi='';TTQ.luc=Date.now();
      const moi=TTQ.ds.filter(x=>x.tt==='xong').length;if(cu>=0&&moi>cu&&!(view==='more'&&more==='ttq'))toast('🖼 Ảnh truyền thông đã xong — vào Thêm › Ảnh truyền thông')}
    else TTQ.loi=(r&&r.msg)||'Chưa tải được'}catch(e){TTQ.loi='Chưa kết nối được máy chủ'}
  TTQ.busy=false;ttqDot();if(view==='more'&&more==='ttq')render();
  clearTimeout(ttqT);ttqT=setTimeout(()=>ttqTai(true),ttqDangCho()?45000:10*60000)}
setTimeout(()=>ttqTai(true),6000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-TTQ.luc>60000)ttqTai(true)});


/* ===== 04/11 anh Thái: NHÂN VIÊN NHẬP HÀNG — NV chỉ chọn sản phẩm + số lượng/IMEI (KHÔNG thấy giá) → gửi phiếu → chủ shop duyệt là vào kho =====
   NV: tab dưới "Nhập hàng" → renderNvNhap · phiếu nháp localStorage shopgon_nvp · phiếu chờ gửi shopgon_nvpq · phiếu đã gửi + trạng thái shopgon_nvpds (máy chủ trả trong nvLogin.nhap)
   Chủ: nvApply gặp kind:'nhap' → db.shop.pnCho · duyệt dựng PN tạm rồi pnCommit · kết quả (ok/tra) xếp db.shop.nhapKq gửi kèm nvSync */

function renderNvNhap(){const P=NVP(),q=nvpQ(),ds=[...q.map(o=>({...o,tt:'gui'})),...nvpDs().filter(o=>!q.some(x=>x.id===o.id))].slice(0,15);
  const seg=`<div class="schips eq" role="group"><button type="button" class="chip" data-nvpm="may" aria-pressed="${nvpMode==='may'}">Điện thoại</button><button type="button" class="chip" data-nvpm="hang" aria-pressed="${nvpMode==='hang'}">Phụ kiện · hàng khác</button></div>`;

  const names=[...new Set(db.hang.map(h=>h.ten))].sort(),g=khoOn().length?khoOn():[{k:'pk',t:'Phụ kiện',l:['Khác']}];

      <label>Tên máy · cấu hình · màu<small>Gõ tên máy rồi chọn đúng dòng cấu hình + màu</small><input id="aTen" placeholder="VD: A7 Pro, Reno15, iPhone 17" autocomplete="off"><small class="hint" id="aHint"></small></label><div id="aSug" class="sug" hidden></div>

      <div class="err" id="aErr"></div><button class="btn" type="submit">＋ Thêm vào phiếu</button></form>`
    :`<form id="fNvpHang" autocomplete="off">
      <label>Tên món<small>Chọn món shop đã có, hoặc gõ tên món mới</small><input id="hTen" list="dlH" placeholder="VD: Cường lực iPhone 15, Ốp lưng"><datalist id="dlH">${names.map(n=>`<option value="${esc(n)}">`).join('')}</datalist></label>
      <div class="two"><label>Nhóm hàng<select id="hNhom">${g.map(x=>`<optgroup label="${esc(x.t)}">${x.l.map(l=>`<option value="${esc(x.k+'|'+l)}">${esc(l)}</option>`).join('')}</optgroup>`).join('')}</select></label>
      <label>Số lượng<span class="pnsl"><button type="button" class="ghost" data-nvphsl="-1" aria-label="Bớt 1">−</button><input id="hSl" inputmode="numeric" class="num" value="1"><button type="button" class="ghost" data-nvphsl="1" aria-label="Thêm 1">＋</button></span></label></div>

  const draft=P.dong.length?`<div class="panel pncard"><h2>🧾 Phiếu nhập · ${P.dong.length} dòng · ${P.dong.reduce((t,d)=>t+nvpSl(d),0)} sản phẩm</h2><div class="list">${P.dong.map((d,i)=>`<div class="row"><div class="n"><b>${d.t==='may'?'📱':'📦'} ${esc(d.ten)}</b><small class="num">${nvpSl(d)} ${d.t==='may'?'máy':'cái'}${d.t==='may'?' · …'+(d.imeis||[]).map(x=>String(x).slice(-4)).join(', …'):''}</small></div><div class="right"><button class="xbtn" data-nvpdel="${i}" aria-label="Bỏ dòng này">✕</button></div></div>`).join('')}</div>
      <label style="margin-top:8px">Nhà cung cấp<input id="nvpNcc" value="${esc(P.ncc||'')}" placeholder="VD: NPP Mekong"></label>
      <label>Ghi chú cho chủ shop<input id="nvpNote" value="${esc(P.note||'')}" placeholder="VD: hàng về lúc 3h, thiếu 1 hộp"></label>

function ttqMau(){const G={};stock().forEach(m=>{const k=gk(m.ten);const x=G[k]=G[k]||{k,ms:[],hang:m.hang||''};x.ms.push(m)});
  return Object.values(G).map(x=>{const tg=TG?tgCua(x.k):null;return {...x,gb:Math.max(0,...x.ms.map(m=>m.giaBan||0)),img:imgCua(x.ms[0].ten)||(tg&&tg.a)||''}}).sort((a,b)=>b.ms.length-a.ms.length||a.k.localeCompare(b.k))}

function ttqMuaHtml(){const m=typeof muaHienTai==='function'?muaHienTai():null,s=!m&&typeof muaSap==='function'?muaSap():null;const d=n=>String(n).slice(6,8)+'/'+String(n).slice(4,6);
  return m?`<div class="ttmua">${esc(m.nhan)} Đang mùa <b>${esc(m.ten)}</b>${m.co?' · ảnh tự có hiệu ứng':''}</div>`:s?`<div class="ttmua sap">Hiệu ứng mùa tự đổi theo ngày · sắp tới: ${esc(s.nhan)} từ ${d(s.tu)}</div>`:''}
function renderTtq(){

        <figcaption>${i+1}. ${esc(a.ten||('Mẫu '+(i+1)))}</figcaption><div class="ttbtn"><button type="button" data-ttshare="${esc(a.id)}" data-ttten="${esc((x.ten||'anh')+'_'+(i+1))}">📤 Chia sẻ</button><a href="https://drive.google.com/uc?export=download&id=${esc(a.id)}" target="_blank" rel="noopener" data-tttai="${esc(a.id)}">⬇ Tải</a></div></figure>`).join('')}</div>
      ${x.cap?`<button type="button" class="ghost" data-ttcap="${esc(x.ma)}" style="width:100%;margin-top:8px">📋 Copy bài đăng (viết sẵn)</button><pre class="ttcap">${esc(x.cap)}</pre>`:''}`
     :x.tt==='loi'?`<small class="ttloi">${esc(x.loi||'Robot gặp lỗi')} — bài này không trừ lượt, shop tạo lại nhé.</small>`
     :`<small class="ttl">Robot dựng xong sẽ hiện ở đây (thường vài phút). Shop cứ dùng app bình thường.</small>`}</div>`;
  setTimeout(ttqDanhDau,1500);
  return `<div class="panel"><h2>🖼 Ảnh truyền thông</h2>
    <p class="ttsub">Shop chọn máy + khuyến mãi → robot thiết kế <b>đủ 15 mẫu</b> + viết sẵn bài đăng có link web của shop. Shop chỉ việc chọn mẫu ưng ý → Chia sẻ.</p>
    <div class="ttquota"><span>Tuần này còn <b>${con}/${han}</b> bài</span><small>Lượt mới mỗi thứ Hai</small></div>${ttqMuaHtml()}
    <div class="ttbtn2"><button class="btn" data-trnew="1">🗞 Tạo tờ rơi<small>6–12 máy · có ngay, không trừ lượt</small></button><button class="ghost" data-ttnew="1"${TTQ.con===0?' disabled':''}>🖼 Ảnh 1 máy<small>Robot làm 15 mẫu</small></button></div>
    ${TTQ.loi?`<div class="alert amber" style="margin-top:10px"><b>${esc(TTQ.loi)}</b><span><button class="ghost" data-ttreload="1">Thử lại</button></span></div>`:''}</div>
    ${ttqNew?renderTtqNew():''}${TR?renderTr():''}
    <div class="ttlist">${TTQ.ds?(TTQ.ds.length?TTQ.ds.map(the).join(''):'<div class="empty">Chưa có bài nào. Bấm <b>＋ Tạo bài mới</b> để robot thiết kế ảnh cho shop.</div>'):'<div class="empty sm">Đang tải…</div>'}</div>
    <p class="kgnote" style="margin:10px 4px">Ảnh lưu 60 ngày. Muốn sửa giá/KM thì sửa ở <b>Kho</b> rồi tạo bài mới.</p>`}
function renderTtqNew(){
  if(!KM)kmLoad().then(()=>{if(view==='more'&&more==='ttq')render()});if(!TG)tgLoad().then(()=>{if(view==='more'&&more==='ttq')render()});
  const L=ttqMau(),q=nv0(ttqQ).trim(),LL=L.filter(x=>!q||q.split(/\s+/).every(w=>nv0(x.k).includes(w)));
  if(ttqNew.buoc===1)return `<div class="wsheet" data-ttx="1"><div class="wsbox"><h3>1 · Chọn máy</h3><p class="wst">Máy đang có trong kho của shop</p>

    <div class="ttpick">${LL.length?LL.slice(0,40).map(x=>`<button type="button" data-ttmay="${esc(x.k)}">${x.img?`<img src="${esc(x.img)}" alt="" loading="lazy">`:'<span class="wno">📱</span>'}<b>${esc(x.k)}</b><small>${x.gb?money(x.gb):'chưa có giá'}${kmCua('g|'+x.k).length?' · 🎁 '+kmCua('g|'+x.k).length+' KM':''}</small></button>`).join(''):`<div class="empty">${L.length?'Không thấy máy này trong kho.':'Kho chưa có máy còn hàng — nhập hàng trước.'}</div>`}</div>

  const chon=ttqNew.km||(ttqNew.km=kms.map(k=>k.id));

    <div class="ttsel">${x.img?`<img src="${esc(x.img)}" alt="">`:''}<div><b>${esc(x.k)}</b><small>Giá ${x.gb?money(x.gb):'chưa có — đặt ở tab Kho'}</small></div><button type="button" class="ghost" data-ttbuoc="1">Đổi máy</button></div>
    <div class="ttkm">${kms.length?kms.map(k=>`<label class="ttck"><input type="checkbox" data-ttkm="${esc(k.id)}"${chon.includes(k.id)?' checked':''}> 🎁 ${esc(kmChip(k))}</label>`).join(''):'<p class="kgnote">Máy này chưa có khuyến mãi — ảnh sẽ hiện giá + lời mời. Muốn có KM thì thêm ở <b>Kho › Khuyến mãi</b>.</p>'}
      </div>
    <div class="ttloai"><button type="button" aria-pressed="true">🖼 Ảnh <small>15 mẫu</small></button><button type="button" disabled>🎬 Video <small>sắp có</small></button></div>

/* 30/10 anh Thái: bài đăng viết SẴN cho shop — giọng mời chào mua hàng + vào web xem thêm máy. Xoay 4 kiểu cho đỡ trùng. */
function ttqCap(o){const sh=o.shop||{},ten=o.ten,gia=o.cuoi?money(o.cuoi):'',tenShop=sh.ten||'shop',h=(ten+Date.now()).split('').reduce((a,c)=>a*31+c.charCodeAt(0)>>>0,7);
  const km=o.km.length?o.km.map(t=>'🎁 '+t).join('\n')+'\n':'',giam=o.tru?' (giảm ngay '+short(o.tru)+')':'';
  const lh=(sh.dc?'📍 '+sh.dc+'\n':'')+(sh.dt?'📞 Gọi / Zalo: '+sh.dt+'\n':'');
  const mo=o.mua&&o.mua.id==='noel'?'🎄 Noel này lên đời điện thoại mới!\n':o.mua&&o.mua.id==='tet'?'🧧 Sắm Tết – đổi máy mới đón năm mới!\n':o.mua&&o.mua.id==='namoi'?'🎆 Năm mới – máy mới!\n':'';
  const K=[
    mo+'🔥 '+ten+' đã có hàng tại '+tenShop+'!\n💰 Giá chỉ '+gia+giam+'\n'+km+'\nGhé shop cầm máy trải nghiệm trực tiếp, nhân viên tư vấn tận tình 💯\n'+lh,
    mo+'📱 Đang tìm điện thoại mới? '+ten+' là lựa chọn đáng tiền!\n✅ Giá tốt: '+gia+giam+'\n'+km+'\nInbox hoặc gọi ngay để giữ máy, số lượng có hạn ⏰\n'+lh,
    mo+'⚡ ƯU ĐÃI TẠI '+tenShop.toUpperCase()+' ⚡\n'+ten+' – '+gia+giam+'\n'+km+'\nCòn nhiều mẫu khác giá tốt đang chờ bạn trên website của shop 👇\n'+lh,
    mo+'💎 '+ten+' – sẵn hàng, nhận máy ngay hôm nay!\n💰 '+gia+giam+'\n'+km+'\nMua tại shop: hỗ trợ cài đặt, chuyển dữ liệu, chăm sóc sau bán 🤝\n'+lh];
  return K[h%K.length].trim()+'\n\n'+CTA(o.link)}
function ttqJob(){const L=ttqMau(),x=L.find(z=>z.k===ttqNew.k);if(!x)return null;
  const kms=kmCua('g|'+x.k).filter(k=>(ttqNew.km||[]).includes(k.id)),gb=x.gb||0,tru=kmTru(kms,gb),them=String(ttqNew.them||'').trim();
  const link=linkNgan()||'https://shopgon.vn',mua=typeof muaHienTai==='function'?muaHienTai():null;
  const qua=kms.filter(k=>k.loai==='tang').map(k=>k.tangTen||'Quà tặng'),txt=kms.filter(k=>k.loai==='txt').map(k=>k.txt).concat(them?[them]:[]),tg=kms.some(k=>k.loai==='tg');
  const cuoi=Math.max(0,gb-tru),gop=tg&&cuoi?Math.ceil(cuoi/12/1000)*1000:0;
  const kmTxt=kms.map(kmChip);
  const cap=ttqCap({ten:x.k,gb,cuoi,tru,km:kmTxt,qua,gop,link,shop:db.shop,mua});
  return {may:{ten:x.k,hang:x.hang,anh:absUrl(x.img)},gia:{ny:gb,cuoi,giam:tru},qua,gop,tg,txt,km:kmTxt,
    shop:{ten:db.shop.ten||'',dc:db.shop.dc||'',dt:db.shop.dt||''},link,cap,mua:mua?mua.id:'',muaTen:mua?mua.nhan:''}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-ttnew],[data-ttx],[data-ttmay],[data-ttbuoc],[data-ttgui],[data-ttreload],[data-ttcap],[data-ttshare]');if(!b)return;const d=b.dataset;
  if(d.ttreload!==undefined){TTQ.loi='';ttqTai();return}
  if(d.ttnew!==undefined){if(XEM){showKh();return}if(!stock().length){toast('Kho chưa có máy — nhập hàng trước');return}ttqNew={buoc:1};ttqQ='';render();setTimeout(()=>{const i=$('ttqTim');if(i)i.focus()},60);return}
  if(d.ttx!==undefined){if(b.classList.contains('wsheet')&&e.target!==b)return;ttqNew=null;render();return}
  if(d.ttmay){ttqNew={buoc:2,k:d.ttmay};render();return}
  if(d.ttbuoc){ttqNew={buoc:1};render();return}
  if(d.ttgui!==undefined){const er=$('ttqErr');const job=ttqJob();if(!job){er.textContent='Chưa chọn máy.';return}
    if(!job.gia.ny){er.textContent='Máy này chưa có giá — đặt giá ở tab Kho trước.';return}
    b.disabled=true;b.textContent='Đang gửi…';
    try{const r=await ttqPost({act:'hcGui',loai:'anh',job});
      if(r&&r.ok){ttqNew=null;TTQ.con=r.con;toast('✅ Đã vào hàng chờ'+(r.viTri?' · vị trí '+r.viTri:'')+' — xong sẽ báo');TTQ.ds=null;ttqTai()}
      else{er.textContent=(r&&r.msg)||'Chưa gửi được';b.disabled=false;b.textContent='✨ Tạo bài · vào hàng chờ';if(r&&r.het){TTQ.con=0}}}
    catch(_){er.textContent='Chưa kết nối được máy chủ, thử lại.';b.disabled=false;b.textContent='✨ Tạo bài · vào hàng chờ'}return}
  if(d.ttcap){const x=(TTQ.ds||[]).find(z=>z.ma===d.ttcap);if(x)await chepText(x.cap,b,'✓ Đã copy caption');toast('Đã copy — dán khi đăng ảnh');return}
  if(d.ttshare){const u='https://lh3.googleusercontent.com/d/'+d.ttshare+'=w1080';ttqChon(d.ttshare,'chiase');const bx=(TTQ.ds||[]).find(z=>(z.anh||[]).some(a=>a.id===d.ttshare));if(bx&&bx.cap){chepText(bx.cap);toast('Đã copy sẵn bài đăng — dán vào khi đăng ảnh')}
    try{if(!navigator.canShare)throw 0;const bl=await (await fetch(u)).blob(),f=new File([bl],(d.ttten||'anh').replace(/[^\wÀ-ỹ]+/g,'_')+'.jpg',{type:'image/jpeg'});
      if(!navigator.canShare({files:[f]}))throw 0;await navigator.share({files:[f]})}catch(_){window.open('https://drive.google.com/uc?export=download&id='+d.ttshare,'_blank')}return}});

/* 30/10 anh Thái: đếm mẫu shop chọn (Tải / Chia sẻ) → máy chủ tab MauChon, để giữ mẫu được chọn nhiều, thay mẫu ít chọn */
function ttqChon(id,kieu){const b=(TTQ.ds||[]).find(z=>(z.anh||[]).some(a=>a.id===id));if(!b)return;const a=b.anh.find(x=>x.id===id);
  const k='sg_tt_chon',s=(()=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(_){return []}})(),key=b.ma+'|'+a.ten;if(s.includes(key))return;s.push(key);try{localStorage.setItem(k,JSON.stringify(s.slice(-300)))}catch(_){}
  ttqPost({act:'hcChon',ma:b.ma,mau:a.ten,kieu}).catch(()=>{})}
document.addEventListener('click',e=>{const a=e.target.closest('[data-tttai]');if(a)ttqChon(a.dataset.tttai,'tai')},true);
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.ttkm&&ttqNew){const s=new Set(ttqNew.km||[]);t.checked?s.add(t.dataset.ttkm):s.delete(t.dataset.ttkm);ttqNew.km=[...s];}});
document.addEventListener('input',e=>{if(e.target.id==='ttqTim'){ttqQ=e.target.value;const p=e.target.selectionStart;render();const i=$('ttqTim');if(i){i.focus();try{i.setSelectionRange(p,p)}catch(_){}}}});
