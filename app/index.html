let XEM=false,XLIC=null,xTimer=null,NV=null;

  load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return memory}},
  save(db){if(XEM)return;memory=db;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
};

const DAY=86400000;

const parseMoney=s=>{const d=String(s||'').replace(/[^\d]/g,'');return d?+d:0};
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const todayIso=()=>iso(Date.now());

const ageDays=m=>Math.max(0,Math.floor((new Date(todayIso())-new Date(m.ngayNhap))/DAY));

    Object.keys(sh).forEach(k=>{if(sh[k]===undefined)delete sh[k]});out.shop=sh;return out},
  async push(){if(this.busy){this.queue();return}this.busy=true;try{const rem=await this.readRemote();const base=this.getBase();
      const m=rem.empty?{...db,pn:db.pn||[],chi:db.chi||[]}:this.merge(base,db,rem);

      const tbl={May:m.may,Don:m.don,Hang:m.hang,Phieu:m.pn||[],Chi:m.chi||[]};
      const diff=rem.empty||Object.entries(tbl).some(([t,L])=>{const R=rem[this.T[t][0]]||[];return L.length!==R.length||L.some((o,i)=>this.rowOf(t,o)!==this.rowOf(t,R[i]))})||JSON.stringify(m.shop)!==JSON.stringify(rem.shop);
      if(diff){const data=[];
        for(const [t,c] of Object.entries(this.cols)){const rows=tbl[t].map(o=>{const x=t==='Phieu'?{...o,dong:JSON.stringify(o.dong||[])}:o;return c.map(k=>x[k]??'')});data.push({range:t+'!A1',values:[c,...rows]})}

        await this.api(`https://sheets.googleapis.com/v4/spreadsheets/${this.sheetId}/values:batchUpdate`,{method:'POST',body:JSON.stringify({valueInputOption:'RAW',data})})}
      const keep={sample:db.sample};db=Object.assign(m,{v:1,sample:false});this.setBase(db);Store.save(db);

      ggStatus('Đã lưu lên Google Drive');}catch(e){ggStatus('Chưa lưu được lên Drive, sẽ thử lại');this.queue(15000)}finally{this.busy=false}},
  queue(ms=2500){clearTimeout(this.timer);this.timer=setTimeout(()=>this.push(),ms)},
  /* mở app: có bản gốc thì gộp (giữ đơn bán lúc mất mạng), chưa có thì lấy sổ trên Drive */

};

const mLbl=k=>'Tháng '+(+k.slice(5))+'/'+k.slice(0,4);
function reportPanel(){
  const t=todayIso(), cur=t.slice(0,7), rm=rptMonth||cur;
  let bars=[], sum;
  if(rptMode==='ngay'){const last=new Date(+rm.slice(0,4),+rm.slice(5),0).getDate();const endD=rm===cur?+t.slice(8):last;
    for(let d=1;d<=last;d++){const k=rm+'-'+String(d).padStart(2,'0');const r=d<=endD?sumRange(k,k):{dt:0,loi:0,may:0,n:0};bars.push({k,l:(d===1||d%5===0)?String(d):'',v:r.loi,r,lbl:'Ngày '+d+'/'+(+rm.slice(5))})}
    sum=sumRange(rm+'-01',rm+'-31');}
  else{const ms=monthsList().slice(0,12).reverse();ms.forEach(k=>{const r=sumRange(k+'-01',k+'-31');bars.push({k,l:'T'+(+k.slice(5)),v:r.loi,r,lbl:mLbl(k)})});
    sum=bars.reduce((a,b)=>({dt:a.dt+b.r.dt,loi:a.loi+b.r.loi,may:a.may+b.r.may,n:a.n+b.r.n}),{dt:0,loi:0,may:0,n:0});}

/* ===== KHUYẾN MÃI (tab Kho › Khuyến mãi) — 29/10 anh Thái: tab này = GIAO DIỆN WEB KHÁCH XEM, chủ shop ghi KM thẳng trên từng thẻ.

   (2) Khuyến mãi — nút ＋ thêm: giảm tiền · giảm % · tặng phụ kiện · trả góp 0% · khác.
   db.shop.km: {id, sp:'g|tên mẫu' (mọi màu) | 'm|tên máy' (cũ) | 'h|id phụ kiện', ten, loai:'giam'|'pct'|'tang'|'tg'|'txt', gt, tang, tangTen, txt, den} ===== */
const gk=t=>String(t||'').replace(/\s+-\s+[^-]+$/,'').trim();
function tgKey(s){s=String(s||'').toLowerCase().replace(/^điện thoại\s+/,'').replace(/^samsung\s+(?=galaxy)/,'').replace(/^xiaomi\s+(?=redmi|poco)/,'').replace(/\bmoto\s+/g,'').replace(/\s+-\s+.*$/,'').replace(/(\d)\+(\d)/g,'$1/$2').replace(/\+/g,'plus');const m=s.match(/\d+\s*(?:gb|tb)?\s*\/\s*\d+\s*(?:gb|tb)?|\d+\s*(?:gb|tb)/);if(m)s=s.slice(0,m.index+m[0].length);return s.replace(/\b[45]g\b/g,'').replace(/gb/g,'').replace(/[^a-z0-9/]/g,'')}
let TG=null,TGload=null;const TG2={};
function tgLoad(){if(TG||TGload)return TGload||Promise.resolve();TGload=fetch('/kho/gia-tgdd.json?v='+new Date().toISOString().slice(0,13)).then(r=>r.json()).then(j=>{TG=j||{gia:{}};const c={};Object.entries(TG.gia||{}).forEach(([k,v])=>{const k2=k.replace(/(\d+)\/(\d+)$/,'$2');(c[k2]=c[k2]||[]).push(v)});Object.entries(c).forEach(([k,v])=>{if(v.length===1)TG2[k]=v[0]})}).catch(()=>{TG={gia:{}}});return TGload}
function tgCua(ten){if(!TG)return null;const k=tgKey(ten);return (TG.gia||{})[k]||TG2[k]||TG2[k.replace(/(\d+)\/(\d+)$/,'$2')]||null}
/* giá niêm yết của 1 mẫu: TGDD trước, không có thì giá shop tự điền */
function nyCua(ten){const v=(db.shop.ny||{})[gk(ten)];if(v)return {v,tg:0,sua:1};const t=tgCua(ten);if(t&&t.ny)return {v:t.ny,tg:1};return {v:0,tg:0}}
const kmDs=()=>db.shop.km||(db.shop.km=[]);
const kmOn=k=>!k.den||k.den>=todayIso();
const kmChay=()=>(db.shop.km||[]).filter(kmOn);
const kmCua=sp=>{const g=sp.startsWith('m|')?'g|'+gk(sp.slice(2)):sp.startsWith('g|')?sp:null;return kmChay().filter(k=>k.sp===sp||(g&&(k.sp===g||(k.sp.startsWith('m|')&&'g|'+gk(k.sp.slice(2))===g))))};
const kmTxt=k=>k.loai==='giam'?'giảm '+money(k.gt):k.loai==='pct'?'giảm '+k.gt+'%':k.loai==='tg'?'trả góp 0%':k.loai==='txt'?(k.txt||''):'tặng '+(k.tangTen||'quà');

const kmTru=(L,g)=>L.reduce((t,k)=>t+(k.loai==='giam'?+k.gt||0:k.loai==='pct'?Math.round(g*k.gt/100/1000)*1000:0),0);
let kmLoai='giam',kmSheet=null,kmBrand='Tất cả',nyEdit=null;
/* 29/10: khớp ẢNH theo mẫu máy, bỏ tên hãng/5G/dung lượng/màu (VD "Xiaomi Redmi Note 17 5G 6/256" = "REDMI Note 17") */
function mKey(n){let s=String(n||'').toLowerCase().replace(/^điện thoại\s+/,'').replace(/\s+-\s+[^-]+$/,'').replace(/(\d)\+(\d)/g,'$1/$2').replace(/\+/g,'plus').replace(/\(([^)]*)\)/g,'$1');
  const m=s.match(/\d+\s*(?:gb|tb)\b|\d+\s*\/\s*\d+/);if(m)s=s.slice(0,m.index);
  return s.replace(/\b(samsung|xiaomi|apple|oppo|motorola|moto|honor|realme|vivo|tecno|nubia|nokia|hmd|masstel|mobell|nothing|phone|[45]g)\b/g,'').replace(/[^a-z0-9]/g,'')}
let MKI=null;
function mkIndex(){if(MKI||!KM)return MKI;MKI=new Map();KM.forEach(z=>{if(!z.img)return;const k=mKey(z.base);if(!MKI.has(k))MKI.set(k,[]);MKI.get(k).push(z)});return MKI}
const imgCua=ten=>{if(!KM)return '';const I=mkIndex();const k=mKey(ten),mau=(/\s+-\s+([^-]+)$/.exec(ten)||[])[1];let L=I.get(k);
  if(!L){let best='';for(const kk of I.keys())if(kk.length>best.length&&(k.startsWith(kk)||kk.startsWith(k))&&Math.min(k.length,kk.length)>=4)best=kk;L=best?I.get(best):null}
  if(!L)return '';const x=mau&&L.find(z=>z.mau&&z.mau.toLowerCase()===mau.trim().toLowerCase());return (x||L[0]).img||''};
function renderKmTab(){
  if(!TG)tgLoad().then(()=>{if(view==='stock'&&khoTab==='km')render()});
  if(!KM)kmLoad().then(()=>{if(view==='stock'&&khoTab==='km')render()});

function render(){
  document.body.classList.toggle('nv',!OWN()||!!NV);document.body.classList.toggle('nvmode',!!NV);if(!OWN()&&(more==='set'||more==='tien'))more='pin';
  $('shopName').textContent=db.shop.ten||'Chưa đặt tên shop';
  $('today').textContent=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'][new Date().getDay()]+', '+dmy(todayIso());
  $('mode').textContent=NV?'NV: '+(NV.ten||NV.sdt):DEMO?(TEST?'Tài khoản test':'Bản demo'):XEM?'Xem thử':db.sample?'Dữ liệu mẫu':GG.email?'Đã kích hoạt':'Trên máy này';
  const old=stock().filter(m=>ageDays(m)>45).length;$('dotStock').textContent=old;$('dotStock').hidden=!old;
  ({home:renderHome,sell:renderSell,add:renderAdd,stock:renderStock,more:renderMore})[view]();
}

/* ===== Sự kiện ===== */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.delimei!==undefined){delImei=delImei===b.dataset.delimei?'':b.dataset.delimei;render();return}
  if(b.dataset.delimeiok){const im=b.dataset.delimeiok,n0=db.may.length;db.may=db.may.filter(m=>!(m.imei===im&&m.tt==='ton'));delImei='';if(db.may.length<n0){save();toast('Đã xóa IMEI …'+im.slice(-6)+' khỏi kho')}else toast('Không tìm thấy máy tồn với IMEI này');render();return}
  if(b.dataset.cartdel){const c=cart[+b.dataset.cartdel];cart.splice(+b.dataset.cartdel,1);if(c&&c.kid)cart=cart.filter(x=>x.kmOf!==c.kid);render();return}
  if(b.dataset.kmo){kmOpen=true;render();return}
  if(b.dataset.kmx){kmOpen=false;render();return}
  if(b.dataset.kmtab){kmTab=b.dataset.kmtab;render();return}
  if(b.dataset.kmgiam){kmGiam(+b.dataset.kmgiam);return}
  if(b.dataset.kmpct){kmGiam(Math.round(cartHang()*b.dataset.kmpct/100/1000)*1000);return}
  if(b.dataset.kmok){kmGiam(parseMoney(($('kmTien')||{}).value||''));return}
  if(b.dataset.kmtang){const h=db.hang.find(x=>x.id===b.dataset.kmtang);if(!h)return;const ex=cart.find(c=>isKm(c)&&c.hangId===h.id);
    if(ex)ex.sl++;else cart.push({type:'hang',hangId:h.id,ten:'🎁 Tặng: '+h.ten,nhom:'km',gia:0,von:h.giaNhap,sl:1});render();toast('Đã thêm quà tặng: '+h.ten);return}
  if(b.dataset.kmqua){const t=($('kmQua')||{}).value||'';if(!t.trim()){toast('Nhập tên quà');return}const v=$('kmVon')?parseMoney($('kmVon').value):0;
    cart.push({type:'free',nhom:'km',ten:'🎁 Tặng: '+t.trim(),gia:0,von:v,sl:1});kmOpen=false;render();toast('Đã thêm quà vào đơn');return}
  if(b.dataset.checkout){if(!cart.length)return;const bill=uid();const n0=new Date();const gio=n0.getHours()+':'+String(n0.getMinutes()).padStart(2,'0');
    cart.forEach(c=>{const base={id:uid(),bill,ngay:todayIso(),gio,khach:cartKhach.trim(),sdt:cartSdt.trim(),tt:'Tiền mặt',huy:null};
      if(c.type==='may'){const m=db.may.find(x=>x.imei===c.imei);if(m)m.tt='ban';db.don.push({...base,loai:'may',imei:c.imei,ten:c.ten,hang:c.hang,giaBan:c.gia,giaVon:c.von,bh:c.bh})}
      else if(c.type==='hang'){const h=db.hang.find(x=>x.id===c.hangId);if(h)h.sl-=c.sl;db.don.push({...base,loai:c.nhom,ten:c.ten+(c.sl>1?' ×'+c.sl:''),hangId:c.hangId,sl:c.sl,giaBan:c.gia*c.sl,giaVon:c.von*c.sl})}
      else if(c.type==='thu'){if(!db.may.some(x=>x.imei===c.imei))db.may.push({imei:c.imei,ten:c.ten,hang:c.hang,giaNhap:-c.gia,giaBan:c.gb||0,ngayNhap:todayIso(),ncc:'Thu của khách'+(cartKhach.trim()?': '+cartKhach.trim():''),tt:'ton'});db.don.push({...base,loai:'thu',imei:c.imei,ten:'Thu máy cũ: '+c.ten+(c.note?' ('+c.note+')':''),hang:c.hang,giaBan:c.gia,giaVon:c.gia})}
      else db.don.push({...base,loai:c.nhom,ten:c.ten,giaBan:c.gia,giaVon:c.von,uocTinh:c.uocTinh})});
    cart=[];cartKhach='';cartSdt='';kmOpen=false;kmQ='';save();render();openReceipt(bill);return}
  if(b.dataset.rm){rptMode=b.dataset.rm;rptSel=null;render();return}
  if(b.dataset.rsel){rptSel=rptSel===b.dataset.rsel?null:b.dataset.rsel;render();return}
  if(b.dataset.toggle==='todayList'){showToday=!showToday;render();return}
  if(b.dataset.v){if(b.dataset.v==='more')more='menu';go(b.dataset.v);return}
  if(b.dataset.go){if(b.dataset.filter==='may'){stockMode='may';stockBrand='Tất cả'}if(b.dataset.filter==='hang')stockMode='hang';go(b.dataset.go);return}
  if(b.dataset.more==='bg'||b.dataset.more==='tt'){try{Store.save(db)}catch(e){}location.href='/'+b.dataset.more+'/?tu=app'+(DEMO?'&demo=1':'');return}
  if(b.dataset.more){more=b.dataset.more;cancelId=null;resetAsk=false;if(view!=='more')go('more');else{render();window.scrollTo(0,0)}return}
  if(b.dataset.sm){sellMode=b.dataset.sm;render();return}
  if(b.dataset.pick){sellImei=b.dataset.pick;sellTT='Tiền mặt';render();return}
  if(b.dataset.sellimei){sellMode='may';sellImei=b.dataset.sellimei;sellTT='Tiền mặt';go('sell');return}
  if(b.dataset.nhom){pkNhom=b.dataset.nhom;pkPick=null;pkQ='';renderSell();return}
  if('pkpick' in b.dataset){pkPick=b.dataset.pkpick||null;renderSell();return}
  if(b.dataset.am){addMode=b.dataset.am;render();return}
  if(b.dataset.km){stockMode=b.dataset.km;render();return}
  if(b.dataset.hn){hangNhom=b.dataset.hn;render();return}
  if(b.dataset.sellhang){const h=db.hang.find(x=>x.id===b.dataset.sellhang);sellMode='pk';pkNhom=h.nhom;pkPick=h.id;go('sell');return}
  if(b.dataset.addhang){addMode='hang';addPre=b.dataset.addhang;go('add');return}
  if(b.dataset.model){const k=b.dataset.model;expModel.has(k)?expModel.delete(k):expModel.add(k);render();return}
  if(b.dataset.brand){stockBrand=b.dataset.brand;render();return}
  if(b.dataset.old){stockOld=!stockOld;render();return}
  if(b.dataset.hd){histDays=+b.dataset.hd;cancelId=null;render();return}
  if(b.dataset.brandon){const cur=db.shop.brands||[...BRAND_DEF];const k=b.dataset.brandon;db.shop.brands=cur.includes(k)?cur.filter(x=>x!==k):[...cur,k];save();render();return}
  if(b.dataset.mod){db.shop.mod=db.shop.mod||{};db.shop.mod[b.dataset.mod]=!on(b.dataset.mod);save();render();toast((on(b.dataset.mod)?'Đã bật ':'Đã tắt ')+MODS.find(m=>m.k===b.dataset.mod).t);return}
  if(b.dataset.tgopen){const k=b.dataset.tgopen;tgOpen=tgOpen===k?null:k;tgReject=null;render();return}
  if(b.dataset.tgrej){tgReject=b.dataset.tgrej;render();return}

/* ===== Quét mã vạch =====
   Dùng BarcodeDetector của trình duyệt (Chrome Android). Nếu máy không hỗ trợ hoặc không cấp camera thì báo gõ tay. */
let stream=null, scanTarget=null, scanTimer=null, zxReader=null;
function loadZxing(){return window.ZXing?Promise.resolve():new Promise((ok,bad)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=ok;s.onerror=bad;document.head.appendChild(s)})}
async function openScan(target){
  scanTarget=target;const box=$('scan'),msg=$('scanMsg');box.hidden=false;msg.textContent='Đang mở camera…';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg.textContent='Trình duyệt này không mở được camera. Tạm gõ IMEI bằng tay (bấm *#06# trên máy để xem IMEI).';return}
  if(!('BarcodeDetector' in window)){ // iPhone (Safari) và máy cũ: dùng thư viện ZXing
    try{await loadZxing();const reader=new ZXing.BrowserMultiFormatReader();zxReader=reader;msg.textContent='Đưa mã vạch IMEI vào giữa khung';
      reader.decodeFromConstraints({video:{facingMode:'environment'}},$('cam'),res=>{if(!res)return;const s=res.getText().replace(/\D/g,'');if(s.length===15)gotCode(s)});
    }catch(err){msg.textContent='Không mở được camera. Hãy cho phép camera, hoặc gõ IMEI bằng tay.'}
    return}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('cam');v.srcObject=stream;await v.play();msg.textContent='Đưa mã vạch IMEI vào giữa khung';
    const det=new BarcodeDetector({formats:['code_128','ean_13','code_39']});
    scanTimer=setInterval(async()=>{try{const r=await det.detect(v);const hit=r.map(x=>x.rawValue.replace(/\D/g,'')).find(s=>s.length===15);if(hit)gotCode(hit)}catch(_){}},350);
  }catch(err){msg.textContent='Không mở được camera. Hãy cho phép camera, hoặc gõ IMEI bằng tay.'}
}
function closeScan(){clearInterval(scanTimer);if(zxReader){try{zxReader.reset()}catch(_){}zxReader=null}if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('scan').hidden=true}
function gotCode(code){closeScan();const el=$(scanTarget);if(!el)return;
  if(scanTarget==='aImei'){el.value=(el.value.trim()?el.value.trim()+'\n':'')+code;toast('Đã quét '+code)}
  else{el.value=code;el.dispatchEvent(new Event('input',{bubbles:true}))}}
$('scanClose').addEventListener('click',closeScan);

function qlBlock(g,G){const g1=(G||[]).find(x=>+x.m===12);const n=Math.round((+g.m||12)/12),bai=n*12;const L=['App quản lý bán hàng đủ tính năng: IMEI, kho, bảo hành, lời lỗ, hóa đơn QR','Website mini — bảng giá online gửi khách qua Zalo','Thiết kế hình sản phẩm, kho ảnh máy chính hãng tự cập nhật','<b>'+bai+' bài truyền thông</b> Shop Gọn thiết kế sẵn (1 bài/tháng)','Sale cài app, <b>nhập tồn lần đầu tối đa 50 mã</b> hàng bán chạy, giá trị cao + hướng dẫn sử dụng','Dữ liệu nằm trong Google Drive của chính shop'];

function payBlock(lic){const G=(lic&&lic.goi)||[];if(!G.length)return '';const bk=lic.bank;const i0=Math.min(payGoi,G.length-1),g=G[i0];const nd='SG '+sdtShop(lic);
  return `<div style="width:100%;text-align:left;border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px"><b>${lic.status==='active'?'Thanh toán gia hạn':'Thanh toán để kích hoạt'}</b>
  <div class="seg" role="group">${G.map((x,i)=>`<button type="button" data-paygoi="${i}" aria-pressed="${i===i0}">${esc(x.ten)}<br><small class="num">${short(x.gia)}</small></button>`).join('')}</div>
  ${qlBlock(g,G)}
  ${bk&&bk.acc&&bk.bin?`<div class="qrbox"><div id="payQr" style="padding:10px;background:#fff;border:1px solid var(--line);border-radius:14px;min-height:220px;min-width:220px;display:grid;place-items:center"></div><div class="qri"><b>${esc(bk.nh||'')}</b><span class="num">${esc(bk.acc)}</span><span>${esc(bk.name||'')}</span><span class="num">Số tiền: <b>${money(g.gia)}</b></span><span class="num">Nội dung: <b>${esc(nd)}</b></span></div></div><small style="text-align:center">Quét mã bằng app ngân hàng, giữ nguyên số tiền và nội dung.</small>`
  :`<div class="alert amber"><b>Gói ${esc(g.ten)}: ${money(g.gia)}</b><span>Liên hệ người cài app hoặc Shop Gọn để nhận thông tin chuyển khoản.</span></div>`}${uncBox(lic)}</div>`}
function drawPay(lic){payLic=lic;const bk=lic&&lic.bank,G=(lic&&lic.goi)||[];if(!bk||!bk.acc||!bk.bin||!G.length)return;const g=G[Math.min(payGoi,G.length-1)];const nd=noMark('SG '+sdtShop(lic));
  loadQr().then(()=>{const q=$('payQr');if(!q)return;q.innerHTML='';new QRCode(q,{text:vietqr(bk.bin,bk.acc,g.gia,nd),width:200,height:200,correctLevel:QRCode.CorrectLevel.M})}).catch(()=>{const q=$('payQr');if(q)q.textContent='Không tải được mã QR, kiểm tra mạng.'})}

const uncBox=lic=>`<div class="alert" style="background:#f0faf7;border:1px solid #cde9e1;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45">📸 <b>Chuyển khoản xong:</b> chụp màn hình biên lai, gửi qua Zalo cho <b>Sale đã cài app</b> cho shop. Shop Gọn thấy tiền về là bật ngay — ${lic.status==='active'?'hạn mới tự cộng nối tiếp.':'app <b>tự mở khóa</b>, không cần bấm gì.'}</div>`;
function shrink(file){return new Promise((ok,bad)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const k=Math.min(1,1100/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);let q=.75,d=c.toDataURL('image/jpeg',q);while(d.length>550000&&q>.3){q-=.15;d=c.toDataURL('image/jpeg',q)}ok(d)};im.onerror=bad;im.src=u})}
document.addEventListener('change',async e=>{if(e.target.id!=='uncIn'||!e.target.files[0])return;const msg=$('uncMsg');msg.textContent='Đang gửi ảnh…';
  try{const img=await shrink(e.target.files[0]);const r=await fetch(GG.LICENSE_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({act:'unc',email:GG.email,img})}).then(x=>x.json());
    if(!r.ok){msg.textContent=r.msg||'Chưa gửi được.';return}if(payLic)payLic.unc=todayIso();
    if(r.tam){msg.textContent='✅ Đã kiểm ủy nhiệm chi: đúng tiền gói '+(r.goi||'')+'. Đang mở app…';afterLogin().catch(er=>welcomeMsg(ggErr(er)));return}
    msg.textContent=XEM?'Đã gửi.'+(r.ly?' Ảnh chưa tự khớp ('+r.ly+') — ':' ')+'Shop Gọn kiểm và kích hoạt sớm, app tự mở khóa.':'Đã gửi. Shop Gọn thấy tiền về sẽ gia hạn — vài phút sau bấm "Kiểm tra lại".'}
  catch(_){msg.textContent='Chưa gửi được, kiểm tra mạng rồi thử lại.'}});
/* 23/10: Đơn đã bán — xem theo hóa đơn, ghi chú, sổ khách nợ */
let histQ='', histOpen=null;
document.addEventListener('input',e=>{const t=e.target;if(t.id==='hQ2'){histQ=t.value;renderMore();const i=$('hQ2');i.focus();i.setSelectionRange(i.value.length,i.value.length)}});
document.addEventListener('focusout',e=>{const t=e.target;if((t.id==='hNo'||t.id==='rcTra')&&t.value){const n=parseMoney(t.value);t.value=n?n.toLocaleString('vi-VN'):''}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.hdebt){histDays=-1;histOpen=null;renderMore();return}
  if(d.hopen!==undefined){histOpen=histOpen===d.hopen?null:d.hopen;cancelId=null;renderMore();return}
  const bill=k=>db.don.filter(x=>(x.bill||x.id)===k);
  if(d.sua){suaId=suaId===d.sua?null:d.sua;cancelId=doiId=traId=null;xoaBill=null;renderMore();return}
  if(d.xoa){xoaBill=xoaBill===d.xoa?null:d.xoa;suaId=cancelId=null;renderMore();return}
  if(d.suaok){const x=db.don.find(o=>o.id===d.suaok);if(!x)return;const er=$('eErr'),g=parseMoney($('eGia').value);
    const isG=x.loai==='km'&&x.giaBan<0;if(!(g>=0)||(isG&&!g)){er.textContent='Nhập số tiền';return}
    if($('eTen')&&$('eTen').value.trim())x.ten=$('eTen').value.trim();

    else if(x.loai==='thu'){x.giaBan=-g;x.giaVon=-g;const m=db.may.find(o=>o.imei===x.imei);if(m&&m.tt==='ton')m.giaNhap=g}
    else if($('eSl')){const sl0=x.sl||1,sl=Math.max(1,parseMoney($('eSl').value)),h=db.hang.find(o=>o.id===x.hangId),u=sl0?(+x.giaVon||0)/sl0:0;
      if(h&&!x.huy&&sl-sl0>h.sl){er.textContent='Kho chỉ còn '+h.sl;return}if(h&&!x.huy)h.sl-=sl-sl0;x.sl=sl;x.giaVon=Math.round(u*sl);x.giaBan=g*sl;if(sl>1)x.ten+=' ×'+sl}
    else{x.giaBan=g;if($('eVon')){x.giaVon=parseMoney($('eVon').value);x.uocTinh=false}}
    if($('eBh'))x.bh=parseMoney($('eBh').value);

    L.forEach(x=>{if(x.huy)return;if(x.loai==='may'){const m=db.may.find(o=>o.imei===x.imei);if(m)m.tt='ton'}

/* 23/10: in hóa đơn khổ 58/80mm (lệnh in của máy) + in thẳng máy in nhiệt Bluetooth qua app RawBT (Android) */
function rcData(){const lines=db.don.filter(x=>x.bill===rcId||x.id===rcId);if(!lines.length)return null;const d=lines[0];const tot=lines.reduce((a,x)=>a+x.giaBan,0);const bank=db.shop.bank;return{lines,d,tot,bank,code:'SG'+rcId.slice(-6).toUpperCase(),bn:bank&&(BANKS.find(b=>b[0]===bank.bin)||[])[1]}}

function shrink2(file){return new Promise((ok,bad)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);let q=.82,d=c.toDataURL('image/jpeg',q);while(d.length>1400000&&q>.35){q-=.12;d=c.toDataURL('image/jpeg',q)}ok(d)};im.onerror=bad;im.src=u})}

    Object.values(k.hang||{}).forEach(ds=>(ds||[]).forEach(m=>{const f0=(m.mau||[]).find(z=>z&&z.file),mau=(m.mau||[]).filter(x=>x&&x.ten),cfg=[...new Set((m.bienThe||[]).map(b=>dlN(b.dl)).filter(Boolean))];
      const MS=mau.length>1?mau:[mau[0]||null],CS=cfg.length?cfg:[''],n=MS.length*CS.length;
      CS.forEach(c=>MS.forEach(x=>L.push({ten:m.ten+(c?' '+c:'')+(x&&mau.length>1?' - '+x.ten:''),base:m.ten,hang:m.hang,img:x&&x.file?'/'+x.file:f0?'/'+f0.file:'',n,cfg:c,mau:mau.length>1&&x?x.ten:'',nm:mau.length,nc:cfg.length})));
      if(n>1){const bad=[m.ten];if(mau.length>1)cfg.forEach(c=>bad.push(m.ten+' '+c));if(cfg.length>1)mau.forEach(x=>bad.push(m.ten+' - '+x.ten));bad.forEach(b=>KMbad.set(b.toLowerCase(),{nm:mau.length,nc:cfg.length}))}}));
    KM=L;const i=document.getElementById('aTen');if(i&&document.activeElement===i)sugRender()}).catch(()=>{KM=[]});return KMload}
function sugRender(force){const el=document.getElementById('aSug'),inp=document.getElementById('aTen');if(!el||!inp)return;kmLoad();
  const q=nv0(inp.value).trim(),tk=q.split(/\s+/).filter(Boolean);
  if(!tk.length&&!force){el.hidden=true;return}
  const hit=x=>tk.every(w=>nv0(x).includes(w));
  const own=[...new Set(db.may.map(m=>m.ten))].filter(hit).map(t=>({ten:t,own:1,ton:db.may.filter(m=>m.ten===t&&m.tt==='ton').length,img:(KM||[]).find(x=>x.ten===t)?.img||''}));
  const cat=(KM||[]).filter(x=>hit(x.ten)&&!own.some(o=>o.ten===x.ten));
  const tong=own.length+cat.length;SUGS=[...own,...cat].slice(0,30);
  if(SUGS.some(x=>x.ten===inp.value.trim())&&!force||inp.dataset.ngoai==='1'){el.hidden=true;return}
  el.innerHTML=SUGS.map((x,i)=>`<button type="button" data-sug="${i}">${x.img?`<img src="${esc(x.img)}" alt="" loading="lazy">`:'<span class="dot">📱</span>'}<span class="t"><b>${esc(x.ten)}</b><small>${x.own?'Shop đã có · còn '+x.ton+' máy':esc(x.hang||'')+(x.n>1?' · 1 trong '+x.n+' lựa chọn':'')}</small></span></button>`).join('')+`<button type="button" data-sugngoai="1" class="sugngoai"><span class="dot">✏️</span><span class="t"><b>Máy ngoài danh sách — nhập tay</b><small>${SUGS.length?'Không thấy máy cần tìm (máy đời cũ, hãng khác)':'Không có trong kho máy'} · ghi rõ tên + cấu hình + màu</small></span></button>`+(tong>SUGS.length?`<small style="display:block;padding:8px 10px;color:#46506b">Còn ${tong-SUGS.length} mẫu nữa — gõ thêm cấu hình (VD 8/256) hoặc màu để lọc</small>`:'')+(KM?'':'<small style="display:block;padding:8px 10px;color:#46506b">Đang tải kho máy…</small>');el.hidden=false}
document.addEventListener('click',e=>{const b=e.target.closest('[data-sug]');if(!b)return;const x=SUGS[+b.dataset.sug],inp=document.getElementById('aTen');if(!x||!inp)return;
  inp.value=x.ten;inp.dispatchEvent(new Event('input',{bubbles:true}));const sel=document.getElementById('aHang');const hg=x.hang==='Apple'?'iPhone':x.hang;if(sel&&hg){if(![...sel.options].some(o=>o.value===hg))sel.add(new Option(hg,hg));sel.value=hg}
  document.getElementById('aSug').hidden=true;const er=document.getElementById('aErr');if(er)er.textContent='';const im=document.getElementById('aImei');if(im)im.focus()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-sugngoai]');if(!b)return;const inp=document.getElementById('aTen');if(!inp)return;inp.dataset.ngoai='1';document.getElementById('aSug').hidden=true;
  const h=document.getElementById('aHint');if(h){h.className='hint new';h.textContent='✏️ Máy ngoài danh sách — gõ đủ: tên + cấu hình + màu. VD: iPhone 12 128GB Đen'}const er=document.getElementById('aErr');if(er)er.textContent='';inp.focus();setTimeout(()=>{try{inp.setSelectionRange(inp.value.length,inp.value.length)}catch(_){}},0)});
document.addEventListener('focusin',e=>{if(e.target.id==='aTen'){kmLoad();if(e.target.value)sugRender()}});
</script>

<script>

const trCo=d=>!d.huy&&!d.tra&&!['tra','doi','km','thu'].includes(d.loai)&&(+d.giaBan||0)>=0;

        ${can?`<button class="ghost" data-trpick="${d.id}">Trả</button>`:''}

          <div class="two">${con>1?`<label>Số lượng trả<input id="trSl" inputmode="numeric" value="${con}" data-tru="${Math.round(d.giaBan/sl)}"></label>`:''}<label>Tiền hoàn khách<input id="trHoan" inputmode="numeric" class="num" value="${Math.round(d.giaBan/sl*con).toLocaleString('vi-VN')}"></label></div>
          <label style="flex-direction:row;align-items:center;gap:8px;display:flex"><input type="checkbox" id="trLoi" style="width:22px;height:22px"> ${d.loai==='may'?'Máy lỗi — chờ bảo hành, chưa bán lại':'Hàng lỗi — không nhập lại kho'}</label>
          <label>Lý do<input id="trLyDo" placeholder="VD: khách đổi ý, lỗi màn hình…"></label>

document.addEventListener('input',e=>{const t=e.target;if(t.id==='trQ'){trQ=t.value;trSel=null;renderSell();const i=$('trQ');i.focus();i.setSelectionRange(i.value.length,i.value.length)}
  else if(t.id==='trSl'){const n=Math.max(1,parseMoney(t.value)||1),u=+t.dataset.tru||0;const h=$('trHoan');if(h)h.value=(u*n).toLocaleString('vi-VN')}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.trpick!==undefined){trSel=d.trpick||null;renderSell();return}
  if(d.trok){const x=db.don.find(o=>o.id===d.trok);if(!x)return;const sl=x.sl||1,con=sl-(x.traSl||0);const q=$('trSl')?Math.min(con,Math.max(1,parseMoney($('trSl').value)||1)):con;
    const hoan=parseMoney($('trHoan').value),loi=$('trLoi').checked,ly=$('trLyDo').value.trim();let vonTra=0;
    if(x.loai==='may'){const m=db.may.find(o=>o.imei===x.imei);if(m)m.tt=loi?'loi':'ton';vonTra=+x.giaVon||0}
    else if(x.hangId){const h=db.hang.find(o=>o.id===x.hangId);const u=sl?(+x.giaVon||0)/sl:0;if(!loi){if(h)h.sl+=q;vonTra=Math.round(u*q)}}
    const n0=new Date(),bill=uid();db.don.push({id:uid(),bill,ngay:todayIso(),gio:n0.getHours()+':'+String(n0.getMinutes()).padStart(2,'0'),loai:'tra',imei:x.imei||'',hangId:x.hangId||'',sl:q,ten:'Trả hàng: '+String(x.ten).replace(/ ×\d+$/,'')+(q>1?' ×'+q:'')+(ly?' ('+ly+')':''),hang:x.hang||'',giaBan:-hoan,giaVon:-vonTra,khach:x.khach||'',sdt:x.sdt||'',tt:'Tiền mặt',huy:null,traTu:x.bill||x.id});
    x.traSl=(x.traSl||0)+q;if(x.traSl>=sl)x.tra=1;trSel=null;save();render();
    toast('Đã nhận trả · hoàn khách '+money(hoan)+(x.loai==='may'?(loi?' · máy vào chờ bảo hành':' · máy về kho'):x.hangId&&!loi?' · đã cộng lại kho':''));openReceipt(bill);return}});

<script>
/* ===== 26/10 anh Thái: 3 TÍNH NĂNG CHỐT — Khách hàng · Nhà cung cấp (công nợ, trả tiền, trả hàng) · Kiểm kho ===== */
const sdtN=x=>String(x||'').replace(/\D/g,'');
function khachDs(){const M=new Map();db.don.forEach(d=>{const sd=sdtN(d.sdt),ten=(d.khach||'').trim();if(!sd&&!ten)return;const k=sd||'ten:'+nv0(ten);
    const o=M.get(k)||{k,sdt:d.sdt||'',ten:'',bills:new Set(),mua:0,no:0,cuoi:'',may:[],L:[]};if(ten&&!o.ten)o.ten=ten;if(!o.sdt&&d.sdt)o.sdt=d.sdt;
    if(!d.huy){o.mua+=+d.giaBan||0;o.bills.add(d.bill||d.id);if(d.loai==='may'&&!d.tra)o.may.push(d)}if(+d.no&&!d.huy)o.no+=+d.no;if((d.ngay||'')>o.cuoi)o.cuoi=d.ngay;o.L.push(d);M.set(k,o)});
  return [...M.values()].sort((a,b)=>b.cuoi.localeCompare(a.cuoi))}
let khQ='',khOpen=null;
function bhCon(d){const end=new Date(d.ngay);end.setMonth(end.getMonth()+(+d.bh||0));return Math.ceil((end-new Date(todayIso()))/DAY)}
function renderKhach(){const q=nv0(khQ).trim();let L=khachDs();const tong=L.length;if(q)L=L.filter(o=>nv0(o.ten+' '+o.sdt+' '+sdtN(o.sdt)+' '+o.L.map(d=>d.ten+' '+(d.imei||'')).join(' ')).includes(q));
  return `<div class="panel"><h2>👥 Khách hàng · ${tong}</h2><input id="khQ" inputmode="search" placeholder="Tìm tên, SĐT, IMEI, tên máy" value="${esc(khQ)}">

  <div class="panel"><div class="list">${L.length?L.slice(0,60).map(o=>{const op=khOpen===o.k;return `<div class="mg"><button class="mrow" data-khopen="${esc(o.k)}"><span class="n"><b>${esc(o.ten||'Khách')}${o.no>0?` <span class="pill r">Nợ ${short(o.no)}</span>`:''}</b><small class="num">${esc(o.sdt||'Chưa có SĐT')} · ${o.bills.size} đơn · mua lần cuối ${dmy(o.cuoi)}</small></span><span class="cnt num">${short(o.mua)}</span><span class="chev">${op?'▴':'▾'}</span></button>
    ${op?`<div class="imeis" style="padding:6px 12px 12px">${o.sdt?`<div class="inrow" style="margin-bottom:8px"><a class="ghost" href="tel:${esc(sdtN(o.sdt))}">📞 Gọi</a><a class="ghost" href="https://zalo.me/${esc(sdtN(o.sdt))}" target="_blank" rel="noopener">💬 Zalo</a></div>`:''}
      ${o.may.length?`<div class="eyebrow">Máy đã mua · bảo hành</div>${o.may.map(d=>{const l=bhCon(d);return `<div class="row"><div class="n"><b>${esc(d.ten)}</b><small class="num">IMEI ${esc(d.imei||'')} · mua ${dmy(d.ngay)}</small></div><div class="right">${+d.bh?(l>=0?`<span class="pill g">Còn BH ${l} ngày</span>`:'<span class="pill r">Hết BH</span>'):''}</div></div>`}).join('')}`:''}

      ${o.no>0?`<button class="ghost" data-more="hist" data-hdebt="1" style="width:100%;margin-top:8px">Xem / thu nợ ở Đơn đã bán</button>`:''}</div>`:''}</div>`}).join(''):'<div class="empty">Chưa có khách nào. Khi bán, nhập tên hoặc SĐT khách để lưu.</div>'}</div></div>`}
/* --- Nhà cung cấp: công nợ = Σ phiếu.no (phiếu nhập còn nợ +, trả tiền −, trả hàng trừ nợ −) --- */
let nccOpen=null,nccAct='',nccTra=[];
function nccDs(){const M=new Map();const g=n=>{const k=(n||'').trim()||'(Chưa ghi NCC)';if(!M.has(k))M.set(k,{ten:k,nhap:0,no:0,cuoi:'',P:[],ton:0});return M.get(k)};

  db.may.forEach(m=>{if(m.tt==='ton'&&m.ncc)g(m.ncc).ton++});return [...M.values()].filter(o=>o.P.length).sort((a,b)=>b.no-a.no||b.cuoi.localeCompare(a.cuoi))}
function renderNcc(){const L=nccDs(),tno=L.reduce((s,o)=>s+Math.max(0,o.no),0);
  return `<div class="panel"><h2>🚚 Nhà cung cấp</h2>${tno?`<div class="alert amber"><b>Shop còn nợ NCC tổng ${money(tno)}</b></div>`:'<small style="color:#46506b">Ghi "Còn nợ nhà cung cấp" khi lưu phiếu nhập để theo dõi công nợ ở đây.</small>'}</div>
  <div class="panel"><div class="list">${L.length?L.map(o=>{const op=nccOpen===o.ten;return `<div class="mg"><button class="mrow" data-nccopen="${esc(o.ten)}"><span class="n"><b>${esc(o.ten)}${o.no>0?` <span class="pill r">Nợ ${short(o.no)}</span>`:o.no<0?` <span class="pill g">NCC nợ lại ${short(-o.no)}</span>`:''}</b><small class="num">Đã nhập ${short(o.nhap)} · ${o.P.filter(p=>!p.loai).length} phiếu · ${o.ton} máy còn tồn</small></span><span class="chev">${op?'▴':'▾'}</span></button>
    ${op?`<div class="imeis" style="padding:6px 12px 12px">

      ${nccAct==='tien'?`<div class="confirm"><b>Trả tiền cho ${esc(o.ten)}</b><div class="two"><label>Số tiền<input id="nTien" inputmode="numeric" class="num" value="${o.no>0?(+o.no).toLocaleString('vi-VN'):''}"></label><label>Cách trả<select id="nCach"><option>Tiền mặt</option><option>Chuyển khoản</option></select></label></div>
        <span class="inrow"><button class="btn" data-nccpay="${esc(o.ten)}">Lưu</button><button class="ghost" data-nccact="">Thôi</button></span><small style="color:#46506b">Trả tiền mặt thì tự ghi vào Sổ chi để chốt két đúng.</small></div>`:''}
      ${nccAct==='hang'?renderTraNcc(o):''}
      <div class="eyebrow" style="margin-top:8px">Lịch sử</div>${o.P.slice().sort((a,b)=>(b.ngay+(b.gio||'')).localeCompare(a.ngay+(a.gio||''))).map(p=>`<div class="row"><div class="n"><b>${p.loai==='tt'?'💵 Trả tiền':p.loai==='tra'?'↩️ Trả hàng':'🧾 Phiếu nhập'}${p.note?' · '+esc(p.note):''}</b><small class="num">${dmy(p.ngay)} ${esc(p.gio||'')}${p.loai==='tra'?' · '+(p.dong||[]).map(x=>esc(x.ten)+' ×'+(x.t==='may'?(x.imeis||[]).length:x.sl)).join(', '):''}</small></div><div class="right"><b class="num">${p.loai==='tt'?money(-p.no):money(p.tong||0)}</b>${+p.no&&!p.loai?`<small class="num neg">nợ ${money(p.no)}</small>`:''}</div></div>`).join('')}</div>`:''}</div>`}).join(''):'<div class="empty">Chưa có phiếu nhập nào.</div>'}</div></div>`}
function renderTraNcc(o){const ms=db.may.filter(m=>m.tt==='ton'&&(m.ncc||'(Chưa ghi NCC)')===o.ten),hs=db.hang.filter(h=>h.sl>0);const sel=new Set(nccTra);
  const tien=ms.filter(m=>sel.has(m.imei)).reduce((s,m)=>s+(+m.giaNhap||0),0);
  return `<div class="confirm"><b>Trả hàng cho ${esc(o.ten)}</b>
    <span class="inrow"><input id="ntIm" inputmode="numeric" placeholder="Quét / gõ IMEI máy trả"><button type="button" class="icon" data-scan="ntIm" aria-label="Quét IMEI"><svg viewBox="0 0 24 24"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M7 8v8M10 8v8M13 8v8M17 8v8"/></svg></button></span>
    <div class="list">${ms.length?ms.map(m=>`<label class="row" style="display:flex;flex-direction:row;align-items:center;gap:10px;margin:0;font-weight:400"><input type="checkbox" data-ntm="${m.imei}" ${sel.has(m.imei)?'checked':''} style="width:22px;height:22px"><span class="n"><b>${esc(m.ten)}</b><small class="num">IMEI ${m.imei} · nhập ${money(m.giaNhap)}</small></span></label>`).join(''):'<div class="empty">Không còn máy tồn của NCC này.</div>'}</div>
    ${hs.length?`<details class="more"><summary>＋ Trả phụ kiện / hàng khác</summary><div class="two"><label>Món<select id="ntH"><option value="">— Chọn —</option>${hs.map(h=>`<option value="${h.id}">${esc(h.ten)} (còn ${h.sl})</option>`).join('')}</select></label><label>Số lượng<input id="ntSl" inputmode="numeric" placeholder="0"></label></div></details>`:''}
    <div class="two"><label>Tiền hàng trả<input id="ntTien" inputmode="numeric" class="num" value="${tien?tien.toLocaleString('vi-VN'):''}"></label><label>NCC xử lý<select id="ntCach"><option value="no">Trừ vào nợ NCC</option><option value="tien">NCC trả tiền lại</option></select></label></div>
    <label>Ghi chú<input id="ntNote" placeholder="VD: máy lỗi màn, trả về bảo hành"></label>
    <span class="inrow"><button class="btn" data-nttra="${esc(o.ten)}">Xác nhận trả · xuất kho</button><button class="ghost" data-nccact="">Thôi</button></span>
    <small style="color:#46506b">Máy chọn rời khỏi kho, phụ kiện trừ số lượng. Tiền hàng tự tính theo giá nhập, sửa được.</small></div>`}
/* --- Kiểm kho --- */
let KK=(()=>{try{return JSON.parse(localStorage.getItem('shopgon_kk')||'null')||{q:[],luc:''}}catch(_){return {q:[],luc:''}}})(),kkTab='may',kkDel='';
const kkSave=()=>{try{localStorage.setItem('shopgon_kk',JSON.stringify(KK))}catch(_){}};
function kkAdd(raw){const im=String(raw||'').replace(/\D/g,'');if(im.length<6){toast('IMEI chưa đủ số');return}if(KK.q.includes(im)){toast('Đã quét máy này rồi');return}KK.q.push(im);if(!KK.luc)KK.luc=todayIso();kkSave();
  const m=db.may.find(x=>x.imei===im);toast(m&&m.tt==='ton'?'✓ '+m.ten:m?'⚠ Máy này '+(m.tt==='ban'?'đã bán':'không ở tồn kho'):'⚠ IMEI không có trong kho');renderMore();setTimeout(()=>{const i=$('kkIn');if(i)i.focus()},0)}
function renderKiemKho(){const ton=db.may.filter(m=>m.tt==='ton'),qs=new Set(KK.q),ok=ton.filter(m=>qs.has(m.imei)),thieu=ton.filter(m=>!qs.has(m.imei)),thua=KK.q.filter(im=>!ton.some(m=>m.imei===im));
  const tab=(k,t)=>`<button data-kktab="${k}" aria-pressed="${kkTab===k}">${t}</button>`;
  return `<div class="seg" role="group" style="margin-bottom:10px">${tab('may','Điện thoại')}${tab('hang','Phụ kiện, hàng')}</div>`+(kkTab==='may'?`<div class="panel"><h2>📋 Kiểm kho điện thoại</h2>
    <span class="inrow"><input id="kkIn" inputmode="numeric" placeholder="Quét / gõ IMEI từng máy trên kệ"><button type="button" class="icon" data-scan="kkIn" aria-label="Quét IMEI"><svg viewBox="0 0 24 24"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M7 8v8M10 8v8M13 8v8M17 8v8"/></svg></button><button class="ghost" data-kkadd="1">Thêm</button></span>
    <div class="kpis" style="margin-top:10px"><div class="kpi"><div class="eyebrow">Đã quét khớp</div><div class="v num">${ok.length}/${ton.length}</div></div><div class="kpi"><div class="eyebrow">Thiếu (chưa quét)</div><div class="v num" style="color:${thieu.length?'var(--red)':'inherit'}">${thieu.length}</div></div><div class="kpi"><div class="eyebrow">Lạ / sai</div><div class="v num">${thua.length}</div></div></div>
    ${KK.luc?`<small style="color:#46506b">Bắt đầu kiểm ${dmy(KK.luc)} · ${KK.q.length} lần quét. Thoát ra vẫn giữ, quay lại quét tiếp.</small>`:''}
    <button class="wlink" data-kkreset="1" style="margin-top:6px">Kiểm lại từ đầu</button></div>
    ${thua.length?`<div class="panel" style="border:2px solid #f0d08a"><h2>⚠ ${thua.length} IMEI lạ / không ở tồn kho</h2><div class="list">${thua.map(im=>{const m=db.may.find(x=>x.imei===im);return `<div class="row"><div class="n"><b class="num">${im}</b><small>${m?esc(m.ten)+' · '+(m.tt==='ban'?'đã bán — kiểm lại đơn':m.tt==='loi'?'đang chờ bảo hành':'không ở tồn'):'Chưa nhập kho — vào Nhập hàng để nhập'}</small></div><button class="xbtn" data-kkbo="${im}" aria-label="Bỏ">✕</button></div>`}).join('')}</div></div>`:''}
    ${thieu.length?`<div class="panel"><h2>Thiếu ${thieu.length} máy (có trong sổ, chưa quét)</h2><div class="list">${thieu.map(m=>`<div class="row" style="flex-wrap:wrap"><div class="n"><b>${esc(m.ten)}</b><small class="num">IMEI ${m.imei} · nhập ${dmy(m.ngayNhap)}</small></div><button class="ghost red" data-kkdel="${m.imei}">Xóa khỏi kho</button>
      ${kkDel===m.imei?`<div class="confirm" style="flex-basis:100%"><b style="color:var(--red)">Xóa IMEI này khỏi kho?</b><span>Chỉ xóa khi chắc máy không còn (nhập trùng, mất).</span><span class="inrow"><button class="ghost red" data-delimeiok="${m.imei}">Xác nhận xóa</button><button class="ghost" data-kkdel="">Thôi</button></span></div>`:''}</div>`).join('')}</div></div>`:ton.length?'<div class="panel"><div class="empty">✅ Đủ máy — khớp 100% với sổ.</div></div>':''}`
  :`<div class="panel"><h2>📋 Đếm phụ kiện, hàng</h2><small style="color:#46506b">Gõ số đếm thực tế, bỏ trống món chưa đếm. Bấm Lưu để cập nhật tồn.</small>
    <div class="list">${db.hang.filter(h=>h.sl>0||h.min).map(h=>`<div class="row"><div class="n"><b>${esc(h.ten)}</b><small class="num">Sổ: ${h.sl}</small></div><input data-kkh="${h.id}" inputmode="numeric" class="num" style="width:80px;text-align:center" placeholder="${h.sl}"></div>`).join('')||'<div class="empty">Chưa có phụ kiện.</div>'}</div>
    <button class="btn" data-kkhsave="1" style="width:100%;margin-top:10px">Lưu số đếm</button></div>`)}
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='khQ'){khQ=t.value;renderMore();const i=$('khQ');i.focus();i.setSelectionRange(i.value.length,i.value.length);return}
  if(t.id==='kkIn'&&/^\d{15}$/.test(t.value.trim())){kkAdd(t.value);return}
  if(t.id==='ntIm'&&/^\d{15}$/.test(t.value.trim())){const im=t.value.trim();if(db.may.some(m=>m.imei===im&&m.tt==='ton')){if(!nccTra.includes(im))nccTra.push(im);renderMore()}else{toast('IMEI không có trong tồn kho');t.value=''}return}
  if(t.dataset&&t.dataset.ntm!==undefined)return});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.ntm){const im=t.dataset.ntm;nccTra=t.checked?[...new Set([...nccTra,im])]:nccTra.filter(x=>x!==im);const k=$('ntTien');const tien=db.may.filter(m=>nccTra.includes(m.imei)).reduce((s,m)=>s+(+m.giaNhap||0),0);if(k)k.value=tien?tien.toLocaleString('vi-VN'):''}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.khopen!==undefined){khOpen=khOpen===d.khopen?null:d.khopen;renderMore();return}
  if(d.nccopen!==undefined){nccOpen=nccOpen===d.nccopen?null:d.nccopen;nccAct='';nccTra=[];renderMore();return}
  if(d.nccact!==undefined){nccAct=nccAct===d.nccact?'':d.nccact;nccTra=[];renderMore();return}
  if(d.nccpay){const tien=parseMoney($('nTien').value);if(!tien){toast('Nhập số tiền');return}const cach=$('nCach').value,n0=new Date(),gio=n0.getHours()+':'+String(n0.getMinutes()).padStart(2,'0');
    (db.pn=db.pn||[]).push({id:uid(),ngay:todayIso(),gio,ncc:d.nccpay==='(Chưa ghi NCC)'?'':d.nccpay,tong:0,nMay:0,no:-tien,loai:'tt',note:cach,dong:[]});
    if(cach==='Tiền mặt')(db.chi=db.chi||[]).push({id:uid(),ngay:todayIso(),gio,loai:'Trả NCC',tien,note:d.nccpay});
    nccAct='';save();renderMore();toast('Đã ghi trả '+money(tien)+' cho '+d.nccpay);return}
  if(d.nttra){const ncc=d.nttra==='(Chưa ghi NCC)'?'':d.nttra,ms=db.may.filter(m=>m.tt==='ton'&&nccTra.includes(m.imei));const hid=$('ntH')?$('ntH').value:'',hsl=$('ntSl')?parseMoney($('ntSl').value):0,h=hid&&db.hang.find(x=>x.id===hid);
    if(!ms.length&&!(h&&hsl>0)){toast('Chọn máy hoặc phụ kiện cần trả');return}if(h&&hsl>h.sl){toast('Kho chỉ còn '+h.sl);return}
    const tien=parseMoney($('ntTien').value)||(ms.reduce((s,m)=>s+(+m.giaNhap||0),0)+(h?h.giaNhap*hsl:0)),cach=$('ntCach').value,n0=new Date(),gio=n0.getHours()+':'+String(n0.getMinutes()).padStart(2,'0');
    const G={};ms.forEach(m=>{(G[m.ten]=G[m.ten]||{t:'may',ten:m.ten,hang:m.hang,gn:m.giaNhap,imeis:[]}).imeis.push(m.imei);m.tt='ncc'});const dong=Object.values(G);
    if(h&&hsl>0){h.sl-=hsl;dong.push({t:'hang',id:h.id,ten:h.ten,nhom:h.nhom,sl:hsl,gn:h.giaNhap})}
    (db.pn=db.pn||[]).push({id:uid(),ngay:todayIso(),gio,ncc,tong:-tien,nMay:-ms.length,no:cach==='no'?-tien:0,loai:'tra',note:($('ntNote').value.trim()||'')+(cach==='tien'?' (NCC trả tiền)':''),dong});
    nccAct='';nccTra=[];save();renderMore();toast('Đã trả hàng cho '+(ncc||'NCC')+' · '+money(tien)+(cach==='no'?' trừ nợ':''));return}
  if(d.kktab){kkTab=d.kktab;renderMore();return}
  if(d.kkadd){kkAdd(($('kkIn')||{}).value);return}
  if(d.kkbo){KK.q=KK.q.filter(x=>x!==d.kkbo);kkSave();renderMore();return}
  if(d.kkreset){if(!confirm('Xóa kết quả quét, kiểm lại từ đầu?'))return;KK={q:[],luc:''};kkSave();renderMore();return}
  if(d.kkdel!==undefined){kkDel=kkDel===d.kkdel?'':d.kkdel;renderMore();return}
  if(d.kkhsave){let n=0;document.querySelectorAll('[data-kkh]').forEach(i=>{if(i.value.trim()==='')return;const h=db.hang.find(x=>x.id===i.dataset.kkh);const v=parseMoney(i.value);if(h&&v>=0&&v!==h.sl){h.sl=v;n++}});save();renderMore();toast(n?'Đã cập nhật '+n+' món':'Không có thay đổi');return}});
</script>
</body></html>
