  queue(ms=2500){clearTimeout(this.timer);this.timer=setTimeout(()=>this.push(),ms)},
  async pull(){const r=await this.api(`https://sheets.googleapis.com/v4/spreadsheets/${this.sheetId}/values:batchGet?ranges=May&ranges=Don&ranges=Hang&ranges=CaiDat`);
    const [M,D,H,C]=r.valueRanges.map(v=>v.values||[]);const num=new Set(['giaNhap','giaBan','giaVon','soTien','sl','min','bh','no']);
    const toObjs=V=>{if(!V.length)return [];const [h,...rows]=V;return rows.map(x=>{const o={};h.forEach((k,i)=>{let v=x[i]??'';if(num.has(k))v=v===''?0:+v;if(k==='huy'&&v==='')v=null;if(k==='uocTinh')v=v==='TRUE'||v===true;o[k]=v});return o})};

};

const BANKS=[['970436','Vietcombank'],['970415','VietinBank'],['970418','BIDV'],['970405','Agribank'],['970407','Techcombank'],['970422','MB Bank'],['970416','ACB'],['970432','VPBank'],['970403','Sacombank'],['970423','TPBank'],['970441','VIB'],['970443','SHB'],['970437','HDBank'],['970448','OCB'],['970426','MSB'],['970440','SeABank'],['970449','LPBank'],['970431','Eximbank'],['970428','Nam A Bank'],['970409','Bac A Bank'],['970452','KienlongBank'],['970412','PVcomBank']];
const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
function crc16(str){let c=0xFFFF;for(let i=0;i<str.length;i++){c^=str.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function vietqr(bin,acc,amount,info){const mai=tlv('00','A000000727')+tlv('01',tlv('00',bin)+tlv('01',acc))+tlv('02','QRIBFTTA');
  let p=tlv('00','01')+tlv('01','12')+tlv('38',mai)+tlv('53','704')+tlv('54',String(Math.round(amount)))+tlv('58','VN')+tlv('62',tlv('08',info))+'6304';return p+crc16(p)}
const noMark=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^A-Za-z0-9 ]/g,'');
function loadQr(){return window.QRCode?Promise.resolve():new Promise((ok,bad)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';sc.onload=ok;sc.onerror=bad;document.head.appendChild(sc)})}
let rcId=null, rcPay='ck';
function openReceipt(id){rcId=id;rcPay=db.shop.bank?'ck':'tm';renderReceipt()}
function renderReceipt(){const lines=db.don.filter(x=>x.bill===rcId||x.id===rcId);if(!lines.length)return;const d=lines[0];const tot=lines.reduce((a,x)=>a+x.giaBan,0);const el=$('rc');el.hidden=false;
  const bank=db.shop.bank, bn=bank&&(BANKS.find(b=>b[0]===bank.bin)||[])[1];const code='SG'+rcId.slice(-6).toUpperCase();
  const canPrint=(()=>{try{return window.self===window.top}catch(e){return false}})();
  el.innerHTML=`<div class="rc"><div class="rcp" id="rcPrint">
    <div class="rct">${esc(db.shop.ten||'Hóa đơn bán hàng')}</div><div class="rcs">Hóa đơn ${code} · ${dmy(d.ngay)} ${d.gio}</div>

    <div class="rcls">${lines.map(x=>`<div class="rcl"><div><b>${esc(x.ten)}</b>${x.imei?`<small class="num">IMEI ${x.imei}</small>`:''}${x.bh?`<small>Bảo hành ${x.bh} tháng</small>`:''}</div><b class="num">${money(x.giaBan)}</b></div>`).join('')}</div>

  </div>

/* ===== Quét mã vạch =====
   Dùng BarcodeDetector của trình duyệt (Chrome Android). Nếu máy không hỗ trợ hoặc không cấp camera thì báo gõ tay. */
let stream=null, scanTarget=null, scanTimer=null, zxReader=null;
function loadZxing(){return window.ZXing?Promise.resolve():new Promise((ok,bad)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=ok;s.onerror=bad;document.head.appendChild(s)})}
async function openScan(target){
  scanTarget=target;const box=$('scan'),msg=$('scanMsg');box.hidden=false;msg.textContent='Đang mở camera…';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg.textContent='Trình duyệt này không mở được camera. Tạm gõ IMEI bằng tay (bấm *#06# trên máy để xem IMEI).';return}
  if(!('BarcodeDetector' in window)){ // iPhone (Safari) và máy cũ: dùng thư viện ZXing
    try{await loadZxing();const reader=new ZXing.BrowserMultiFormatReader();zxReader=reader;msg.textContent='Đưa mã vạch IMEI vào giữa khung';
      reader.decodeFromConstraints({video:{facingMode:'environment'}},$('cam'),res=>{if(!res)return;const s=res.getText().replace(/\D/g,'');if(s.length===15)gotCode(s)});
    }catch(err){msg.textContent='Không mở được camera. Hãy cho phép camera, hoặc gõ IMEI bằng tay.'}
    return}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('cam');v.srcObject=stream;await v.play();msg.textContent='Đưa mã vạch IMEI vào giữa khung';
    const det=new BarcodeDetector({formats:['code_128','ean_13','code_39']});
    scanTimer=setInterval(async()=>{try{const r=await det.detect(v);const hit=r.map(x=>x.rawValue.replace(/\D/g,'')).find(s=>s.length===15);if(hit)gotCode(hit)}catch(_){}},350);
  }catch(err){msg.textContent='Không mở được camera. Hãy cho phép camera, hoặc gõ IMEI bằng tay.'}
}
function closeScan(){clearInterval(scanTimer);if(zxReader){try{zxReader.reset()}catch(_){}zxReader=null}if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('scan').hidden=true}
function gotCode(code){closeScan();const el=$(scanTarget);if(!el)return;
  if(scanTarget==='aImei'){el.value=(el.value.trim()?el.value.trim()+'\n':'')+code;toast('Đã quét '+code)}
  else{el.value=code;el.dispatchEvent(new Event('input',{bubbles:true}))}}
$('scanClose').addEventListener('click',closeScan);

/* 23/10: QR thanh toán gói ngay trên màn chờ duyệt — TK nhận tiền + bảng giá lấy từ máy chủ (tab CauHinh), không ghi trong code */

function qlBlock(g,G){const g1=(G||[]).find(x=>+x.m===12);const n=Math.round((+g.m||12)/12),bai=n*12;const L=['App quản lý bán hàng đủ tính năng: IMEI, kho, bảo hành, lời lỗ, hóa đơn QR','Website mini — bảng giá online gửi khách qua Zalo','Thiết kế hình sản phẩm, kho ảnh máy chính hãng tự cập nhật','<b>'+bai+' bài truyền thông</b> Shop Gọn thiết kế sẵn (1 bài/tháng)','Sale cài app, <b>nhập tồn lần đầu tối đa 50 mã</b> hàng bán chạy, giá trị cao + hướng dẫn sử dụng','Dữ liệu nằm trong Google Drive của chính shop'];
  return `<div style="background:#f0faf7;border:1px solid #cde9e1;border-radius:14px;padding:10px 12px;font-size:13.5px;line-height:1.45">${g.giaGoc?`<div style="background:#fff4dc;border-radius:10px;padding:7px 9px;margin-bottom:8px;color:#7a4d00;font-weight:700">🎁 Ưu đãi 100 shop đầu tiên: <s style="font-weight:500">${(+g.giaGoc).toLocaleString('vi-VN')}đ</s> → ${(+g.gia).toLocaleString('vi-VN')}đ${g.conLai?' · còn '+g.conLai+' suất':''}</div>`:''}<b>Gói ${esc(g.ten)} gồm:</b><ul style="margin:6px 0 0;padding-left:18px">${L.map(x=>`<li>${x}</li>`).join('')}</ul><div style="margin-top:6px;color:#0b5e57;font-weight:700">≈ ${(Math.round(g.gia/(365*n)/100)*100).toLocaleString('vi-VN')}đ/ngày${n>1&&g1?' · tiết kiệm '+((g1.giaGoc||g1.gia)*n-g.gia).toLocaleString('vi-VN')+'đ so với mua '+n+' lần gói 1 năm':''}</div><div style="margin-top:6px;color:#667">Shop trên 50 mã hàng: thương lượng với Sale gói hỗ trợ nhập full shop.</div></div>`}
function payBlock(lic){const G=(lic&&lic.goi)||[];if(!G.length)return '';const bk=lic.bank;const i0=Math.min(payGoi,G.length-1),g=G[i0];const nd='SG '+sdtShop(lic);
  return `<div style="width:100%;text-align:left;border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px"><b>${lic.status==='active'?'Thanh toán gia hạn':'Thanh toán để kích hoạt'}</b>
  <div class="seg" role="group">${G.map((x,i)=>`<button type="button" data-paygoi="${i}" aria-pressed="${i===i0}">${esc(x.ten)}<br><small class="num">${short(x.gia)}</small></button>`).join('')}</div>
  ${qlBlock(g,G)}
  ${bk&&bk.acc&&bk.bin?`<div class="qrbox"><div id="payQr" style="padding:10px;background:#fff;border:1px solid var(--line);border-radius:14px;min-height:220px;min-width:220px;display:grid;place-items:center"></div><div class="qri"><b>${esc(bk.nh||'')}</b><span class="num">${esc(bk.acc)}</span><span>${esc(bk.name||'')}</span><span class="num">Số tiền: <b>${money(g.gia)}</b></span><span class="num">Nội dung: <b>${esc(nd)}</b></span></div></div><small style="text-align:center">Quét mã bằng app ngân hàng, giữ nguyên nội dung. Chuyển xong vài phút bấm "Kiểm tra lại".</small>`
  :`<div class="alert amber"><b>Gói ${esc(g.ten)}: ${money(g.gia)}</b><span>Liên hệ người cài app hoặc Shop Gọn để nhận thông tin chuyển khoản.</span></div>`}${uncBox(lic)}</div>`}
function drawPay(lic){payLic=lic;const bk=lic&&lic.bank,G=(lic&&lic.goi)||[];if(!bk||!bk.acc||!bk.bin||!G.length)return;const g=G[Math.min(payGoi,G.length-1)];const nd=noMark('SG '+sdtShop(lic));
  loadQr().then(()=>{const q=$('payQr');if(!q)return;q.innerHTML='';new QRCode(q,{text:vietqr(bk.bin,bk.acc,g.gia,nd),width:200,height:200,correctLevel:QRCode.CorrectLevel.M})}).catch(()=>{const q=$('payQr');if(q)q.textContent='Không tải được mã QR, kiểm tra mạng.'})}
/* 23/10: Thêm › Gia hạn — shop đang dùng chuyển khoản gia hạn + gửi ủy nhiệm chi, không bị khóa app */
function renderGh(){const b=$('ghBox');if(!b||!payLic)return;const l=payLic;b.innerHTML=`<h2>Gia hạn Shop Gọn</h2>${l.han?`<p style="margin:0 0 6px">Hạn hiện tại: <b>${dmy(l.han)}</b>. Gia hạn xong, hạn mới cộng nối tiếp.</p>`:''}`+(payBlock(l)||'<div class="empty">Chưa có thông tin gói, liên hệ Shop Gọn.</div>');drawPay(l)}

  loadQr().then(()=>{const q=$('qr');if(!q)return;q.innerHTML='';new QRCode(q,{text:url,width:220,height:220,correctLevel:QRCode.CorrectLevel.M})}).catch(()=>{const q=$('qr');if(q)q.textContent='Không tải được mã QR, kiểm tra mạng.'})});
/* 23/10: shop gửi ảnh ủy nhiệm chi ngay ở màn chờ duyệt — Shop Gọn thấy tiền về là duyệt */
const uncBox=lic=>`<label class="ghost" style="display:block;text-align:center;cursor:pointer;padding:12px;font-size:15px;white-space:normal;width:100%">📎 ${lic.unc?'Đã gửi ủy nhiệm chi ('+esc(String(lic.unc).split('-').reverse().join('/'))+') · Gửi lại':'Gửi ảnh ủy nhiệm chi (ảnh chuyển khoản)'}<input type="file" accept="image/*" id="uncIn" hidden></label><small id="uncMsg" style="text-align:center"></small>`;
function shrink(file){return new Promise((ok,bad)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const k=Math.min(1,1100/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);let q=.75,d=c.toDataURL('image/jpeg',q);while(d.length>550000&&q>.3){q-=.15;d=c.toDataURL('image/jpeg',q)}ok(d)};im.onerror=bad;im.src=u})}
document.addEventListener('change',async e=>{if(e.target.id!=='uncIn'||!e.target.files[0])return;const msg=$('uncMsg');msg.textContent='Đang gửi ảnh…';
  try{const img=await shrink(e.target.files[0]);const r=await fetch(GG.LICENSE_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({act:'unc',email:GG.email,img})}).then(x=>x.json());
    if(!r.ok){msg.textContent=r.msg||'Chưa gửi được.';return}if(payLic)payLic.unc=todayIso();
    if(r.tam){msg.textContent='✅ Đã kiểm ủy nhiệm chi: đúng tiền gói '+(r.goi||'')+'. Đang mở app…';afterLogin().catch(er=>welcomeMsg(ggErr(er)));return}
    msg.textContent=XEM?'Đã gửi.'+(r.ly?' Ảnh chưa tự khớp ('+r.ly+') — ':' ')+'Shop Gọn kiểm và kích hoạt sớm, app tự mở khóa.':'Đã gửi. Shop Gọn thấy tiền về sẽ gia hạn — vài phút sau bấm "Kiểm tra lại".'}
  catch(_){msg.textContent='Chưa gửi được, kiểm tra mạng rồi thử lại.'}});
/* 23/10: Đơn đã bán — xem theo hóa đơn, ghi chú, sổ khách nợ */
let histQ='', histOpen=null;
document.addEventListener('input',e=>{const t=e.target;if(t.id==='hQ2'){histQ=t.value;renderMore();const i=$('hQ2');i.focus();i.setSelectionRange(i.value.length,i.value.length)}});
document.addEventListener('focusout',e=>{const t=e.target;if((t.id==='hNo'||t.id==='rcTra')&&t.value){const n=parseMoney(t.value);t.value=n?n.toLocaleString('vi-VN'):''}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.hdebt){histDays=-1;histOpen=null;renderMore();return}

  if(d.hsave){const L=bill(d.hsave);if(!L.length)return;L[0].note=$('hNote').value.trim();L[0].no=parseMoney($('hNo').value);save();renderMore();toast(L[0].no?'Đã lưu · khách còn nợ '+money(L[0].no):'Đã lưu ghi chú');return}
  if(d.hpaid){const L=bill(d.hpaid);if(!L.length)return;L[0].no=0;L[0].note=((L[0].note?L[0].note+' · ':'')+'Đã trả đủ '+dmy(todayIso()));save();renderMore();toast('Đã ghi: khách trả đủ');return}
  if(d.hrc){openReceipt(d.hrc);return}});
/* 23/10: in hóa đơn khổ 58/80mm (lệnh in của máy) + in thẳng máy in nhiệt Bluetooth qua app RawBT (Android) */
function rcData(){const lines=db.don.filter(x=>x.bill===rcId||x.id===rcId);if(!lines.length)return null;const d=lines[0];const tot=lines.reduce((a,x)=>a+x.giaBan,0);const bank=db.shop.bank;return{lines,d,tot,bank,code:'SG'+rcId.slice(-6).toUpperCase(),bn:bank&&(BANKS.find(b=>b[0]===bank.bin)||[])[1]}}
function printThuong(){const R=rcData();if(!R)return;const w=+(db.shop.kho||80),sm=w<70;const qr=document.querySelector('#qr canvas,#qr img');const qs=qr?(qr.tagName==='CANVAS'?qr.toDataURL():qr.src):'';
  const html=`<!doctype html><html><head><meta charset="utf-8"><style>@page{size:${w}mm auto;margin:0}*{box-sizing:border-box}body{margin:0;padding:3mm;width:${w}mm;font:${sm?11:13}px/1.35 Arial,sans-serif;color:#000}h1{font-size:${sm?15:18}px;text-align:center;margin:0 0 2px}.c{text-align:center}.r{display:flex;justify-content:space-between;gap:6px}.l{border-top:1px dashed #000;margin:5px 0}.b{font-weight:700}img{display:block;margin:4px auto;width:${sm?34:44}mm}small{font-size:.85em}</style></head><body>
  <h1>${esc(db.shop.ten||'HÓA ĐƠN BÁN HÀNG')}</h1><div class="c"><small>Hóa đơn ${R.code} · ${dmy(R.d.ngay)} ${R.d.gio}</small></div>${R.d.khach||R.d.sdt?`<div class="c"><small>Khách: ${esc(R.d.khach||'')}${R.d.sdt?' · '+esc(R.d.sdt):''}</small></div>`:''}<div class="l"></div>
  ${R.lines.map(x=>`<div class="r"><span class="b">${esc(x.ten)}</span><span>${money(x.giaBan)}</span></div>${x.imei?`<small>IMEI ${x.imei}</small><br>`:''}${x.bh?`<small>Bảo hành ${x.bh} tháng</small>`:''}`).join('<div style="height:4px"></div>')}
  <div class="l"></div><div class="r b" style="font-size:1.2em"><span>TỔNG</span><span>${money(R.tot)}</span></div>
  ${rcPay==='ck'&&R.bank&&qs?`<div class="l"></div><div class="c"><small>Quét mã để chuyển khoản</small></div><img src="${qs}"><div class="c"><small>${esc(R.bn||'')} · ${esc(R.bank.acc)}<br>${esc(R.bank.name)}<br>Nội dung: ${R.code}</small></div>`:''}
  <div class="l"></div><div class="c">Cảm ơn quý khách!</div></body></html>`;
  const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);const dd=f.contentDocument;dd.open();dd.write(html);dd.close();
  setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(_){toast('Máy này chưa in được, thử In RawBT')}setTimeout(()=>f.remove(),60000)},500)}
function printRawbt(){const R=rcData();if(!R)return;const W=(+(db.shop.kho||80))<70?32:48;const N=s=>noMark(String(s??''));const mo=n=>money(n).replace('đ','d');
  const pad=(a,b)=>{a=N(a);b=N(b);const s=W-b.length-1;a=a.length>s?a.slice(0,s):a;return a+' '.repeat(Math.max(1,W-a.length-b.length))+b};
  const B=[];const t=s=>{for(const ch of N(s))B.push(ch.charCodeAt(0)&255)};const nl=()=>B.push(10);const cmd=(...a)=>B.push(...a);
  cmd(27,64);cmd(27,97,1);cmd(27,69,1);cmd(29,33,17);t(db.shop.ten||'HOA DON');nl();cmd(29,33,0);cmd(27,69,0);t('Hoa don '+R.code+' '+dmy(R.d.ngay)+' '+R.d.gio);nl();
  if(R.d.khach||R.d.sdt){t('Khach: '+(R.d.khach||'')+(R.d.sdt?' '+R.d.sdt:''));nl()}
  cmd(27,97,0);t('-'.repeat(W));nl();
  R.lines.forEach(x=>{t(pad(x.ten,mo(x.giaBan)));nl();if(x.imei){t(' IMEI '+x.imei);nl()}if(x.bh){t(' Bao hanh '+x.bh+' thang');nl()}});
  t('-'.repeat(W));nl();cmd(27,69,1);t(pad('TONG',mo(R.tot)));nl();cmd(27,69,0);
  if(rcPay==='ck'&&R.bank){const q=vietqr(R.bank.bin,R.bank.acc,R.tot,R.code);const L=q.length+3;cmd(27,97,1);t('Quet ma de chuyen khoan');nl();
    cmd(29,40,107,4,0,49,65,50,0);cmd(29,40,107,3,0,49,67,W<40?5:6);cmd(29,40,107,3,0,49,69,49);cmd(29,40,107,L&255,L>>8,49,80,48);t(q);cmd(29,40,107,3,0,49,81,48);nl();
    t((R.bn||'')+' '+R.bank.acc);nl();t(R.bank.name);nl();t('ND: '+R.code);nl()}

/* 23/10: Nhập từ ảnh hóa đơn — AI đọc ảnh → shop xem lại → món trùng tên cộng dồn, món mới tạo mới; điện thoại chuyển sang quét IMEI */
let ocrItems=null, ocrBusy=false;
const norm=s=>noMark(String(s||'')).toLowerCase().replace(/\s+/g,' ').trim();
function ocrBtn(){return `<label class="btn" style="display:flex;flex-direction:row;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-size:17px">${ocrBusy?'⏳ Đang đọc hóa đơn…':'📷 Nhập từ ảnh hóa đơn'}<input type="file" accept="image/*" id="ocrIn" hidden ${ocrBusy?'disabled':''}></label><small style="color:var(--muted);text-align:center;margin-top:-6px">Chụp phiếu nhập: món trùng tên tự cộng dồn, món mới tự tạo — xem lại trước khi lưu</small>`}
function renderAdd(){if(ocrItems){renderOcr();return}renderAdd0();$('v-add').insertAdjacentHTML('afterbegin',ocrBtn())}
function prepOcr(x){const k=norm(x.khop),k2=norm(x.ten);
  if(x.loai==='may'){const t=[...new Set(db.may.map(m=>m.ten))].find(t=>norm(t)===k||norm(t)===k2);return Object.assign({},x,{ok:true,match:t||'',ten:t||x.ten})}
  const h=(k&&db.hang.find(h=>norm(h.ten)===k))||db.hang.find(h=>norm(h.ten)===k2);return Object.assign({},x,{ok:true,match:h?h.id:'',ten:h?h.ten:x.ten,nhom:h?h.nhom:x.nhom})}
function renderOcr(){const L=ocrItems;const nM=L.filter(x=>x.ok&&x.loai!=='may'&&x.match).length,nN=L.filter(x=>x.ok&&x.loai!=='may'&&!x.match).length,nP=L.filter(x=>x.ok&&x.loai==='may').length;
  $('v-add').innerHTML=`<div class="panel"><h2>Hóa đơn: ${L.length} dòng</h2><p style="margin:0 0 8px;color:var(--muted);font-size:14px">Kiểm tra tên, số lượng, giá nhập. Bỏ chọn dòng không muốn nhập.</p>
  <div class="list">${L.map((x,i)=>`<div class="row" style="flex-wrap:wrap;gap:6px;${x.ok?'':'opacity:.45'}"><div style="display:flex;align-items:center;gap:8px;flex:1;min-width:200px"><input type="checkbox" data-oi="${i}" data-of="ok" ${x.ok?'checked':''} style="width:22px;height:22px;flex:none" aria-label="Nhập dòng này"><input data-oi="${i}" data-of="ten" value="${esc(x.ten)}" style="padding:8px 10px"></div>
    <span class="pill ${x.loai==='may'?'b':x.match?'g':'a'}">${x.loai==='may'?'Điện thoại · quét IMEI':x.match?'Cộng dồn':'Món mới'}</span>
    <div class="two" style="flex-basis:100%"><label>Số lượng<input data-oi="${i}" data-of="sl" inputmode="numeric" value="${x.sl}"></label><label>Giá nhập / cái<input data-oi="${i}" data-of="giaNhap" inputmode="numeric" class="num" value="${x.giaNhap?x.giaNhap.toLocaleString('vi-VN'):''}"></label></div></div>`).join('')}</div>
  <p style="margin:10px 0 0;font-size:14px">${nM} món cộng dồn · ${nN} món mới${nP?' · '+nP+' mẫu điện thoại (quét IMEI sau)':''}</p>
  <div class="inrow" style="margin-top:12px"><button class="btn" style="flex:1" data-ocrok="1">Nhập vào kho</button><button class="ghost" data-ocrno="1">Hủy</button></div></div>`}
function shrink2(file){return new Promise((ok,bad)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);let q=.82,d=c.toDataURL('image/jpeg',q);while(d.length>1400000&&q>.35){q-=.12;d=c.toDataURL('image/jpeg',q)}ok(d)};im.onerror=bad;im.src=u})}
document.addEventListener('change',async e=>{const t=e.target;
  if(t.dataset&&t.dataset.oi!==undefined&&ocrItems){const x=ocrItems[+t.dataset.oi];if(t.dataset.of==='ok'){x.ok=t.checked;renderOcr()}else if(t.dataset.of==='ten'){x.ten=t.value.trim();const y=prepOcr(Object.assign({},x,{khop:''}));x.match=y.match;x.ten=y.ten;if(x.loai!=='may')x.nhom=y.nhom;renderOcr()}return}
  if(t.id!=='ocrIn'||!t.files||!t.files[0])return;ocrBusy=true;renderAdd();
  try{const img=await shrink2(t.files[0]);const names=[...new Set([...db.hang.map(h=>h.ten),...db.may.map(m=>m.ten)])];
    const r=await fetch(GG.LICENSE_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({act:'ocr',email:DEMO?'':GG.email,ctv:DEMO?refSale():'',img,ten:names})}).then(x=>x.json());
    if(!r.ok)toast(r.msg||'Chưa đọc được hóa đơn');else if(!r.items||!r.items.length)toast('Không thấy món hàng nào trong ảnh');else ocrItems=r.items.map(prepOcr)}
  catch(_){toast('Chưa đọc được, kiểm tra mạng rồi thử lại')}
  ocrBusy=false;renderAdd()});
document.addEventListener('input',e=>{const t=e.target;if(!(t.dataset&&t.dataset.oi!==undefined&&ocrItems))return;const x=ocrItems[+t.dataset.oi];if(t.dataset.of==='sl')x.sl=parseMoney(t.value);else if(t.dataset.of==='giaNhap')x.giaNhap=parseMoney(t.value)});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!ocrItems)return;
  if(b.dataset.ocrno){ocrItems=null;renderAdd();return}
  if(!b.dataset.ocrok)return;const L=ocrItems.filter(x=>x.ok&&x.ten.trim()&&x.sl>0);let nH=0,nNew=0;const may=[];
  L.forEach(x=>{if(x.loai==='may'){may.push(x);return}const h=db.hang.find(h=>h.id===x.match)||db.hang.find(h=>norm(h.ten)===norm(x.ten));
    if(h){const gn=x.giaNhap||h.giaNhap;h.giaNhap=Math.round((h.giaNhap*Math.max(0,h.sl)+gn*x.sl)/(Math.max(0,h.sl)+x.sl));h.sl+=x.sl;h.ngayNhap=todayIso();nH++}
    else{db.hang.push({id:uid(),ten:x.ten.trim(),nhom:x.nhom||'pk',loai:'',giaNhap:x.giaNhap,giaBan:0,sl:x.sl,min:5,ngayNhap:todayIso()});nNew++}});
  save();ocrItems=null;
  if(may.length){const x=may[0];addMode='may';renderAdd();setTimeout(()=>{const a=$('aTen');if(!a)return;a.value=x.ten;a.dispatchEvent(new Event('input',{bubbles:true}));if(x.giaNhap)$('aGN').value=x.giaNhap.toLocaleString('vi-VN');$('aImei').focus()},0);
    toast(`Đã nhập ${nH+nNew} món hàng. Quét IMEI cho ${x.sl} máy ${x.ten}`+(may.length>1?` · còn ${may.length-1} mẫu máy khác`:''))}
  else{renderAdd();toast(`Đã nhập: ${nH} món cộng dồn, ${nNew} món mới`)}});
/* 23/10: bản demo — nút QR đăng ký nằm trên thanh tên shop, bấm là hiện QR */
function demoBar(){const m=$('mode');if(!m)return;m.hidden=true;const b=document.createElement('button');b.id='demoQr';b.textContent='📱 QR đăng ký';b.style.cssText='background:#fff;color:#0b5e57;border:0;border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;white-space:nowrap;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.18)';m.after(b)}
const GLOGO=`<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>`;
function xemMode(){XEM=true;db=sampleDb();unlockApp();render()}
function xemBar(msg){const b=$('xbar');if(!b)return;if(!XEM){b.hidden=true;return}b.hidden=false;b.className='';const st=XLIC&&XLIC.status;
  b.innerHTML=msg?`<span class="t">${esc(msg)}</span>`:!GG.email?`<span class="t">👀 <b>Đang xem thử</b> với dữ liệu mẫu. Đăng nhập Gmail của shop để kích hoạt.</span><button data-gg="login">Đăng nhập</button>`
  :st==='expired'?`<span class="t">⌛ Gói của <b>${esc(GG.email)}</b> đã hết hạn. Gia hạn để mở lại sổ của shop.</span><button data-gg="kh">Gia hạn</button>`
  :st&&st!=='none'&&st!=='pending'?`<span class="t">🔒 Tài khoản <b>${esc(GG.email)}</b> đang tạm khóa. Liên hệ Shop Gọn.</span>`
  :st==='pending'?`<span class="t">⏳ <b>${esc(GG.email)}</b> đã gửi đề nghị. Shop Gọn bật tính năng xong, app tự mở khóa.</span><button data-gg="kh">Xem</button>`
  :`<span class="t">🔒 <b>${esc(GG.email)}</b> chưa kích hoạt. Vẫn xem thử được.</span><button data-gg="kh">Kích hoạt</button>`}
function xemPoll(){clearInterval(xTimer);if(!XLIC||XLIC.status!=='pending')return;xTimer=setInterval(()=>{if(!XEM||!GG.email){clearInterval(xTimer);return}
  license(GG.email).then(l=>{XLIC=l;if(l.status==='active'){clearInterval(xTimer);afterLogin().catch(e=>{xemBar(ggErr(e))})}}).catch(()=>{})},45000)}
/* Bảng kích hoạt: bấm tính năng bị khóa hoặc nút Kích hoạt */
function showKh(){const w=$('welcome');w.hidden=false;const st=XLIC&&XLIC.status;
  if(!GG.email){w.innerHTML=`<div class="wc"><div class="wlogo"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
    <h1>Kích hoạt để dùng thật</h1><p>Bạn đang xem thử với dữ liệu mẫu. Đăng nhập Gmail của shop, gửi đề nghị kích hoạt — Shop Gọn bật xong là nhập tồn, bán hàng được ngay.</p>
    ${INAPP?`<button class="gbtn" data-gg="out">${IOS?'Chép link để mở bằng Safari':'Mở bằng Chrome để đăng nhập'}</button>`:`<button class="gbtn" data-gg="login">${GLOGO}Đăng nhập bằng Google</button>`}
    <small id="wMsg">${INAPP?'Đang mở trong Zalo/Facebook: Google không cho đăng nhập ở đây, cần mở bằng '+(IOS?'Safari':'Chrome')+'.':''}</small><button class="wlink" data-gg="xem">Xem thử tiếp</button></div>`;return}
  if(st&&st!=='none'){showPending(XLIC);return}
  showPending({status:'none'})}
document.addEventListener('click',e=>{if(e.target.closest('[data-more="kichhoat"]')){e.preventDefault();e.stopImmediatePropagation();showKh()}},true);
document.addEventListener('submit',e=>{if(!XEM)return;e.preventDefault();e.stopImmediatePropagation();showKh()},true);
document.addEventListener('click',e=>{if(!XEM)return;const b=e.target.closest('form button[type=submit],form button:not([type]),[data-rcpay],[data-rcdone],[data-rcprint],[data-cancelok],[data-reset],[data-more="bg"],[data-more="tt"],[data-more="giahan"],[data-more="ctv"]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();showKh()},true);
render();
(function boot(){let gs=null,seen=null;try{gs=JSON.parse(localStorage.getItem('shopgon_gg')||'null');seen=localStorage.getItem('shopgon_seen')}catch(e){}
  if(DEMO){demoBar();return}
  if(GG.ready()){ /* bản chính thức: chưa đăng nhập + chưa kích hoạt thì không vào được app */
    xemMode();
    if(!INAPP)GG.load().catch(()=>{});
    let tk=null;try{tk=JSON.parse(localStorage.getItem('shopgon_tk')||'null')}catch(e){}
    if(gs&&tk&&tk.x>Date.now()&&tk.e===gs.email){GG.email=gs.email;GG.sheetId=gs.sheetId||'';GG.token=tk.t;xemBar('Đang mở sổ dữ liệu…');
      afterLogin().catch(()=>{GG.token=null;xemBar()})}
    else if(gs&&gs.email&&!INAPP&&!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){GG.email=gs.email;GG.sheetId=gs.sheetId||'';xemBar('Đang đăng nhập lại…');
      GG.login(true).then(()=>afterLogin()).catch(()=>{GG.email='';xemBar()})}
    else xemBar();
    setInterval(()=>{if(GG.email&&!XEM)license(GG.email).then(l=>{if(l.status!=='active'){Store.save(db);showPending(l)}}).catch(()=>{})},6*3600*1000);
  } else if(firstOpen&&!seen)showWelcome();})();
