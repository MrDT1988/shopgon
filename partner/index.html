<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="SG Partner">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Partner Shop Gọn</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* App Partner khu vực — cùng bộ giao diện với trang quản trị (3 tab: Doanh thu · Đội của tôi · Cửa hàng) */
:root{color-scheme:light;--bg:#eef3f4;--card:#fff;--ink:#17203d;--muted:#5d6785;--line:#e3e8ef;--pen:#0f766e;--pen2:#14a293;--pen-soft:#d5f3ec;
  --red:#c32f39;--red-soft:#fde8ea;--amber:#9a5c00;--amber-soft:#fff0d6;--green:#16794a;--green-soft:#dff3e8;--blue:#1d4f8a;--blue-soft:#e3eefb;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
header{flex:none;background:linear-gradient(135deg,#13998b,#0b5e57);color:#fff;padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left));box-shadow:0 4px 14px rgba(11,94,87,.25);z-index:2}
header .w{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header h1{margin:0;font-size:19px;font-weight:800;line-height:1.2}
header small{opacity:.85;font-size:12.5px}
.hbtn{margin-left:auto;font-size:18px!important;width:40px;height:40px;padding:0!important;flex:none;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:760px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
nav{flex:none;background:#fff;box-shadow:0 -6px 20px rgba(16,42,52,.10);padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));z-index:2}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
nav button{border:0;background:none;border-radius:14px;padding:7px 4px;font-size:12.5px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--pen);background:linear-gradient(180deg,#e2f6f1,#cdefe7)}
.dot[hidden]{display:none!important}
.dot{position:absolute;top:3px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 2px rgba(16,42,52,.06),0 8px 20px rgba(16,42,52,.07)}
h2{font-size:16px;margin:0 0 10px;font-weight:800}
.eb{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border-radius:18px;padding:13px 14px;box-shadow:0 1px 2px rgba(16,42,52,.06),0 8px 20px rgba(16,42,52,.07);min-width:0}
.kpi .v{font-size:22px;font-weight:800;margin-top:2px;overflow-wrap:anywhere}
.kpi .d{font-size:12.5px;color:var(--muted)}
.kpi.hero{grid-column:1/-1;background:linear-gradient(135deg,#14a293,#0b5e57);color:#fff;box-shadow:0 10px 24px rgba(11,94,87,.3)}
.kpi.hero .eb,.kpi.hero .d{color:#d8f5ef}.kpi.hero .v{font-size:30px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:#e2eaec;border-radius:14px;padding:4px}
.seg button{border:0;background:none;border-radius:10px;padding:9px 4px;font-weight:700;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--pen);box-shadow:0 2px 6px rgba(16,42,52,.12)}
.bars{display:flex;align-items:flex-end;gap:5px;height:150px;margin-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;min-width:0}
.bar i{display:block;width:100%;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#bfe9df,#9fd9cc);min-height:2px}
.bar.now i{background:linear-gradient(180deg,#14a293,#0b5e57)}
.bar span{font-size:10.5px;color:var(--muted);white-space:nowrap}.bar em{font-style:normal;font-size:10px;font-weight:700;white-space:nowrap}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .n{min-width:0;flex:1}.row .n b{display:block;overflow-wrap:anywhere}.row .n small{display:block;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.r{text-align:right;flex:none}.r small{display:block;font-size:12.5px;color:var(--muted)}
.pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;display:inline-block}
.p-g{background:var(--green-soft);color:var(--green)}.p-a{background:var(--amber-soft);color:var(--amber)}.p-r{background:var(--red-soft);color:var(--red)}.p-b{background:var(--pen-soft);color:var(--pen)}.p-n{background:var(--blue-soft);color:var(--blue)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:700;white-space:nowrap;box-shadow:0 1px 2px rgba(16,42,52,.06)}
.chip[aria-pressed="true"]{background:var(--pen);border-color:var(--pen);color:#fff}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;background:linear-gradient(180deg,#14a293,#0f766e);color:#fff;box-shadow:0 3px 0 #0a4f49}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0a4f49}
.btn[disabled]{opacity:.5}
.ghost{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13.5px}
.ghost.red{color:var(--red)}
input.f{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px}
.shop{border-top:1px solid var(--line);padding:13px 0;display:flex;flex-direction:column;gap:9px}
.shop:first-child{border-top:0;padding-top:2px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.top .n{min-width:0}.top b{display:block;overflow-wrap:anywhere;font-size:15.5px}.top small{display:block;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.act input{width:120px;padding:9px 10px;border:1px solid var(--line);border-radius:10px}
.ctvtag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:var(--blue-soft);color:var(--blue);border-radius:8px;padding:3px 8px;border:0;font-weight:600}
.empty{color:var(--muted);padding:6px 0}
.ex{background:var(--bg);border-radius:12px;padding:4px 12px;margin-top:4px}
.note{font-size:12.5px;color:var(--muted);text-align:center;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;z-index:9;max-width:calc(100% - 32px);text-align:center}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.mini{background:var(--bg);border-radius:12px;padding:10px 12px}.mini b{display:block;font-size:17px}.mini small{color:var(--muted);font-size:12px}
.side{display:none}
/* Màn hình PIN */
.gate[hidden]{display:none}
.gate{position:fixed;inset:0;z-index:20;background:linear-gradient(160deg,#14a293,#0b5e57);display:flex;align-items:center;justify-content:center;padding:24px}
.gate .box{background:#fff;border-radius:24px;padding:28px 22px;width:100%;max-width:360px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.gate .logo{margin:0 auto 12px;width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#14a293,#0b5e57)}
.gate .logo svg{width:28px;height:28px}
.gate h1{margin:0 0 4px;font-size:21px}.gate p{margin:0 0 18px;color:var(--muted);font-size:14px}
.pin{width:100%;text-align:center;font-size:28px;letter-spacing:.5em;padding:12px 0 12px .5em;border:2px solid var(--line);border-radius:14px;font-weight:800}
.pin:focus{border-color:var(--pen);outline:0}
.gate .btn{width:100%;margin-top:12px;padding:14px;font-size:16px}
.gate .err{color:var(--red);font-weight:700;min-height:22px;margin-top:10px;font-size:14px}
/* Máy tính / máy tính bảng ngang: thanh điều hướng thành cột bên trái như app */
@media (min-width:900px){
  .app{display:grid;grid-template-columns:248px 1fr;grid-template-rows:auto 1fr}
  header{grid-column:2;grid-row:1;background:#fff;color:var(--ink);box-shadow:0 1px 0 var(--line)}
  header .w{max-width:1040px}header .logo{display:none}header small{color:var(--muted);opacity:1}
  .hbtn{border-color:var(--line);background:#fff;color:var(--pen)}
  main{grid-column:2;grid-row:2}
  .wrap{max-width:1040px;padding:22px 28px 32px}
  nav{grid-column:1;grid-row:1/3;background:linear-gradient(180deg,#0f8478,#0b5e57);box-shadow:none;padding:18px 14px}
  nav .in{grid-template-columns:1fr;gap:6px;max-width:none}
  .side{display:flex;align-items:center;gap:10px;color:#fff;padding:4px 8px 22px}
  .side .logo{display:grid}.side b{font-size:17px;line-height:1.2}.side small{display:block;opacity:.8;font-size:12px}
  nav button{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;font-size:15px;color:#cdeee8}
  nav button[aria-selected="true"]{background:rgba(255,255,255,.16);color:#fff}
  .dot{position:static;margin-left:auto}
  .kpis{grid-template-columns:repeat(4,1fr)}.kpi.hero{grid-column:span 2}
  .bars{height:200px}
  .toast{bottom:28px}
}
.gate .f{text-align:left}
select.f{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:15px}
.lo{display:block;margin:6px auto 0;border:0;background:none;color:var(--muted);font-weight:700;font-size:13px;text-decoration:underline}
/* 06/11: thẻ chương trình mở bán + đếm ngược suất ưu đãi */
.prog{background:linear-gradient(135deg,#fff7e8,#ffe9c7);border:1px solid #f6d49a;border-radius:18px;padding:14px 16px;box-shadow:0 8px 20px rgba(154,92,0,.12)}
.prog h2{color:#7a4700;margin:0 0 8px}
.prog .cd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.prog .cd b{font-size:34px;font-weight:800;color:#b45309;line-height:1}.prog .cd span{font-weight:700;color:#7a4700}
.prog .bar2{height:10px;border-radius:6px;background:#fff;margin:8px 0 10px;overflow:hidden;border:1px solid #f6d49a}.prog .bar2 i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#c2410c)}
.prog .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.prog .g3 div{background:#fff;border-radius:12px;padding:8px 10px;min-width:0}.prog .g3 small{display:block;color:var(--muted);font-size:11.5px}.prog .g3 b{display:block;font-size:clamp(12.5px,3.4vw,17px);white-space:nowrap}.prog .g3 em{font-style:normal;font-size:11px;color:var(--green);font-weight:700}
.prog .g3 .hot{background:#b45309;color:#fff}.prog .g3 .hot small,.prog .g3 .hot em{color:#ffe9c7}
/* 06/11 anh Thái: tab Tiện ích ở quản trị + Partner để demo cho anh em */
.tih{margin:0;font-size:18px}.tis{margin:4px 0 12px;color:var(--muted);font-size:14px}
.tig{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:900px){.tig{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ti{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;font:inherit;color:inherit;text-decoration:none;background:#f4f8f7;border:1px solid #dbe8e5;border-radius:16px;padding:14px;min-height:118px;cursor:pointer}
.ti.hot{background:#fff6e6;border-color:#f5d9a8}
.ti .tic{width:40px;height:40px;border-radius:12px;background:#0f8478;display:grid;place-items:center;margin-bottom:6px}
.ti.hot .tic{background:#e8930c}
.ti .tic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ti b{font-size:15px;line-height:1.3}.ti small{font-size:12.5px;color:var(--muted);line-height:1.4}
.ti:focus-visible{outline:3px solid #0b5e57;outline-offset:2px}
/* 06/11 21h50 anh Thái: hiệu ứng công nghệ tab Tiện ích — viền neon xoay + sáng nhịp ở 2 thẻ test, thẻ hiện dần, nền lưới chấm */
@property --sgA{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes sgSpin{to{--sgA:360deg}}
@keyframes sgGlow{0%,100%{box-shadow:0 6px 18px -10px rgba(14,165,233,.35)}50%{box-shadow:0 10px 26px -8px rgba(20,184,166,.55)}}
.tig .ti.hot{position:relative;isolation:isolate;border-color:transparent}
.tig .ti.hot::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.6px;pointer-events:none;background:conic-gradient(from var(--sgA),#14b8a6,#38bdf8,#a78bfa,#f59e0b,#14b8a6);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:sgSpin 4s linear infinite}
@keyframes sgIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.tig .ti{animation:sgIn .5s cubic-bezier(.2,.75,.25,1) both}
.tig .ti:nth-child(2){animation-delay:.06s}.tig .ti:nth-child(3){animation-delay:.12s}.tig .ti:nth-child(4){animation-delay:.18s}.tig .ti:nth-child(5){animation-delay:.24s}.tig .ti:nth-child(6){animation-delay:.3s}.tig .ti:nth-child(7){animation-delay:.36s}
.tig .ti.hot{animation:sgIn .5s cubic-bezier(.2,.75,.25,1) both,sgGlow 3.6s ease-in-out .6s infinite}
.tig .ti.hot:nth-child(2){animation-delay:.06s,.66s}
.ti{transition:transform .18s,box-shadow .18s}.ti:active{transform:scale(.98)}
@media (hover:hover){.ti:hover{transform:translateY(-2px)}}
@media (max-width:899px){.tig>.ti:last-child:nth-child(odd){grid-column:1/-1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;align-items:center}.tig>.ti:last-child:nth-child(odd) .tic{grid-row:span 2;margin:0}}
@media (min-width:900px){.tig>.ti:last-child:nth-child(3n+1){grid-column:1/-1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;align-items:center}.tig>.ti:last-child:nth-child(3n+1) .tic{grid-row:span 2;margin:0}}
.card:has(.tig){background-image:radial-gradient(rgba(15,132,120,.10) 1px,transparent 1.2px);background-size:14px 14px;background-position:-7px -7px}
@media (prefers-reduced-motion:reduce){.tig .ti.hot,.tig .ti.hot::before,.tig .ti{animation:none!important}}
/* 06/11 22h anh Thái: hiệu ứng mạnh hơn — viền neon dày + nhanh, tia sáng quét ngang thẻ test, icon loé sáng lần lượt */
@keyframes sgSweep{0%,55%{transform:translateX(-130%) skewX(-18deg)}85%,100%{transform:translateX(330%) skewX(-18deg)}}
@keyframes sgIco{0%,70%{transform:translateX(-140%)}100%{transform:translateX(140%)}}
.tig .ti.hot::before{padding:2.2px!important;animation-duration:2.6s!important;filter:saturate(1.3)}
.tig .ti.hot{overflow:hidden}
.tig .ti.hot::after{content:"";position:absolute;top:0;bottom:0;left:0;width:38%;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:sgSweep 3.2s ease-in-out infinite;z-index:1}
.tig .ti.hot .tic{box-shadow:0 0 0 3px rgba(245,158,11,.18),0 6px 16px -4px rgba(245,158,11,.7)}
.tig .tic{position:relative;overflow:hidden}
.tig .tic::after{content:"";position:absolute;inset:-2px;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.65) 50%,transparent 70%);transform:translateX(-140%);animation:sgIco 4s ease-in-out infinite}
.tig>:nth-child(2) .tic::after{animation-delay:.35s}.tig>:nth-child(3) .tic::after{animation-delay:.7s}.tig>:nth-child(4) .tic::after{animation-delay:1.05s}.tig>:nth-child(5) .tic::after{animation-delay:1.4s}.tig>:nth-child(6) .tic::after{animation-delay:1.75s}.tig>:nth-child(7) .tic::after{animation-delay:2.1s}
@media (prefers-reduced-motion:reduce){.tig .ti.hot::after,.tig .tic::after{animation:none!important;display:none}}
</style></head>
<body>
<div class="app">
  <header><div class="w">
    <div class="logo"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3"/><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/></svg></div>
    <div><h1 id="ttl">Partner Shop Gọn</h1><small id="sub">Đang tải…</small></div>
    <button class="hbtn" id="reload" aria-label="Tải lại">↻</button>
  </div></header>
  <main id="main"><div class="wrap" id="v"><div class="card empty">Đang tải…</div></div></main>
  <nav><div class="in" role="tablist">
    <div class="side"><div class="logo"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3"/><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/></svg></div><div><b>Shop Gọn</b><small>Partner khu vực</small></div></div>
    <button role="tab" data-tab="dt" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Doanh thu</button>
    <button role="tab" data-tab="doi" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14c2.6 0 4.2 1.6 4.8 4.5"/></svg>Đội của tôi</button>
    <button role="tab" data-tab="ch" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9M3 9h18M3 9v11h18V9M9 20v-6h6v6"/></svg>Cửa hàng</button>
    <button role="tab" data-tab="ti" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>Tiện ích</button>
  </div></nav>
</div>
<div class="toast" id="toast" hidden></div>
<div class="gate" id="gate" hidden><form class="box" id="gateF">
  <div class="logo"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3"/><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/></svg></div>
  <h1>Partner Shop Gọn</h1><p>Đăng nhập bằng số điện thoại và mật khẩu Shop Gọn cấp cho bạn.</p>
  <input class="f" id="gSdt" inputmode="tel" autocomplete="username" placeholder="Số điện thoại" style="margin-bottom:10px">
  <input class="f" id="gMk" type="password" autocomplete="current-password" placeholder="Mật khẩu">
  <button class="btn" type="submit">Đăng nhập</button><div class="err" id="gErr"></div></form></div>
<script>
/* Partner khu vực (06/11/2026 anh Thái): Partner nhận 70% tiền gói của khu vực mình, tự quản Leader/CTV,
   tự chi cho đội. Giá cố định, tiền shop chuyển về tài khoản Shop Gọn, Shop Gọn duyệt và đối soát cuối tháng.
   Máy chủ: POST {act:'partner', fn:'partnerLogin', args:[sdt,mk]} → {tok}; sau đó {act:'partner', tok, fn, args}.
   fn: partnerData() · partnerSaveCtv(sdt, ten, vai 'Leader'|'Sale', leaderSdt). Không trả Gmail, không trả dữ liệu bán hàng của shop. */
const API='https://script.google.com/macros/s/AKfycbyyqlK8nFmTxO_6ZNDee0FdTZeynwzHWsgRvQKxfKI0qZKtPEve_rrP4kL9O1PWj25bJg/exec';
const LIVE=/^https?:$/.test(location.protocol)&&!/[?&]demo/.test(location.search);
const KTOK='sg_partner_tok';let TOK='';try{TOK=localStorage.getItem(KTOK)||''}catch(e){}
const $=id=>document.getElementById(id);
const money=n=>Math.round(n||0).toLocaleString('vi-VN')+'đ';
const short=n=>{n=n||0;return n>=1e9?(n/1e9).toLocaleString('vi-VN',{maximumFractionDigits:2})+' tỷ':n>=1e6?(n/1e6).toLocaleString('vi-VN',{maximumFractionDigits:1})+'tr':n>=1e3?Math.round(n/1000)+'k':String(n)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dmy=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';
const dm=s=>s?s.slice(8,10)+'/'+s.slice(5,7):'';
const pD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const fD=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
const addD=(s,n)=>{const x=pD(s);x.setDate(x.getDate()+n);return fD(x)};
const days=(a,b)=>Math.round((pD(a)-pD(b))/864e5);
const goiTen=m=>m%12===0?(m/12)+' năm':m+' tháng';
const fmtSdt=s=>s?s.replace(/^(\d{4})(\d{3})(\d+)$/,'$1 $2 $3'):'';
const sdtOk=s=>{let d=String(s||'').replace(/\D/g,'');if(d.startsWith('84'))d='0'+d.slice(2);if(d.length===9)d='0'+d;return /^0\d{9}$/.test(d)?d:''};
let D=null,TAB='dt',THANG='nay',KYP='thang',doiMk=false,CH_LOC='dung',Q='',addMem=false,openMem=null;

/* ===== dữ liệu mẫu (?demo=1 hoặc mở file trên máy) ===== */
function sample(){const t=fD(new Date());const ago=n=>addD(t,-n);const P='0939111222';
  const ctv=[{sdt:'0905000111',ten:'Hậu',role:'Leader',leader:'',ngay:ago(40)},{sdt:'0905000222',ten:'Vy',role:'Leader',leader:'',ngay:ago(38)},
    {sdt:'0912000333',ten:'Tín',role:'Sale',leader:'0905000111',ngay:ago(35)},{sdt:'0912000444',ten:'Phương',role:'Sale',leader:'0905000111',ngay:ago(30)},
    {sdt:'0912000555',ten:'Duy',role:'Sale',leader:'0905000222',ngay:ago(20)},{sdt:'0912000666',ten:'Như',role:'Sale',leader:'0905000222',ngay:ago(3)}];
  const kh=[['Minh Châu Mobile','0292 111 222','Đã duyệt',addD(t,300),'0912000333'],['Ninh Kiều Phone','0292 333 444','Đã duyệt',addD(t,25),'0912000444'],
    ['Cái Răng ĐTDĐ','0292 555 666','Chờ duyệt','', '0912000555'],['Hưng Phát Mobile','0939 777 888','Đã duyệt',addD(t,700),'0905000111'],
    ['Thảo Nguyên Mobile','0939 999 000','Đã duyệt',ago(5),'0912000333'],['Bình Thủy Phone','0292 123 456','Đã duyệt',addD(t,340),P],['Phong Điền Mobile','0292 654 321','Đã duyệt',addD(t,355),'0912000555']]
    .map(([shop,sdt,tt,han,c],i)=>({shop,sdt,tt,han,yeuCau:ago(i*6),ctv:c}));
  const m0=t.slice(0,8),pm=fD(new Date(pD(t).getFullYear(),pD(t).getMonth()-1,12)).slice(0,8);
  const tt=[[pm+'05','Minh Châu Mobile',12,990000,'Kích hoạt','0912000333'],[pm+'12','Ninh Kiều Phone',12,990000,'Kích hoạt','0912000444'],[pm+'20','Hưng Phát Mobile',36,2690000,'Kích hoạt','0905000111'],
    [ago(Math.min(4,+t.slice(8)-1)),'Bình Thủy Phone',12,1190000,'Kích hoạt',P],[ago(Math.min(2,+t.slice(8)-1)),'Phong Điền Mobile',12,1190000,'Kích hoạt','0912000555'],[ago(0),'Thảo Nguyên Mobile',12,1190000,'Gia hạn','0912000333']]
    .map(([ngay,shop,m,tien,loai,c])=>({ngay,shop,m,tien,loai,ctv:c,hhP:Math.round(tien*.7)}));
  return {partner:{sdt:P,ten:'Cần Thơ',khuVuc:'Cần Thơ',pct:70},ctv,kh,tt,doiSoat:[{thang:pm.slice(0,7),tien:Math.round((990000*2+2690000)*.7),ngayTra:pm.slice(0,7)+'-30'}].filter(x=>x.thang!==m0.slice(0,7)),
    goi:[{m:12,ten:'1 năm',gia:1190000},{m:36,ten:'3 năm',gia:2690000}],udDaDung:23,today:t}}
function fake(fn,a,b,c,d){if(fn==='partnerLogin')return{tok:'demo'};if(fn==='partnerData')return D||sample();
  if(fn==='partnerSaveCtv'){const s=sdtOk(a);if(!s)throw new Error('Số điện thoại không hợp lệ');if(s===D.partner.sdt)throw new Error('Đây là số của Partner');
    const x=D.ctv.find(o=>o.sdt===s),r=c==='Leader'?'Leader':'Sale';if(x){x.ten=b;x.role=r;x.leader=r==='Leader'?'':d||''}else D.ctv.push({sdt:s,ten:b,role:r,leader:r==='Leader'?'':d||'',ngay:D.today});return D}
  if(fn==='partnerDoiMatKhau'){if(a!=='demo123')throw new Error('Mật khẩu đang dùng chưa đúng (bản mẫu: demo123)');return{tok:'demo2'}}
  throw new Error('Không rõ thao tác')}
function call(fn,...a){if(!LIVE){try{return Promise.resolve(fake(fn,...a))}catch(e){return Promise.reject(e)}}
  const body=fn==='partnerLogin'?{act:'partner',fn,args:a}:{act:'partner',tok:TOK,fn,args:a};
  return fetch(API,{method:'POST',body:JSON.stringify(body)}).then(r=>r.json()).then(r=>{if(r.ok)return r.data;if(r.dangNhap){try{localStorage.removeItem(KTOK)}catch(e){}TOK='';showGate(r.msg)}throw new Error(r.msg||'Lỗi máy chủ')})}
function showGate(msg){$('gate').hidden=false;$('gErr').textContent=msg||'';setTimeout(()=>$('gSdt').focus(),50)}
$('gateF').addEventListener('submit',e=>{e.preventDefault();const s=sdtOk($('gSdt').value),mk=$('gMk').value;
  if(!s){$('gErr').textContent='Số điện thoại chưa đúng';return}if(!mk){$('gErr').textContent='Nhập mật khẩu';return}
  $('gErr').textContent='Đang kiểm tra…';call('partnerLogin',s,mk).then(r=>{TOK=r.tok;try{localStorage.setItem(KTOK,TOK)}catch(_){}$('gate').hidden=true;$('gMk').value='';load()}).catch(er=>{$('gErr').textContent=er.message})});
let tmr;function toast(m){const e=$('toast');e.textContent=m;e.hidden=false;clearTimeout(tmr);tmr=setTimeout(()=>e.hidden=true,2300)}
function load(){if(LIVE&&!TOK){showGate('');return}$('sub').textContent='Đang tải…';
  call('partnerData').then(d=>{D=d;render()}).catch(e=>{if($('gate').hidden)$('v').innerHTML='<div class="card">Không tải được: '+esc(e.message)+'</div>'})}

/* ===== tính số ===== */
const P=()=>D.partner;
const memOf=s=>s===P().sdt?{sdt:s,ten:'Partner '+(P().khuVuc||''),role:'Partner',leader:''}:(D.ctv.find(x=>x.sdt===s)||{sdt:s,ten:'',role:'Sale',leader:''});
const tenOf=s=>{const m=memOf(s);return m.ten||fmtSdt(s)};
const trangThai=k=>k.tt==='Tạm duyệt'||k.tt==='Chờ duyệt'?'cho':k.tt==='Đã duyệt'?(k.han&&k.han<D.today?'het':'dung'):'khoa';
const thangKey=()=>{const t=D.today;if(THANG==='nay')return t.slice(0,7);const x=pD(t.slice(0,8)+'15');x.setMonth(x.getMonth()-1);return fD(x).slice(0,7)};
const inM=(x,m)=>x.ngay.slice(0,7)===m;
function sumM(m,f){const L=D.tt.filter(x=>inM(x,m)&&(!f||f(x)));return{L,dt:L.reduce((a,x)=>a+x.tien,0),nhan:L.reduce((a,x)=>a+(x.hhP||0),0),n:L.length,moi:L.filter(x=>x.loai!=='Gia hạn').length,gh:L.filter(x=>x.loai==='Gia hạn').length}}
const pctTxt=()=>(P().pct||70)+'%';

/* 06/11 anh Thái: thẻ chương trình + đếm ngược 100 suất ưu đãi (chỉ app anh + app Partner). Máy chủ trả D.udDaDung = số suất 990k đã dùng toàn hệ thống. */
function progCard(){if(typeof D.udDaDung!=='number')return '';const T=100,da=D.udDaDung,con=Math.max(0,T-da);
  return `<div class="prog"><h2>🔥 Chương trình mở bán Shop Gọn</h2>
  <div class="cd">${con?`<b class="num">${con}</b><span>/ ${T} suất ưu đãi 990.000đ còn lại</span>`:'<span>Đã hết 100 suất ưu đãi 990.000đ — chỉ còn giá thường</span>'}</div>
  <div class="bar2" role="progressbar" aria-valuenow="${da}" aria-valuemax="${T}"><i style="width:${Math.min(100,da/T*100)}%"></i></div>
  <div class="g3"><div class="hot"><small>Ưu đãi 100 shop đầu</small><b class="num">990.000đ</b><em>gói 1 năm</em></div>
    <div><small>Gói 1 năm</small><b class="num">1.190.000đ</b><em>12 bài truyền thông</em></div>
    <div><small>Gói 3 năm</small><b class="num">2.690.000đ</b><em>giảm đến 880.000đ</em></div></div>
  <small style="display:block;color:#7a4700;margin-top:8px">Suất ưu đãi dùng chung toàn hệ thống — chốt shop sớm để giữ suất.</small></div>`}

/* ===== TAB 1: DOANH THU ===== */
/* 06/11 anh Thái: doanh số khu vực xem Ngày · Tuần · Tháng giống app quản trị */
const monday=x=>{const d=pD(x);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return fD(d)};
function ky(kind,t){if(kind==='ngay')return{tu:t,den:t,ten:'Hôm nay',truoc:{tu:addD(t,-1),den:addD(t,-1)},tenTruoc:'hôm qua'};
  if(kind==='tuan'){const m=monday(t);return{tu:m,den:t,ten:'Tuần này ('+dm(m)+' – '+dm(t)+')',truoc:{tu:addD(m,-7),den:addD(t,-7)},tenTruoc:'cùng kỳ tuần trước'}}
  const m0=t.slice(0,8)+'01',x=pD(m0);x.setMonth(x.getMonth()-1);const pm=fD(x),pEnd=addD(m0,-1),pDen=pm.slice(0,8)+String(Math.min(+t.slice(8),+pEnd.slice(8))).padStart(2,'0');
  return{tu:m0,den:t,ten:'Tháng '+(+t.slice(5,7))+'/'+t.slice(0,4),truoc:{tu:pm,den:pDen},tenTruoc:'cùng kỳ tháng trước'}}
const inR=(s,r)=>s>=r.tu&&s<=r.den;
function sumR(r){const L=D.tt.filter(x=>inR(x.ngay,r));return{L,dt:L.reduce((a,x)=>a+x.tien,0),nhan:L.reduce((a,x)=>a+(x.hhP||0),0),n:L.length,moi:L.filter(x=>x.loai!=='Gia hạn').length,gh:L.filter(x=>x.loai==='Gia hạn').length}}
function cot(kind,t){const out=[];
  if(kind==='ngay'){for(let i=13;i>=0;i--){const d=addD(t,-i);out.push({l:i%2?'':dm(d),r:{tu:d,den:d},now:i===0})}}
  else if(kind==='tuan'){const m=monday(t);for(let i=7;i>=0;i--){const a=addD(m,-7*i);out.push({l:dm(a),r:{tu:a,den:addD(a,6)},now:i===0})}}
  else{for(let i=5;i>=0;i--){const x=pD(t.slice(0,8)+'15');x.setMonth(x.getMonth()-i);const k=fD(x).slice(0,7);out.push({l:'T'+(+k.slice(5)),k,r:{tu:k+'-01',den:k+'-31'},now:i===0})}}
  return out.map(c=>Object.assign(c,{v:sumR(c.r)}))}
const pctCmp=(a,b)=>b?(a>=b?'▲ ':'▼ ')+Math.abs(Math.round((a/b-1)*100))+'%':(a?'▲ mới':'—');
function vDT(){const t=D.today,K=ky(KYP,t),s=sumR(K),p=sumR(K.truoc);
  const dung=D.kh.filter(k=>trangThai(k)==='dung'),cho=D.kh.filter(k=>trangThai(k)==='cho').length;
  const sap=dung.filter(k=>k.han&&days(k.han,t)<=30);
  const C=cot(KYP,t),mx=Math.max(...C.map(c=>c.v.dt),1);
  const M=[];for(let i=5;i>=0;i--){const x=pD(t.slice(0,8)+'15');x.setMonth(x.getMonth()-i);const k=fD(x).slice(0,7);M.push({k,v:sumR({tu:k+'-01',den:k+'-31'})})}
  const ds=(D.doiSoat||[]).slice().sort((a,b)=>b.thang.localeCompare(a.thang));
  return progCard()+`<div class="seg" role="group">${[['ngay','Ngày'],['tuan','Tuần'],['thang','Tháng']].map(([k,l])=>`<button data-kyp="${k}" aria-pressed="${KYP===k}">${l}</button>`).join('')}</div>
  <div class="kpis">
    <div class="kpi hero"><div class="eb">Doanh số khu vực · ${esc(K.ten)}</div><div class="v num">${money(s.dt)}</div><div class="d">${pctCmp(s.dt,p.dt)} so với ${K.tenTruoc} (${short(p.dt)})</div></div>
    <div class="kpi"><div class="eb">Bạn nhận ${pctTxt()}</div><div class="v num" style="font-size:19px">${money(s.nhan)}</div><div class="d">Shop Gọn chuyển đầu tháng sau</div></div>
    <div class="kpi"><div class="eb">Số app bán</div><div class="v num">${s.n}</div><div class="d">${s.moi} mới · ${s.gh} gia hạn</div></div>
    <div class="kpi"><div class="eb">Shop đang dùng</div><div class="v num">${dung.length}</div><div class="d">${cho?cho+' shop chờ duyệt':'Không shop chờ duyệt'}</div></div>
    <div class="kpi"><div class="eb">Sắp hết hạn</div><div class="v num" style="color:${sap.length?'var(--amber)':'inherit'}">${sap.length}</div><div class="d">trong 30 ngày tới</div></div>
  </div>
  <div class="card"><h2>Doanh số ${KYP==='ngay'?'14 ngày':KYP==='tuan'?'8 tuần':'6 tháng'}</h2><div class="bars">${C.map(c=>`<div class="bar${c.now?' now':''}"><em class="num">${c.v.dt?short(c.v.dt):''}</em><i style="height:${c.v.dt/mx*100}%"></i><span>${c.l}</span></div>`).join('')}</div></div>
  ${sap.length?`<div class="card" style="border:2px solid var(--amber-soft)"><h2 style="color:var(--amber)">Sắp hết hạn trong 30 ngày (${sap.length})</h2><small style="color:var(--muted)">Nhắc đội chăm shop gia hạn — gia hạn vẫn tính ${pctTxt()} cho bạn.</small>
    ${sap.map(k=>`<div class="row"><div class="n"><b>${esc(k.shop)}</b><small>CTV ${esc(tenOf(k.ctv))} · hạn ${dmy(k.han)}</small></div><span class="pill p-a">Còn ${days(k.han,t)} ngày</span></div>`).join('')}</div>`:''}
  <div class="card"><h2>Giao dịch · ${esc(K.ten)}</h2>${s.L.length?[...s.L].sort((a,b)=>b.ngay.localeCompare(a.ngay)).map(x=>`<div class="row"><div class="n"><b>${esc(x.shop)}</b><small>${dmy(x.ngay)} · ${esc(x.loai)} gói ${goiTen(x.m)} · ${esc(tenOf(x.ctv))}</small></div><div class="r"><b class="num">${money(x.tien)}</b><small class="num">Bạn nhận ${money(x.hhP)}</small></div></div>`).join(''):'<div class="empty">Chưa có giao dịch.</div>'}</div>
  <div class="card"><h2>Đối soát với Shop Gọn</h2>${M.slice().reverse().filter(c=>c.v.n||ds.some(x=>x.thang===c.k)).map(c=>{const q=ds.find(x=>x.thang===c.k);
    return `<div class="row"><div class="n"><b>Tháng ${+c.k.slice(5)}/${c.k.slice(0,4)}</b><small>Doanh số ${money(c.v.dt)} · ${c.v.n} gói</small></div><div class="r"><b class="num">${money(c.v.nhan)}</b>${q?`<span class="pill p-g">Đã nhận ${dm(q.ngayTra)}</span>`:c.k===t.slice(0,7)?'<span class="pill p-n">Đang chạy</span>':'<span class="pill p-a">Chờ chuyển</span>'}</div></div>`}).join('')||'<div class="empty">Chưa có giao dịch.</div>'}</div>
  ${acctCard()}
  <p class="note">Giá gói cố định: 1 năm 1.190.000đ · 3 năm 2.690.000đ · ưu đãi 990.000đ cho 100 shop đầu. Shop chuyển khoản về tài khoản Shop Gọn, Shop Gọn duyệt là số tự vào đây.</p>`}

/* 06/11: Partner tự đổi mật khẩu */
function acctCard(){if(!doiMk)return `<div class="act" style="justify-content:center"><button class="ghost" data-doimk="1">🔑 Đổi mật khẩu</button>${LIVE?'<button class="ghost" data-out="1">Đăng xuất</button>':''}</div>`;
  return `<div class="card" style="display:flex;flex-direction:column;gap:8px"><h2 style="margin:0">🔑 Đổi mật khẩu</h2>
    <input class="f" id="mkCu" type="password" autocomplete="current-password" placeholder="Mật khẩu đang dùng">
    <input class="f" id="mkMoi" type="password" autocomplete="new-password" placeholder="Mật khẩu mới (ít nhất 6 ký tự)">
    <input class="f" id="mkMoi2" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu mới">
    <div class="act"><button class="btn" data-luumk="1" style="flex:1">Lưu mật khẩu</button><button class="ghost" data-doimk="0">Thôi</button></div></div>`}

/* ===== TAB 2: ĐỘI ===== */
function vDoi(){const m=thangKey();
  const st=s=>{const o=sumM(m,x=>x.ctv===s);const shops=D.kh.filter(k=>k.ctv===s);return{s,ten:tenOf(s),dt:o.dt,n:o.n,shops:shops.length,dung:shops.filter(k=>trangThai(k)==='dung').length}};
  const leaders=D.ctv.filter(c=>c.role==='Leader');
  const blocks=leaders.map(l=>{const mem=D.ctv.filter(c=>c.role!=='Leader'&&c.leader===l.sdt).map(c=>st(c.sdt)).sort((a,b)=>b.dt-a.dt);const me=st(l.sdt);
    return{l,me,mem,dt:me.dt+mem.reduce((a,c)=>a+c.dt,0),n:me.n+mem.reduce((a,c)=>a+c.n,0)}}).sort((a,b)=>b.dt-a.dt);
  const lone=D.ctv.filter(c=>c.role!=='Leader'&&!leaders.some(l=>l.sdt===c.leader)).map(c=>st(c.sdt));
  const me=st(P().sdt);
  const row=(c,tag)=>`<div class="row" style="flex-wrap:wrap;cursor:pointer" data-mem="${c.s}"><div class="n"><b>${esc(c.ten)}${tag?' <span class="pill p-b">'+tag+'</span>':''}</b><small class="num">${fmtSdt(c.s)} · ${c.shops} shop (${c.dung} đang dùng)</small></div><div class="r"><b class="num">${money(c.dt)}</b><small>${c.n} gói</small></div>
    ${openMem===c.s?`<div class="ex" style="flex-basis:100%"><div class="act" style="padding:10px 0"><button class="ghost" data-link="${c.s}">📋 Chép link cài app</button>${c.s!==P().sdt?`<button class="ghost" data-edit="${c.s}">✏️ Sửa</button>`:''}</div><small style="display:block;color:var(--muted);padding-bottom:10px">Link shopgon.vn/setup?ctv=${c.s} — shop cài từ link này tự gắn về ${esc(c.ten)}.</small></div>`:''}</div>`;
  const ed=addMem&&addMem!=='ld'&&addMem!=='ctv'?D.ctv.find(x=>x.sdt===addMem):null;
  const form=addMem?`<div class="card" style="display:flex;flex-direction:column;gap:8px"><h2 style="margin:0">${ed?'Sửa '+esc(ed.ten):addMem==='ld'?'Thêm Leader':'Thêm cộng tác viên'}</h2>
    <input class="f" id="mSdt" inputmode="tel" placeholder="Số điện thoại" value="${ed?ed.sdt:''}" ${ed?'readonly':''}><input class="f" id="mTen" placeholder="Tên" value="${ed?esc(ed.ten):''}">
    ${(ed?ed.role!=='Leader':addMem==='ctv')?`<select class="f" id="mLd"><option value="">Chọn leader quản lý</option>${leaders.map(l=>`<option value="${l.sdt}" ${ed&&ed.leader===l.sdt?'selected':''}>${esc(l.ten||fmtSdt(l.sdt))}</option>`).join('')}</select>`:''}
    <div class="act"><button class="btn" data-savemem="${ed?'ed':addMem}" style="flex:1">Lưu</button><button class="ghost" data-addmem="0">Thôi</button></div></div>`:'';
  return `<div class="seg" role="group"><button data-thang="nay" aria-pressed="${THANG==='nay'}">Tháng này</button><button data-thang="truoc" aria-pressed="${THANG==='truoc'}">Tháng trước</button></div>
  <div class="kpis"><div class="kpi"><div class="eb">Leader · CTV</div><div class="v num">${leaders.length} · ${D.ctv.length-leaders.length}</div><div class="d">${D.ctv.filter(c=>sumM(m,x=>x.ctv===c.sdt).n).length} người có bán tháng ${+m.slice(5)}</div></div>
    <div class="kpi"><div class="eb">Bạn tự bán</div><div class="v num" style="font-size:19px">${money(me.dt)}</div><div class="d">${me.n} gói · ${me.shops} shop</div></div></div>
  <div class="act"><button class="btn" data-addmem="ld">＋ Thêm Leader</button><button class="ghost" data-addmem="ctv" style="padding:11px 16px">＋ Thêm CTV</button></div>
  ${form}
  <div class="card">${row(me,'Partner')}</div>
  ${blocks.map(b=>`<div class="card"><div class="top"><div class="n"><b style="font-size:17px">Đội ${esc(b.l.ten||fmtSdt(b.l.sdt))}</b><small class="num">${b.mem.length} CTV · ${b.n} gói tháng ${+m.slice(5)}</small></div><div class="r"><b class="num" style="font-size:19px;color:var(--pen)">${money(b.dt)}</b><small>Doanh thu đội</small></div></div>
    <div style="margin-top:6px">${row(b.me,'Leader')}${b.mem.length?b.mem.map(c=>row(c)).join(''):'<div class="empty">Chưa có CTV. Bấm ＋ Thêm CTV.</div>'}</div></div>`).join('')}
  ${lone.length?`<div class="card" style="border:2px solid var(--amber-soft)"><h2 style="color:var(--amber)">Chưa có leader (${lone.length})</h2>${lone.map(c=>row(c)).join('')}</div>`:''}
  ${!blocks.length&&!lone.length?'<div class="card empty">Chưa có ai trong đội. Bấm ＋ Thêm Leader để bắt đầu.</div>':''}
  <p class="note">Shop Gọn chỉ tính tiền với Partner (${pctTxt()} tiền gói). Hoa hồng cho Leader/CTV do bạn tự chia — app chỉ ghi ai bán để bạn tính.</p>`}

/* ===== TAB 3: CỬA HÀNG ===== */
function pill(k){const s=trangThai(k),left=k.han?days(k.han,D.today):null;
  return s==='cho'?'<span class="pill p-a">Chờ duyệt</span>':s==='khoa'?`<span class="pill p-r">${esc(k.tt)}</span>`:s==='het'?'<span class="pill p-r">Hết hạn</span>':left<=30?`<span class="pill p-a">Còn ${left} ngày</span>`:`<span class="pill p-g">Còn ${left} ngày</span>`}
function vCH(){const nhom={cho:[],dung:[],het:[],khoa:[]};D.kh.forEach(k=>nhom[trangThai(k)].push(k));nhom.dung.sort((a,b)=>(a.han||'').localeCompare(b.han||''));
  let L=CH_LOC==='tat'?D.kh.slice():nhom[CH_LOC];const q=Q.trim().toLowerCase();if(q)L=L.filter(k=>(k.shop+' '+k.sdt+' '+tenOf(k.ctv)).toLowerCase().includes(q));
  return `<input class="f" id="q" placeholder="Tìm tên shop, SĐT, người bán" value="${esc(Q)}" inputmode="search">
  <div class="chips">${[['dung','Đang dùng',nhom.dung.length],['cho','Chờ duyệt',nhom.cho.length],['het','Hết hạn',nhom.het.length],['tat','Tất cả',D.kh.length]].map(([k,l,n])=>`<button class="chip" data-loc="${k}" aria-pressed="${CH_LOC===k}">${l} (${n})</button>`).join('')}</div>
  <div class="card">${L.length?L.map(k=>`<div class="row"><div class="n"><b>${esc(k.shop)}</b><small class="num">${k.sdt?esc(k.sdt)+' · ':''}${esc(tenOf(k.ctv))}${k.han?' · hạn '+dmy(k.han):' · gửi '+dmy(k.yeuCau)}</small></div>${pill(k)}</div>`).join(''):'<div class="empty">Không có cửa hàng nào.</div>'}</div>
  <p class="note">Shop chờ duyệt: nhắc shop chuyển khoản đúng giá gói, gửi biên lai cho Sale → Shop Gọn duyệt. Partner không xem được dữ liệu bán hàng của shop.</p>`}

/* ===== vẽ ===== */
function render(){if(!D)return;$('ttl').textContent='Partner '+(P().khuVuc||'');
  $('sub').textContent=(LIVE?'':'Bản xem trước · dữ liệu mẫu · ')+fmtSdt(P().sdt)+' · nhận '+pctTxt();
  document.querySelectorAll('nav [data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===TAB));
  $('v').innerHTML=TAB==='dt'?vDT():TAB==='doi'?vDoi():TAB==='ti'?vTi():vCH()}
function vTi(){return `<div class="card"><h2 class="tih">Tiện ích</h2><p class="tis">Demo cho đội và shop: tự test app, học cách dùng, nắm giá đối thủ.</p><div class="tig"><a class="ti hot" href="/app/?demo=1&test=1"><span class="tic"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg></span><b>App chủ shop · test</b><small>Vào thẳng tài khoản test, đủ tính năng</small></a><button type="button" class="ti hot" data-nvtest="1"><span class="tic"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.9-4 4-6 8-6s7.1 2 8 6"/></svg></span><b>App nhân viên · test</b><small>Vào thẳng tài khoản nhân viên bán hàng</small></button><a class="ti" href="/bg/?demo=1&xem=1"><span class="tic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg></span><b>Website bảng giá mẫu</b><small>Trang khách xem giá, gọi Zalo</small></a><a class="ti" href="/huong-dan/"><span class="tic"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 19V5M8 7h7"/></svg></span><b>Hướng dẫn sử dụng</b><small>Từng bước, có ảnh</small></a><a class="ti" href="/so-sanh.html"><span class="tic"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span><b>So sánh giá đối thủ</b><small>Shop Gọn vs KiotViet, Sapo</small></a><a class="ti" href="/setup/"><span class="tic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v1M14 20h1M18 18h3v3"/></svg></span><b>Bảng giá · cài đặt</b><small>Giá gói, QR mở app</small></a><a class="ti" href="https://www.facebook.com/profile.php?id=61595903296880" target="_blank" rel="noopener"><span class="tic"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/></svg></span><b>Page Facebook</b><small>Gửi shop xem, hỏi đáp</small></a></div></div>`}
function go(t){TAB=t;addMem=false;openMem=null;render();$('main').scrollTop=0}
function copy(txt){(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Đã chép link'),()=>{prompt('Chép link:',txt)})}
document.addEventListener('click',e=>{if(e.target.closest('.ex')&&!e.target.closest('button'))return;
  const b=e.target.closest('button,[data-mem]');if(!b)return;const d=b.dataset;
  if(b.id==='reload'){load();return}
  if(d.out){try{localStorage.removeItem(KTOK)}catch(_){}TOK='';D=null;showGate('');return}
  if(d.nvtest){try{localStorage.setItem('shopgon_nv',JSON.stringify({sdt:'0900000000',ten:'NV test',phien:'TEST',test:1}))}catch(_){}location.href='/app/';return}
  if(d.tab){go(d.tab);return}
  if(d.thang){THANG=d.thang;render();return}
  if(d.kyp){KYP=d.kyp;render();return}
  if(d.doimk){doiMk=d.doimk==='1';render();if(doiMk)setTimeout(()=>{const i=$('mkCu');i&&i.scrollIntoView({block:'center'});i&&i.focus()},0);return}
  if(d.luumk){const cu=$('mkCu').value,mo=$('mkMoi').value,mo2=$('mkMoi2').value;if(!cu){toast('Nhập mật khẩu đang dùng');return}if(mo.length<6){toast('Mật khẩu mới ít nhất 6 ký tự');return}if(mo!==mo2){toast('Hai lần nhập mật khẩu mới không khớp');return}
    b.disabled=true;call('partnerDoiMatKhau',cu,mo).then(r=>{if(r&&r.tok){TOK=r.tok;try{localStorage.setItem(KTOK,TOK)}catch(_){}}doiMk=false;render();toast('Đã đổi mật khẩu')}).catch(er=>{b.disabled=false;toast(er.message)});return}
  if(d.loc){CH_LOC=d.loc;render();return}
  if(d.link){copy('https://shopgon.vn/setup/?ctv='+d.link);return}
  if(d.edit){addMem=d.edit;openMem=null;render();$('main').scrollTop=0;return}
  if('addmem' in d){addMem=d.addmem==='0'?false:d.addmem;render();if(addMem)setTimeout(()=>$('mSdt')&&$('mSdt').focus(),0);return}
  if(d.savemem){const ed=d.savemem==='ed'?D.ctv.find(x=>x.sdt===addMem):null;const sdt=sdtOk($('mSdt').value),ten=$('mTen').value.trim();
    const role=ed?ed.role:d.savemem==='ld'?'Leader':'Sale';const ld=$('mLd')?$('mLd').value:'';
    if(!sdt){toast('Số điện thoại chưa đúng');return}if(!ten){toast('Nhập tên');return}if(role!=='Leader'&&!ld){toast('Chọn leader quản lý');return}
    b.disabled=true;call('partnerSaveCtv',sdt,ten,role,ld).then(x=>{D=x;addMem=false;render();toast('Đã lưu')}).catch(er=>{b.disabled=false;toast(er.message)});return}
  if(d.mem&&b.tagName!=='BUTTON'){openMem=openMem===d.mem?null:d.mem;render();return}
});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){Q=t.value;const pos=t.selectionStart;render();const i=$('q');i.focus();try{i.setSelectionRange(pos,pos)}catch(_){}}});
load();
</script>
</body></html>
