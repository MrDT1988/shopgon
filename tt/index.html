<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thiết kế hình · Shop Gọn</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script src="/mua.js"></script>
<style>
:root{--ngoc:#0f766e;--ngoc2:#e6f4f1;--muc:#10201e;--xam:#5d6f6c;--vien:#d5e4e1;--nen:#f6faf9;--trang:#fff;--do:#c2410c}
*{box-sizing:border-box}
body{margin:0;background:var(--nen);color:var(--muc);font:15px/1.45 "Be Vietnam Pro",system-ui,sans-serif}
header{background:var(--ngoc);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header b{font-size:17px}header small{opacity:.8;margin-left:auto}
.tab{display:flex;gap:8px;padding:12px 16px 0}
.tab button{flex:1;border:0;border-radius:12px 12px 0 0;padding:12px;font:inherit;font-weight:700;background:#dfe9e6;color:var(--xam)}
.tab button.on{background:var(--trang);color:var(--ngoc)}
main{max-width:1100px;margin:0 auto;padding:0 16px 40px;display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:20px}
@media(max-width:860px){main{grid-template-columns:1fr}}
.the{background:var(--trang);border:1px solid var(--vien);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.the h3{margin:0;font-size:15px;color:var(--ngoc);text-transform:uppercase;letter-spacing:.06em}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--xam)}
input,select,textarea{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--vien);border-radius:10px;background:#fff;color:var(--muc);width:100%}
.hai{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hang{display:flex;gap:6px;flex-wrap:wrap}
.hang button{flex:1;min-width:70px;border:1.5px solid var(--vien);background:#fff;border-radius:10px;padding:9px 6px;font:inherit;font-weight:700;color:var(--xam)}
.hang button.on{border-color:var(--ngoc);background:var(--ngoc2);color:var(--ngoc)}
.goiy{max-height:220px;overflow:auto;border:1px solid var(--vien);border-radius:10px;display:none}
.goiy div{padding:9px 12px;border-bottom:1px solid #eef3f2;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.goiy div:hover{background:var(--ngoc2)}.goiy small{color:var(--xam);white-space:nowrap}
.mau{display:flex;gap:8px;flex-wrap:wrap}
.mau button{border:1.5px solid var(--vien);background:#fff;border-radius:12px;padding:4px;width:74px;font:inherit;font-size:11px;color:var(--xam)}
.mau button img{width:100%;height:70px;object-fit:contain;display:block}
.mau button.on{border-color:var(--ngoc);background:var(--ngoc2)}
.ny{display:flex;justify-content:space-between;align-items:center;background:var(--ngoc2);border-radius:10px;padding:10px 12px;font-weight:700}
.ny span{font-size:12px;color:var(--xam);font-weight:600}
.tinh{background:#10201e;color:#fff;border-radius:12px;padding:12px 14px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:4px}
.tinh .dong{display:flex;justify-content:space-between;opacity:.85;font-size:14px}
.tinh .cuoi{display:flex;justify-content:space-between;font-size:20px;font-weight:800;color:#ffd23f;border-top:1px solid rgba(255,255,255,.2);padding-top:6px;margin-top:2px}
.canh{color:var(--do);font-size:13px;font-weight:600}
.nut{border:0;border-radius:12px;padding:14px;font:inherit;font-weight:800;font-size:16px;background:var(--ngoc);color:#fff;cursor:pointer}
.nut.phu{background:#fff;color:var(--ngoc);border:1.5px solid var(--ngoc);padding:10px}
.luoi{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.o{background:#fff;border:1px solid var(--vien);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:8px}
.khung{width:100%;aspect-ratio:1080/1350;overflow:hidden;border-radius:8px;position:relative;background:#eee;max-width:100%}
.khung>div{position:absolute;left:0;top:0;transform-origin:0 0}
.cap{background:#fff;border:1px solid var(--vien);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.cap textarea{min-height:130px;font-size:14px}
.trong{color:var(--xam);text-align:center;padding:40px 10px}
#cho{position:fixed;left:-99999px;top:0}
.k{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:"Be Vietnam Pro",sans-serif;color:#fff}
.k .d{font-weight:900;letter-spacing:-.02em;line-height:1.04}
.k .chan{position:absolute;left:0;right:0;bottom:0;height:150px;display:flex;align-items:center;justify-content:space-between;padding:0 64px;font-size:26px}
.k .chan b{font-size:34px;display:block}.k .chan .dt{font-size:44px;font-weight:800}
.k .pill{display:inline-flex;align-items:center;gap:10px;padding:12px 26px;border-radius:999px;font-size:28px;font-weight:800}
.k .may{position:absolute;filter:drop-shadow(0 40px 50px rgba(0,0,0,.35));object-fit:contain}
.k .gach{text-decoration:line-through;opacity:.75}
.k .nhan{display:inline-block;padding:8px 20px;border-radius:14px;font-weight:900;font-size:34px}
body.robot #cho{position:fixed;left:0;top:0;z-index:99}
.k .hieuung{position:absolute;inset:0;pointer-events:none;z-index:50}
</style></head><body>
<header><a id="veapp" hidden style="color:inherit;font-size:13px;text-decoration:none;opacity:.85">‹ Về app</a><b>🖼 Thiết kế hình sản phẩm</b><small id="capnhat"></small></header>
<div class="tab"><button class="on">🖼 Thiết kế hình</button><button onclick="alert('Đang làm')">🎬 Thiết kế video</button></div>
<main>
<section style="display:flex;flex-direction:column;gap:14px;padding-top:14px">
 <div class="the"><h3>1 · Chọn máy</h3>
  <div class="hang" id="hang"></div>
  <label>Tên máy<input id="tim" placeholder="Gõ tên máy, ví dụ A7 Pro, S26, iPhone 17…" autocomplete="off"></label>
  <div class="goiy" id="goiy"></div>
  <label style="flex-direction:row;align-items:center;gap:8px;font-size:14px;cursor:pointer;color:var(--xam)">📷 <span><b style="color:inherit;text-decoration:underline">Máy không có trong kho? Tải hình của shop lên</b><br><small>Gõ tên máy ở ô trên trước, rồi chọn hình trong điện thoại</small></span><input type="file" id="anhShop" accept="image/*" hidden></label>
  <div id="chon" hidden>
   <div style="display:flex;flex-direction:column;gap:10px">
    <label>Dung lượng<select id="dl"></select></label>
    <div><div style="font-size:13px;font-weight:600;color:var(--xam);margin-bottom:4px">Màu</div><div class="mau" id="mau"></div></div>
   </div>
  </div>
 </div>
 <div class="the"><h3>2 · Giá &amp; khuyến mãi</h3>
  <div class="hai"><label>Giá niêm yết (đ)<input id="ny" inputmode="numeric" placeholder="VD: 13.490.000"></label>
  <label>Giá shop bán (đ)<input id="gb" inputmode="numeric" placeholder="VD: 11.990.000"></label></div>
  <div style="font-size:12px;color:var(--xam);margin-top:-4px">Shop tự điền 2 giá. Phần chênh lệch = khuyến mãi, tự hiện trên hình (giá niêm yết gạch ngang + nhãn Giảm).</div>
  <div class="tinh" id="tinh"></div><div class="canh" id="canh"></div>
  <label>Quà tặng (mỗi dòng 1 món)<textarea id="qua" rows="3" placeholder="Ốp lưng + cường lực&#10;Củ sạc nhanh"></textarea></label>
  <div class="hai"><label>Trả góp/tháng (đ)<input id="gop" inputmode="numeric" placeholder="để trống nếu không"></label>
  <label>Trợ giá thu cũ (đ)<input id="tro" inputmode="numeric" placeholder="để trống nếu không"></label></div>
  <label>Điểm mạnh nổi bật (mỗi dòng 1 ý, tối đa 4)<textarea id="diem" rows="3" placeholder="Pin 8.000mAh&#10;Sạc nhanh 45W&#10;Chống nước IP69"></textarea></label>
 </div>
 <div class="the"><h3>3 · Thông tin shop</h3>
  <label>Tên shop<input id="shop" placeholder="Minh Phát Mobile"></label>
  <label>Địa chỉ<input id="dc" placeholder="123 Ấp Bắc, TP. Mỹ Tho"></label>
  <label>Số điện thoại / Zalo<input id="dt" inputmode="tel" placeholder="0909 123 456"></label>
 </div>
 <button class="nut" id="tao">✨ Tạo hình</button>
</section>
<section style="padding-top:14px;display:flex;flex-direction:column;gap:14px;min-width:0">
 <div class="luoi" id="luoi"><div class="trong">Chọn máy, điền giá rồi bấm <b>Tạo hình</b>.<br>Bấm nút dưới hình để tải về.</div></div>
 <div class="cap" id="capbox" hidden><b>Caption đăng Facebook</b>
  <div class="hang" id="capchon"><button class="on" data-c="0">Ngắn</button><button data-c="1">Vừa</button><button data-c="2">Kêu gọi</button></div>
  <textarea id="cap"></textarea><button class="nut phu" id="copy">📋 Copy caption</button></div>
</section>
</main>
<div id="cho"></div>
<script>
var KHO = null, HANG = 'OPPO', SP = null, BT = null, MAU = null, CAPS = [];
var $ = function (id) { return document.getElementById(id); };
var so = function (s) { return +String(s || '').replace(/[^\d]/g, '') || 0; };
var vnd = function (n) { return (n || 0).toLocaleString('vi-VN') + 'đ'; };
var gon = function (n) { return n >= 1e6 ? (Math.round(n / 1e5) / 10 + '').replace('.', ',') + ' triệu' : Math.round(n / 1000) + 'k'; };
var esc = function (s) { return String(s || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
function luu() { try { localStorage.setItem('sg_tt_shop', JSON.stringify({ shop: $('shop').value, dc: $('dc').value, dt: $('dt').value })); } catch (e) { } }
try { var o = JSON.parse(localStorage.getItem('sg_tt_shop') || '{}'); ['shop', 'dc', 'dt'].forEach(function (k) { if (o[k]) $(k).value = o[k]; }); } catch (e) { }
['shop', 'dc', 'dt'].forEach(function (k) { $(k).oninput = luu; });

fetch('../kho/kho-may.json?v=' + Date.now()).then(function (r) { return r.json(); }).then(function (j) {
  KHO = j; var d = new Date(j.capNhat); $('capnhat').textContent = 'Kho máy cập nhật ' + d.toLocaleDateString('vi-VN') + ' · lịch cập nhật: ngày 10, ngày 20 và ngày cuối tháng';
  veHang();
}).catch(function () { $('capnhat').textContent = 'Chưa tải được kho máy'; });

function veHang() {
  var ten = { OPPO: 'OPPO', Samsung: 'Samsung', Xiaomi: 'Xiaomi', Apple: 'iPhone' };
  if (KHO) Object.keys(KHO.hang).forEach(function (h) { if (!ten[h]) ten[h] = h; });
  $('hang').innerHTML = Object.keys(ten).map(function (h) { var n = KHO && KHO.hang[h] ? KHO.hang[h].length : 0; return '<button data-h="' + h + '" class="' + (h === HANG ? 'on' : '') + '">' + ten[h] + ' <small style="opacity:.6">' + n + '</small></button>'; }).join('');
  [].forEach.call($('hang').children, function (b) { b.onclick = function () { HANG = b.dataset.h; veHang(); goiY(); $('tim').focus(); }; });
}
function goiY() {
  var q = $('tim').value.toLowerCase().trim(), ds = (KHO && KHO.hang[HANG]) || [];
  var kq = ds.filter(function (s) { return !q || s.ten.toLowerCase().indexOf(q) >= 0 || s.ten.toLowerCase().replace(/\s/g, '').indexOf(q.replace(/\s/g, '')) >= 0; }).slice(0, 30);
  $('goiy').style.display = 'block';
  $('goiy').innerHTML = kq.length ? kq.map(function (s, i) { var g = (s.bienThe || []).map(function (b) { return b.niemyet; }).filter(Boolean); return '<div data-i="' + ds.indexOf(s) + '"><span>' + esc(s.ten) + '</span><small>' + (s.mau && s.mau.length > 1 ? s.mau.length + ' màu' : '') + '</small></div>'; }).join('')
    : '<div style="cursor:default">Không có trong kho — <a target="_blank" href="https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(HANG + ' ' + $('tim').value) + '">tìm trên Google</a></div>';
  [].forEach.call($('goiy').querySelectorAll('[data-i]'), function (d) { d.onclick = function () { chonSP(ds[+d.dataset.i]); }; });
}
$('tim').oninput = goiY; $('tim').onfocus = goiY;
function chonSP(s) {
  SP = s; $('tim').value = s.ten; $('goiy').style.display = 'none'; $('chon').hidden = false;
  var bt = (s.bienThe && s.bienThe.length) ? s.bienThe : [{ dl: '', niemyet: 0, giaHang: 0 }];
  $('dl').innerHTML = bt.map(function (b, i) { return '<option value="' + i + '">' + (b.dl || 'Bản tiêu chuẩn') + '</option>'; }).join('');
  $('dl').onchange = function () { BT = bt[+$('dl').value]; tinh(); };
  $('dl').onchange();
  var ms = (s.mau && s.mau.length) ? s.mau : [{ ten: '', anh: '' }];
  $('mau').innerHTML = ms.map(function (m, i) { return '<button data-i="' + i + '" class="' + (i ? '' : 'on') + '"><img src="' + esc(anhCua(m)) + '" alt="">' + esc(m.ten || ('Màu ' + (i + 1))) + '</button>'; }).join('');
  MAU = ms[0];
  [].forEach.call($('mau').children, function (b) { b.onclick = function () { [].forEach.call($('mau').children, function (x) { x.classList.remove('on'); }); b.classList.add('on'); MAU = ms[+b.dataset.i]; }; });
}
$('anhShop').onchange = function () {
  var f = this.files && this.files[0]; if (!f) return; var r = new FileReader();
  r.onload = function () { var im = new Image(); im.onload = function () {
    var k = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    var ten = $('tim').value.trim() || 'Máy của shop';
    chonSP({ hang: HANG, ten: ten, bienThe: [], mau: [{ ten: 'Hình của shop', anh: c.toDataURL('image/png') }] });
  }; im.src = r.result; };
  r.readAsDataURL(f); this.value = '';
};
function anhCua(m) { return m.file ? '../' + m.file : (m.anh || ''); }
['ny', 'gb', 'gop', 'tro'].forEach(function (k) { $(k).addEventListener('input', function () { var v = so(this.value); this.value = v ? v.toLocaleString('vi-VN') : ''; tinh(); }); });
function giaTinh() {
  var ny = so($('ny').value), gb = so($('gb').value) || ny; if (!ny) ny = gb;
  var giam = Math.max(0, ny - gb);
  return { ny: ny, kmh: 0, kms: 0, giam: giam, cuoi: gb, pt: ny ? Math.round(giam / ny * 100) : 0 };
}
function tinh() {
  var g = giaTinh();
  $('tinh').innerHTML = '<div class="dong"><span>Giá niêm yết</span><span>' + (g.ny ? vnd(g.ny) : 'chưa có') + '</span></div>' +
    (g.giam ? '<div class="dong"><span>− Khuyến mãi</span><span>' + vnd(g.giam) + '</span></div>' : '') +
    '<div class="cuoi"><span>Giá cuối</span><span>' + (g.ny ? vnd(g.cuoi) : '—') + '</span></div>';
  $('canh').textContent = g.pt > 30 ? '⚠ Giảm ' + g.pt + '% so với niêm yết — kiểm tra lại có gõ thiếu/thừa số 0 không.' : (g.giam ? 'Tổng giảm ' + vnd(g.giam) + ' (' + g.pt + '%)' : '');
}
tinh();

function D() {
  var g = giaTinh();
  return { ten: SP ? SP.ten : '', dl: BT && BT.dl ? BT.dl : '', mau: MAU ? MAU.ten : '', anh: MAU ? anhCua(MAU) : '', g: g,
    qua: $('qua').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean).slice(0, 3),
    gop: so($('gop').value), tro: so($('tro').value),
    diem: $('diem').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean).slice(0, 4),
    shop: $('shop').value || 'Tên shop', dc: $('dc').value || 'Địa chỉ shop', dt: $('dt').value || 'Số điện thoại' };
}
function chan(d, nen, chu, nhan) { return '<div class="chan" style="background:' + nen + ';color:' + chu + '"><div><b>' + esc(d.shop) + '</b>' + esc(d.dc) + '</div><div style="text-align:right"><span style="font-size:22px;opacity:.75">' + (nhan || 'Gọi / Zalo') + '</span><div class="dt">' + esc(d.dt) + '</div></div></div>'; }
function khoiGia(d, mauChu, mauNhan, chuNhan, co) {
  var g = d.g; co = co || 100; if (!g.ny) return '';
  var nhan = g.giam ? '<span class="nhan" style="background:' + mauNhan + ';color:' + chuNhan + '">Giảm ' + gon(g.giam) + (g.pt >= 10 ? ' · −' + g.pt + '%' : '') + '</span>' : '';
  return (g.giam ? '<div class="gach" style="font-size:' + Math.round(co * .36) + 'px">' + vnd(g.ny) + '</div>' : '') +
    '<div class="d" style="font-size:' + co + 'px;color:' + mauChu + '">' + g.cuoi.toLocaleString('vi-VN') + '<span style="font-size:' + Math.round(co * .5) + 'px">đ</span></div>' +
    (nhan ? '<div style="margin-top:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">' + nhan + (g.kmh && g.kms ? '<span style="font-size:24px;opacity:.85">Hãng giảm ' + gon(g.kmh) + ' · Shop giảm ' + gon(g.kms) + '</span>' : '') + '</div>' : '');
}
function may(d, style) { return d.anh ? '<img class="may" src="' + esc(d.anh) + '" style="' + style + '">' : ''; }
var MAU5 = [
 ['Máy mới về', function (d) {
  var diem = d.diem.length ? d.diem : [d.dl, d.mau].filter(Boolean);
  return '<div class="k" style="background:radial-gradient(circle at 72% 38%,#2a8fd6 0,#0b3f7c 48%,#06223f 100%)">' +
   may(d, 'right:-20px;top:120px;width:520px;height:880px') +
   '<div style="position:absolute;left:64px;top:70px;width:580px"><span class="pill" style="background:#ffd23f;color:#3a2a00">● ĐÃ CÓ HÀNG</span>' +
   '<div class="d" style="font-size:96px;margin-top:30px">' + esc(d.ten) + '</div>' +
   '<div style="font-size:30px;opacity:.85;margin-top:14px">' + esc([d.dl, d.mau].filter(Boolean).join(' · ')) + '</div>' +
   '<div style="display:flex;flex-direction:column;gap:12px;margin-top:40px">' + diem.map(function (t) { return '<div style="font-size:32px;font-weight:700;display:flex;gap:14px;align-items:center"><span style="color:#ffd23f">✦</span>' + esc(t) + '</div>'; }).join('') + '</div>' +
   '<div style="margin-top:44px">' + khoiGia(d, '#ffd23f', '#ffd23f', '#3a2a00', 92) + '</div></div>' + chan(d, '#fff', '#06223f') + '</div>';
 }],
 ['Giá sốc + quà', function (d) {
  return '<div class="k" style="background:#fff4e6"><div style="position:absolute;inset:0;background:linear-gradient(160deg,#ff5a1f 0,#e8231a 55%,#b3121a 100%);clip-path:polygon(0 0,100% 0,100% 62%,0 76%)"></div>' +
   may(d, 'right:0;top:150px;width:420px;height:720px') +
   '<div style="position:absolute;left:64px;top:70px;width:620px"><span class="pill" style="background:#fff;color:#d61f1a">⚡ GIÁ SỐC</span>' +
   '<div class="d" style="font-size:84px;margin-top:28px">' + esc(d.ten) + '</div><div style="font-size:30px;margin-top:10px;opacity:.9">' + esc(d.dl) + '</div>' +
   '<div style="margin-top:36px">' + khoiGia(d, '#ffe14d', '#fff', '#c21a12', 104) + '</div></div>' +
   (d.qua.length ? '<div style="position:absolute;left:64px;right:64px;top:960px;background:#fff;border-radius:28px;padding:26px 34px;color:#3b1d12;box-shadow:0 20px 50px rgba(150,30,10,.18)"><div style="font-size:24px;font-weight:900;color:#d61f1a;letter-spacing:.08em">QUÀ TẶNG KÈM</div><div style="display:flex;gap:20px;margin-top:10px;font-size:28px;font-weight:700">' + d.qua.map(function (q) { return '<div style="flex:1">🎁 ' + esc(q) + '</div>'; }).join('') + '</div></div>' : '') +
   chan(d, '#3b1d12', '#fff', 'Số lượng có hạn · Gọi ngay') + '</div>';
 }],
 ['Trả góp', function (d) {
  var gop = d.gop || (d.g.cuoi ? Math.ceil(d.g.cuoi / 12 / 1000) * 1000 : 0);
  return '<div class="k" style="background:#f2f7f4;color:#0d3b2e">' + may(d, 'right:20px;top:470px;width:460px;height:700px') +

function _rand(seed) { var x = seed % 2147483647; if (x <= 0) x += 2147483646; return function () { x = x * 16807 % 2147483647; return (x - 1) / 2147483646; }; }
